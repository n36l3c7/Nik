title: WinRM Host Process Starts a Shell or a Recon Tool
id: 8d58ed6c-40df-4b38-8090-6a986e567a1e
name: nik_chain_winrm_starts_process
status: test
description: wsmprovhost.exe, the process that carries a PowerShell remoting or WinRM session, started a shell or a tool that looks around the system or the domain.
author: Nik
date: '2026-11-25'
tags:
- attack.lateral-movement
- attack.t1021.006
- attack.execution
- attack.t1059.001
logsource:
  product: nik
  service: process-chain
detection:
  selection_parent:
    ParentImage|endswith: \wsmprovhost.exe
  selection_child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \net.exe
    - \net1.exe
    - \whoami.exe
    - \nltest.exe
    - \wmic.exe
    - \reg.exe
    - \rundll32.exe
    - \mshta.exe
    - \certutil.exe
    - \bitsadmin.exe
  condition: selection_parent and selection_child
falsepositives:
- Administrators and configuration tools that use remoting
level: medium
