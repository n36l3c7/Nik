title: 'Security Tool or Auditing Disabled (process command line)'
id: 1e1bbda1-9191-4a6a-98ed-bb87df7fef99
status: stable
description: 'Antivirus, EDR, SELinux or auditing is disabled (Defender preferences, AMSI, setenforce, auditd), on the command line of a process (Sysmon 1, Security 4688).'
author: Nik
date: 2026-11-25
tags:
    - attack.defense-evasion
    - attack.t1562
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        - CommandLine|contains:
              - 'set-mppreference'
              - 'amsiutils'
              - 'amsi.dll'
    condition: selection
falsepositives:
    - An administrator who runs the same command on purpose
level: high
