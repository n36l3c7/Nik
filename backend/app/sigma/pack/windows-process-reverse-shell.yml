title: 'Reverse or Bind Shell (process command line)'
id: 39fec6a3-bdb4-40cf-b47f-618868419874
status: stable
description: 'A classic reverse or bind shell one-liner (netcat -e, /dev/tcp, socat exec), on the command line of a process (Sysmon 1, Security 4688).'
author: Nik
date: 2026-11-25
tags:
    - attack.execution
    - attack.t1059
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        - CommandLine|re|i:
              - '\bnc(at)?\b[^|]*\s-e\s'
              - 'socat\b.*exec'
    condition: selection
falsepositives:
    - An administrator who runs the same command on purpose
level: high
