title: 'Suspicious PowerShell Engine Start or Pipeline'
id: 6cd413c7-04b9-47b2-baaf-967d70c630ca
status: stable
description: 'The classic PowerShell log (400, 800) shows an encoded command, a download cradle, Invoke-Expression, a hidden window or AMSI tampering.'
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Nik
date: 2026-11-25
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    service: powershell-classic
detection:
    suspicious:
        - Data1|contains:
              - 'frombase64string'
              - 'downloadstring'
              - 'downloadfile'
              - 'net.webclient'
              - 'invoke-webrequest'
              - 'invoke-expression'
              - 'start-bitstransfer'
              - 'amsiutils'
              - 'amsiinitfailed'
              - 'reflection.assembly]::load'
        - Data1|re|i:
              - '-e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,}'
              - '\biwr\s'
              - '\biex\b'
              - '-w(indowstyle)?\s+h(idden)?\b'
        - Data2|contains:
              - 'frombase64string'
              - 'downloadstring'
              - 'downloadfile'
              - 'net.webclient'
              - 'invoke-webrequest'
              - 'invoke-expression'
              - 'start-bitstransfer'
              - 'amsiutils'
              - 'amsiinitfailed'
              - 'reflection.assembly]::load'
        - Data2|re|i:
              - '-e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,}'
              - '\biwr\s'
              - '\biex\b'
              - '-w(indowstyle)?\s+h(idden)?\b'
        - Data3|contains:
              - 'frombase64string'
              - 'downloadstring'
              - 'downloadfile'
              - 'net.webclient'
              - 'invoke-webrequest'
              - 'invoke-expression'
              - 'start-bitstransfer'
              - 'amsiutils'
              - 'amsiinitfailed'
              - 'reflection.assembly]::load'
        - Data3|re|i:
              - '-e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,}'
              - '\biwr\s'
              - '\biex\b'
              - '-w(indowstyle)?\s+h(idden)?\b'
    condition: suspicious
falsepositives:
    - Administration scripts that download or decode on purpose
level: high
