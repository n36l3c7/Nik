title: 'Remote Content Piped Into a Shell (process command line)'
id: 109702b3-73a1-4144-9b07-724ba409da24
status: stable
description: 'Remote content is downloaded and piped straight into a shell interpreter, on the command line of a process (Sysmon 1, Security 4688).'
author: Nik
date: 2026-11-25
tags:
    - attack.command-and-control
    - attack.execution
    - attack.t1105
    - attack.t1059
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        - CommandLine|re|i:
              - 'iwr\b.*\|\s*iex'
              - 'iex\s*\(.*(iwr|downloadstring)'
    condition: selection
falsepositives:
    - An administrator who runs the same command on purpose
level: high
