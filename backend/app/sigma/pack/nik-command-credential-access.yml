title: 'Command: Credential Store Access or Dumping Tool'
id: c902151b-1c9a-4c98-9129-e4e5e865ef85
status: stable
description: 'A command reads a credential store (shadow file, LSASS, NTDS) or runs a dumping tool.'
author: Nik
date: 2026-11-25
tags:
    - attack.credential-access
    - attack.t1003
logsource:
    product: nik
    service: commands
detection:
    selection:
        - command|contains:
              - '/etc/shadow'
              - 'mimikatz'
              - 'lazagne'
              - 'secretsdump'
              - 'hashdump'
              - 'ntds.dit'
              - 'lsass'
    condition: selection
falsepositives:
    - An administrator who runs the same command on purpose
level: high
