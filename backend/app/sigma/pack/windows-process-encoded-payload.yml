title: 'Encoded Payload Decoded (process command line)'
id: ca7b98e3-28dc-46e7-ba93-8d0e0f4d683a
status: stable
description: 'A base64 or encoded payload is decoded or run, a common obfuscation step, on the command line of a process (Sysmon 1, Security 4688).'
author: Nik
date: 2026-11-25
tags:
    - attack.defense-evasion
    - attack.t1140
    - attack.t1027
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        - CommandLine|contains:
              - 'frombase64string'
              - '-encodedcommand'
        - CommandLine|re|i:
              - '\s-enc\s'
              - 'certutil.*-decode'
    condition: selection
falsepositives:
    - An administrator who runs the same command on purpose
level: high
