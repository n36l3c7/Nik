title: 'Bulk Transfer Toward a Remote Host (process command line)'
id: 9c6d0818-8d95-4890-964d-5b02feda9e61
status: stable
description: 'Data is sent to a remote host in bulk (rclone, scp, a curl upload, tar over ssh), on the command line of a process (Sysmon 1, Security 4688).'
author: Nik
date: 2026-11-25
tags:
    - attack.exfiltration
    - attack.t1048
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        - CommandLine|re|i:
              - '\brclone\b'
              - 'curl\s+(-T|--upload-file)'
              - 'tar\b[^|;&]*\|\s*ssh'
              - 'scp\s+[^|;&]*@'
    condition: selection
falsepositives:
    - An administrator who runs the same command on purpose
level: medium
