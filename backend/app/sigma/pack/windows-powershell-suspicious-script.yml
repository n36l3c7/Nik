title: 'Suspicious PowerShell Script Block'
id: eb576345-ff1c-4dfc-a748-62301739fd01
status: stable
description: 'A PowerShell script block or module log (4104, 4103) holds an encoded command, a download cradle, Invoke-Expression, a hidden window or AMSI tampering.'
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Nik
date: 2026-11-25
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    service: powershell
detection:
    suspicious:
        - ScriptBlockText|contains:
              - 'frombase64string'
              - 'downloadstring'
              - 'downloadfile'
              - 'net.webclient'
              - 'invoke-webrequest'
              - 'invoke-expression'
              - 'start-bitstransfer'
              - 'amsiutils'
              - 'amsiinitfailed'
              - 'reflection.assembly]::load'
        - ScriptBlockText|re|i:
              - '-e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,}'
              - '\biwr\s'
              - '\biex\b'
              - '-w(indowstyle)?\s+h(idden)?\b'
        - Payload|contains:
              - 'frombase64string'
              - 'downloadstring'
              - 'downloadfile'
              - 'net.webclient'
              - 'invoke-webrequest'
              - 'invoke-expression'
              - 'start-bitstransfer'
              - 'amsiutils'
              - 'amsiinitfailed'
              - 'reflection.assembly]::load'
        - Payload|re|i:
              - '-e(nc|ncodedcommand)?\s+[A-Za-z0-9+/=]{20,}'
              - '\biwr\s'
              - '\biex\b'
              - '-w(indowstyle)?\s+h(idden)?\b'
    condition: suspicious
falsepositives:
    - Administration scripts that download or decode on purpose
level: high
