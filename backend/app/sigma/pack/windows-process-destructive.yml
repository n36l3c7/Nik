title: 'Destructive Operation (process command line)'
id: 89cd4fb8-ec12-4406-a6a9-15fd42f3de6d
status: stable
description: 'A filesystem wipe or the deletion of shadow copies, the pattern of ransomware, on the command line of a process (Sysmon 1, Security 4688).'
author: Nik
date: 2026-11-25
tags:
    - attack.impact
    - attack.t1485
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        - CommandLine|re|i:
              - 'vssadmin\s+delete\s+shadows'
    condition: selection
falsepositives:
    - An administrator who runs the same command on purpose
level: high
