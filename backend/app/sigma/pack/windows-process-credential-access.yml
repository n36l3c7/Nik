title: 'Credential Store Access or Dumping Tool (process command line)'
id: 2824b8dd-db2b-4821-ae91-ec9790e6a894
status: stable
description: 'A command reads a credential store (shadow file, LSASS, NTDS) or runs a dumping tool, on the command line of a process (Sysmon 1, Security 4688).'
author: Nik
date: 2026-11-25
tags:
    - attack.credential-access
    - attack.t1003
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        - CommandLine|contains:
              - 'mimikatz'
              - 'lazagne'
              - 'secretsdump'
              - 'hashdump'
              - 'ntds.dit'
              - 'lsass'
    condition: selection
falsepositives:
    - An administrator who runs the same command on purpose
level: high
