title: 'Network or Directory Reconnaissance (process command line)'
id: cef4f402-6423-40c7-8904-e4b813911ede
status: stable
description: 'A network or Active Directory reconnaissance or scanning tool is run, on the command line of a process (Sysmon 1, Security 4688).'
author: Nik
date: 2026-11-25
tags:
    - attack.discovery
    - attack.t1046
    - attack.t1082
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        - CommandLine|contains:
              - 'masscan'
              - 'smbclient'
              - 'bloodhound'
              - 'sharphound'
        - CommandLine|re|i:
              - '\bnmap\b'
              - 'whoami\s*/priv'
              - 'net\s+group\s+.domain'
    condition: selection
falsepositives:
    - An administrator who runs the same command on purpose
level: medium
