# SentinelOne Singularity, the management console (EDR), through its Management API v2.1.
#
# Written from SentinelOne's own reference of the API (the one the console
# shows to a signed-in user): every path, method, parameter and body here is
# as that reference gives it. Three things it does not give, and where they
# come from, are said beside the commands they concern: the values of its
# enumerations (it names the type and prints no value), the number of the
# activity that announces an upload, and the shape of two answers it leaves
# out. Not run against a real console: see "verified" below.
#
# The token is one of a service user (Settings, Users, Service Users), with a
# role that may do what the commands used do: viewing is enough for the "get"
# ones; the README says what each group of the others needs.
#
# A command that acts on endpoints or threats always names them: by id, or by
# a filter that must be given and may not hold an empty field. SentinelOne
# applies an action with an empty filter to everything the token reaches, so
# such a request is stopped here, before it is sent.
#
# Lists are read by cursor, 1000 items a page at most (the reference's limit).
#
# Fetching brings in the threats created since the last cycle, oldest first.
name: SentinelOne EDR
id: sentinelone
version: 4
description: Agents, threats, alerts, the blocklist and exclusions, detection rules, remote scripts, forensic collections and threat intelligence of the SentinelOne console.
api_version: "Management API v2.1 (/web/api/v2.1)"
verified: false
configuration:
  - name: url
    label: Console address
    type: url
    required: true
    help: "https://your-tenant.sentinelone.net"
  - name: credentials
    type: header
    header: Authorization
    prefix: "ApiToken "
base_url: "{{ config.url }}/web/api/v2.1"
# The version of the console: it is refused without a token that is valid, and needs no permission on endpoints.
test:
  request: { method: GET, path: /system/info }
commands:
  # ---- Agents ----------------------------------------------------------------------------------------
  - name: get-agent
    description: "The agents that match: by a part of the computer name, by id, by user, by address, by state."
    arguments:
      - { name: computer_name, type: text, description: "A part of the computer name" }
      - { name: ids, type: text, description: "Agent ids, separated by commas (or a list)" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: uuid, type: text, description: "The UUID of the agent" }
      - { name: network_statuses, type: list, description: "Only these network states: connected, connecting, disconnected, disconnecting" }
      - { name: is_active, type: bool, description: "Only agents that are talking to the console now (true) or that are not (false)" }
      - { name: infected, type: bool, description: "Only agents with a threat that is still active" }
      - { name: external_ip, type: text, description: "A part of the address the console sees the endpoint come from" }
      - { name: user_name, type: text, description: "A part of the name of the last user who signed in" }
      - { name: os_types, type: list, description: "Only these operating systems: windows, macos, linux" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /agents
      query:
        computerName__like: "{{ args.computer_name }}"
        ids: "{{ args.ids | join(',') }}"
        query: "{{ args.query }}"
        uuid: "{{ args.uuid }}"
        networkStatuses: "{{ args.network_statuses | join(',') }}"
        isActive: "{{ args.is_active }}"
        infected: "{{ args.infected }}"
        externalIp__contains: "{{ args.external_ip }}"
        lastLoggedInUserName__contains: "{{ args.user_name }}"
        osTypes: "{{ args.os_types | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      agents: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      agent_id: "{{ response.items[0].id }}"
      computer_name: "{{ response.items[0].computerName }}"
      network_status: "{{ response.items[0].networkStatus }}"
      is_active: "{{ response.items[0].isActive }}"
      infected: "{{ response.items[0].infected }}"
      os_type: "{{ response.items[0].osType }}"
      site_id: "{{ response.items[0].siteId }}"
      group_id: "{{ response.items[0].groupId }}"
      last_user: "{{ response.items[0].lastLoggedInUserName }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: count-agents
    description: "How many agents match, without reading them: to know how many an action would reach."
    arguments:
      - { name: computer_name, type: text, description: "A part of the computer name" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: uuid, type: text, description: "The UUID of the agent" }
      - { name: network_statuses, type: list, description: "Only these network states: connected, connecting, disconnected, disconnecting" }
      - { name: is_active, type: bool, description: "Only agents that are talking to the console now (true) or that are not (false)" }
      - { name: infected, type: bool, description: "Only agents with a threat that is still active" }
      - { name: external_ip, type: text, description: "A part of the address the console sees the endpoint come from" }
      - { name: user_name, type: text, description: "A part of the name of the last user who signed in" }
      - { name: os_types, type: list, description: "Only these operating systems: windows, macos, linux" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
    request:
      method: GET
      path: /agents/count
      query:
        computerName__like: "{{ args.computer_name }}"
        query: "{{ args.query }}"
        uuid: "{{ args.uuid }}"
        networkStatuses: "{{ args.network_statuses | join(',') }}"
        isActive: "{{ args.is_active }}"
        infected: "{{ args.infected }}"
        externalIp__contains: "{{ args.external_ip }}"
        lastLoggedInUserName__contains: "{{ args.user_name }}"
        osTypes: "{{ args.os_types | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      total: "{{ response.data.total }}"

  - name: get-agent-applications
    description: "The applications installed on one endpoint, as its agent last reported them."
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent" }
    request:
      method: GET
      path: /agents/applications
      query:
        ids: "{{ if(args.agent_id, args.agent_id, args.agent_id.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      applications: "{{ response.data }}"
      names: "{{ response.data | pluck('name') }}"
      count: "{{ response.data | length }}"

  - name: export-agents
    description: "The agents that match, as the CSV file the console exports (50 000 lines at most), kept as an artifact."
    arguments:
      - { name: computer_name, type: text, description: "A part of the computer name" }
      - { name: ids, type: text, description: "Agent ids, separated by commas (or a list)" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: uuid, type: text, description: "The UUID of the agent" }
      - { name: network_statuses, type: list, description: "Only these network states: connected, connecting, disconnected, disconnecting" }
      - { name: is_active, type: bool, description: "Only agents that are talking to the console now (true) or that are not (false)" }
      - { name: infected, type: bool, description: "Only agents with a threat that is still active" }
      - { name: external_ip, type: text, description: "A part of the address the console sees the endpoint come from" }
      - { name: user_name, type: text, description: "A part of the name of the last user who signed in" }
      - { name: os_types, type: list, description: "Only these operating systems: windows, macos, linux" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
    request:
      method: GET
      path: /export/agents
      query:
        computerName__like: "{{ args.computer_name }}"
        ids: "{{ args.ids | join(',') }}"
        query: "{{ args.query }}"
        uuid: "{{ args.uuid }}"
        networkStatuses: "{{ args.network_statuses | join(',') }}"
        isActive: "{{ args.is_active }}"
        infected: "{{ args.infected }}"
        externalIp__contains: "{{ args.external_ip }}"
        lastLoggedInUserName__contains: "{{ args.user_name }}"
        osTypes: "{{ args.os_types | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
      answer: file
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ response.artifact }}"
      name: "{{ response.name }}"
      sha256: "{{ response.sha256 }}"
      size: "{{ response.size }}"
      type: "{{ response.type }}"

  - name: get-endpoint-tags
    description: "The tags that can be put on endpoints, with how many endpoints carry each."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: key, type: text, description: "The key of the tag, exactly" }
      - { name: value, type: text, description: "The value of the tag, exactly" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: include_children, type: bool, description: "Also what the scopes under the one asked for hold" }
      - { name: include_parents, type: bool, description: "Also what the scopes above the one asked for hold" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /agents/tags
      query:
        ids: "{{ args.ids | join(',') }}"
        key: "{{ args.key }}"
        value: "{{ args.value }}"
        query: "{{ args.query }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        includeChildren: "{{ args.include_children }}"
        includeParents: "{{ args.include_parents }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      tags: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      tag_id: "{{ response.items[0].id }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  # ---- Agent actions ---------------------------------------------------------------------------------
  - name: isolate-agent
    description: "Cut an endpoint off the network: every connection is dropped but the one to the SentinelOne console, so it can still be analysed and cleaned."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
    request:
      method: POST
      path: /agents/actions/disconnect
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: reconnect-agent
    description: "Put an isolated endpoint back on the network."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
    request:
      method: POST
      path: /agents/actions/connect
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: scan-agent
    description: "Start a full disk scan on an endpoint: local drives only, and what it finds is handled as the policy says."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
    request:
      method: POST
      path: /agents/actions/initiate-scan
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: abort-agent-scan
    description: "Stop the full disk scan that is running on an endpoint."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
    request:
      method: POST
      path: /agents/actions/abort-scan
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: request-agent-logs
    description: "Ask an agent to upload its logs to the console. They arrive later as an upload of the agent: get-activities finds it, download-agent-upload keeps it."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
      - { name: agent_logs, type: bool, description: "The logs of the agent itself (only SentinelOne support can read them)" }
      - { name: endpoint_logs, type: bool, description: "The logs of the endpoint that a customer can read (Windows only)" }
      - { name: platform_logs, type: bool, description: "Have the agent collect the logs of the operating system now" }
    request:
      method: POST
      path: /agents/actions/fetch-logs
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
        data:
          agentLogs: "{{ args.agent_logs }}"
          customerFacingLogs: "{{ args.endpoint_logs }}"
          platformLogs: "{{ args.platform_logs }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  # The reference gives the address an upload is read from (/agents/{id}/uploads/{activity id}) and not the
  # number of the activity that announces it: the instance says it, from its own list of activity types.
  - name: fetch-agent-logs
    description: "Ask an agent for its logs, wait until it has uploaded them (15 minutes at most) and keep the archive as an artifact."
    changes_outside: true
    idempotent: false
    timeout: 120
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent" }
      - { name: activity_type, type: number, required: true, description: "The number of the activity the console writes when an agent uploads its logs: get-activity-types lists them" }
      - { name: agent_logs, type: bool, description: "The logs of the agent itself (only SentinelOne support can read them)" }
      - { name: endpoint_logs, type: bool, description: "The logs of the endpoint that a customer can read (Windows only)" }
      - { name: platform_logs, type: bool, description: "Have the agent collect the logs of the operating system now" }
    steps:
      # What the agent uploaded before, so that an older upload is not taken for this one.
      - name: before
        request:
          method: GET
          path: /activities
          query: { agentIds: "{{ args.agent_id }}", activityTypes: "{{ args.activity_type }}", sortBy: createdAt, sortOrder: desc, limit: 1 }
        error: { message: "{{ response.errors[0].detail }}" }
      - name: ask
        request:
          method: POST
          path: "/agents/actions/fetch-logs"
          json:
            filter: { ids: ["{{ if(args.agent_id, args.agent_id, args.agent_id.is_needed) }}"] }
            data: { agentLogs: "{{ args.agent_logs }}", customerFacingLogs: "{{ args.endpoint_logs }}", platformLogs: "{{ args.platform_logs }}" }
        error: { message: "{{ response.errors[0].detail }}" }
      - name: uploaded
        request:
          method: GET
          path: /activities
          query: { agentIds: "{{ args.agent_id }}", activityTypes: "{{ args.activity_type }}", sortBy: createdAt, sortOrder: desc, limit: 1 }
        error: { message: "{{ response.errors[0].detail }}" }
        poll:
          until:
            all:
              - { left: "{{ response.data[0].id }}", op: exists }
              - { left: "{{ response.data[0].id }}", op: ne, right: "{{ steps.before.response.data[0].id | default('') }}" }
          every: 15
          timeout: 900
      - name: download
        request:
          method: GET
          path: "/agents/{{ args.agent_id }}/uploads/{{ steps.uploaded.response.data[0].id }}"
          answer: file
        error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ steps.download.response.artifact }}"
      name: "{{ steps.download.response.name }}"
      sha256: "{{ steps.download.response.sha256 }}"
      size: "{{ steps.download.response.size }}"
      type: "{{ steps.download.response.type }}"
      activity_id: "{{ steps.uploaded.response.data[0].id }}"
    sample: { artifact: "", name: "", sha256: "", size: 0, type: "", activity_id: "" }

  # The reference says the files come as an archive opened with the password. That the archive is a zip is
  # known from the integrations published for other products, which open it as one.
  # The number of the activity (80) is not in the reference, which says to read it from the list of
  # activity types: it is the number that the integrations published for other products wait for.
  - name: fetch-agent-files
    description: "Have an agent upload up to 10 files of its endpoint (10 MB in all) as a zip protected by the password given, wait for it (15 minutes at most), keep it as an artifact and unpack it: each file inside becomes an artifact too."
    changes_outside: true
    idempotent: false
    timeout: 120
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent" }
      - { name: files, type: list, required: true, description: "The files, by their full path (10 at most; no wildcard): a list, or paths separated by commas" }
      - { name: password, type: text, required: true, description: "The password the archive is protected with. The console wants 10 characters or more, with upper and lower case letters, digits and symbols" }
      - { name: activity_type, type: number, default: 80, description: "The number of the activity the console writes when an agent has uploaded fetched files (get-activity-types lists them)" }
    steps:
      # What the agent uploaded before, so that an older upload is not taken for this one.
      - name: before
        request:
          method: GET
          path: /activities
          query: { agentIds: "{{ args.agent_id }}", activityTypes: "{{ args.activity_type }}", sortBy: createdAt, sortOrder: desc, limit: 1 }
        error: { message: "{{ response.errors[0].detail }}" }
      - name: ask
        request:
          method: POST
          path: "/agents/{{ if(args.agent_id, args.agent_id, args.agent_id.is_needed) }}/actions/fetch-files"
          json:
            data: { password: "{{ args.password }}", files: "{{ if(args.files | join(',') | split(',') | length > 0, args.files | join(',') | split(','), args.files.at_least_one) }}" }
        error: { message: "{{ response.errors[0].detail }}" }
      - name: uploaded
        request:
          method: GET
          path: /activities
          query: { agentIds: "{{ args.agent_id }}", activityTypes: "{{ args.activity_type }}", sortBy: createdAt, sortOrder: desc, limit: 1 }
        error: { message: "{{ response.errors[0].detail }}" }
        poll:
          until:
            all:
              - { left: "{{ response.data[0].id }}", op: exists }
              - { left: "{{ response.data[0].id }}", op: ne, right: "{{ steps.before.response.data[0].id | default('') }}" }
          every: 15
          timeout: 900
      - name: download
        request:
          method: GET
          path: "/agents/{{ args.agent_id }}/uploads/{{ steps.uploaded.response.data[0].id }}"
          answer: file
          unpack: { format: zip, password: "{{ args.password }}" }
        error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ steps.download.response.artifact }}"
      name: "{{ steps.download.response.name }}"
      sha256: "{{ steps.download.response.sha256 }}"
      size: "{{ steps.download.response.size }}"
      type: "{{ steps.download.response.type }}"
      activity_id: "{{ steps.uploaded.response.data[0].id }}"
      files: "{{ steps.download.response.files }}"
      count: "{{ steps.download.response.count }}"
      skipped: "{{ steps.download.response.skipped }}"
    sample: { artifact: "", name: "", sha256: "", size: 0, type: "", activity_id: "", files: [], count: 0, skipped: [] }

  - name: download-agent-upload
    description: "Keep as an artifact something an agent uploaded to the console (its logs, fetched files, a threat file), by the id of the activity that announced it. It is kept as it came: nik.unpack-artifact opens it when it is an archive, with the password the request that asked for it set."
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent" }
      - { name: activity_id, type: text, required: true, description: "The id of the activity that says the upload arrived (get-activities)" }
    request:
      method: GET
      path: "/agents/{{ if(args.agent_id, args.agent_id, args.agent_id.is_needed) }}/uploads/{{ if(args.activity_id, args.activity_id, args.activity_id.is_needed) }}"
      answer: file
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ response.artifact }}"
      name: "{{ response.name }}"
      sha256: "{{ response.sha256 }}"
      size: "{{ response.size }}"
      type: "{{ response.type }}"

  - name: refresh-agent-firewall-rules
    description: "Have an agent read its Firewall Control rules from the console now, instead of at its next cycle."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
      - { name: format, type: text, description: "The format of the configuration asked for: native for the file as the system keeps it" }
      - { name: state, type: text, description: "initial for the configuration from before the agent was installed (native format only)" }
    request:
      method: POST
      path: /agents/actions/fetch-firewall-rules
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
