        type: "{{ args.type }}"
        source: "{{ args.sources | join(',') }}"
        name__contains: "{{ args.name }}"
        externalId: "{{ args.external_id }}"
        uuids: "{{ args.uuids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
