      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      iocs: "{{ response.items }}"
      ids: "{{ response.items | pluck('uuid') }}"
      uuid: "{{ response.items[0].uuid }}"
      type: "{{ response.items[0].type }}"
      value: "{{ response.items[0].value }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: create-ioc
    description: "Add an indicator of compromise to the console's threat intelligence, for accounts, sites or the whole tenant: what agents see is matched against it until it expires."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: value, type: text, required: true, description: "The indicator: an address, a domain, a URL, a hash" }
      - { name: type, type: text, required: true, description: "Its kind, in upper case: DNS, IPV4, IPV6, MD5, SHA1, SHA256, URL" }
      - { name: valid_until, type: text, required: true, description: "When it expires, ISO 8601: the console wants one" }
      - { name: source, type: text, default: Nik, description: "Where it comes from" }
      - { name: method, type: text, default: EQUALS, description: "How it is compared, in upper case" }
      - { name: name, type: text, description: "A name for it" }
      - { name: description, type: text, description: "What is known of it" }
      - { name: external_id, type: text, description: "The id it has in the system it comes from" }
      - { name: severity, type: number, description: "How serious a match is, as a number" }
      - { name: labels, type: list, description: "Labels" }
      - { name: threat_actors, type: list, description: "The actors it is tied to" }
      - { name: malware_names, type: list, description: "The malware it is tied to" }
      - { name: account_ids, type: list, description: "The accounts it is for" }
      - { name: site_ids, type: list, description: "The sites it is for" }
      - { name: tenant, type: bool, description: "For the whole tenant (the global scope)" }
    request:
      method: POST
      path: /threat-intelligence/iocs
      json:
        data:
          - value: "{{ if(args.value, args.value, args.value.is_needed) }}"
            type: "{{ args.type }}"
            validUntil: "{{ args.valid_until }}"
            source: "{{ args.source }}"
            method: "{{ args.method }}"
            name: "{{ args.name }}"
            description: "{{ args.description }}"
            externalId: "{{ args.external_id }}"
            severity: "{{ args.severity }}"
            labels: "{{ if(args.labels, args.labels | join(',') | split(',')) }}"
            threatActors: "{{ if(args.threat_actors, args.threat_actors | join(',') | split(',')) }}"
            malwareNames: "{{ if(args.malware_names, args.malware_names | join(',') | split(',')) }}"
        filter:
          accountIds: "{{ if(args.account_ids, args.account_ids | join(',') | split(',')) }}"
          siteIds: "{{ if(args.site_ids, args.site_ids | join(',') | split(',')) }}"
          tenant: "{{ args.tenant }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      uuids: "{{ response.data[*].uuid }}"
      iocs: "{{ response.data }}"
    sample: { uuids: [""], iocs: [] }

  - name: delete-iocs
    description: "Delete indicators of compromise from the console's threat intelligence, by UUID, in the accounts named."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: uuids, type: text, required: true, description: "The UUID of the indicator, or several: a list, or UUIDs separated by commas" }
      - { name: account_ids, type: list, required: true, description: "The accounts they are deleted from: the console wants them said" }
    request:
      method: DELETE
      path: /threat-intelligence/iocs
      json:
        filter:
          uuids: "{{ if(args.uuids | join(',') | split(',') | length > 0, args.uuids | join(',') | split(','), args.uuids.at_least_one) }}"
          accountIds: "{{ if(args.account_ids | join(',') | split(',') | length > 0, args.account_ids | join(',') | split(','), args.account_ids.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: create-iocs-from-stix
    description: "Add the indicators of a STIX 2.1 bundle to the console's threat intelligence: file hashes, addresses, domains and URLs."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: bundle, type: object, required: true, description: "The bundle, as an object: {\"type\": \"bundle\", \"objects\": […]}" }
      - { name: account_ids, type: list, description: "The accounts they are for" }
      - { name: site_ids, type: list, description: "The sites they are for" }
      - { name: tenant, type: bool, description: "For the whole tenant (the global scope)" }
    request:
      method: POST
      path: /threat-intelligence/iocs/stix
      json:
        bundle: "{{ args.bundle }}"
        filter:
          accountIds: "{{ if(args.account_ids, args.account_ids | join(',') | split(',')) }}"
          siteIds: "{{ if(args.site_ids, args.site_ids | join(',') | split(',')) }}"
          tenant: "{{ args.tenant }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      uuids: "{{ response.data[*].uuid }}"
      iocs: "{{ response.data }}"
    sample: { uuids: [""], iocs: [] }

  - name: get-hash-verdict
    description: "What SentinelOne's reputation says of a SHA-1: malicious, not malicious, or unknown. SentinelOne marks this call as deprecated."
    arguments:
