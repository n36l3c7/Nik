  # The reference documents no answer for this one: the count is read where the console is known to put it.
  - name: move-agents-to-group
    description: "Move endpoints to another group of their site: they take the policy of that group (a group with a strict policy is a way to quarantine)."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: group_id, type: text, required: true, description: "The id of the group they go to" }
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
    request:
      method: PUT
      path: "/groups/{{ if(args.group_id, args.group_id, args.group_id.is_needed) }}/move-agents"
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      moved: "{{ first_of(response.data.agentsMoved, response.data.affected) }}"
    sample: { moved: 1 }

  - name: run-agent-action
    description: "Do one thing to every agent a filter matches, in the console's own filter fields. The filter is required and no field of it may be empty: count-agents says how many it reaches."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: action, type: choice, choices: [disconnect, connect, initiate-scan, abort-scan, restart-machine, shutdown, fetch-installed-apps, mark-up-to-date], required: true, description: "What to do" }
      - { name: filter, type: object, required: true, description: "The filter, as the console writes it: {\"groupIds\": [\"…\"], \"osTypes\": [\"windows\"], \"infected\": true}" }
    request:
      method: POST
      path: "/agents/actions/{{ args.action | map('disconnect', 'disconnect', 'connect', 'connect', 'initiate-scan', 'initiate-scan', 'abort-scan', 'abort-scan', 'restart-machine', 'restart-machine', 'shutdown', 'shutdown', 'fetch-installed-apps', 'fetch-installed-apps', 'mark-up-to-date', 'mark-up-to-date', else='none') }}"
      json:
        filter: "{{ if(args.filter | entries | length > 0 and args.filter | entries | where('value', 'empty') | length == 0, args.filter, args.filter.every_field_filled) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  # ---- Endpoint tags ---------------------------------------------------------------------------------
  - name: create-endpoint-tag
    description: "Make a tag that endpoints can carry: a key and a value."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: key, type: text, required: true, description: "The key of the tag" }
      - { name: value, type: text, required: true, description: "Its value" }
      - { name: description, type: text, description: "What it is for" }
      - { name: site_ids, type: list, description: "The sites it exists in (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "The groups it exists in" }
      - { name: account_ids, type: list, description: "The accounts it exists in" }
      - { name: tenant, type: bool, description: "For the whole tenant (the global scope)" }
    request:
      method: POST
      path: /tag-manager
      json:
        data:
          type: agents
          key: "{{ args.key }}"
          value: "{{ args.value }}"
          description: "{{ args.description }}"
        filter:
          siteIds: "{{ if(args.site_ids, args.site_ids | join(',') | split(',')) }}"
          groupIds: "{{ if(args.group_ids, args.group_ids | join(',') | split(',')) }}"
          accountIds: "{{ if(args.account_ids, args.account_ids | join(',') | split(',')) }}"
          tenant: "{{ args.tenant }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      tag_id: "{{ response.data.id }}"
      tag: "{{ response.data }}"
    sample: { tag_id: "", tag: {} }

  - name: update-endpoint-tag
    description: "Change the key, the value or the description of an endpoint tag."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: tag_id, type: text, required: true, description: "The id of the tag" }
      - { name: key, type: text, description: "The new key" }
      - { name: value, type: text, description: "The new value" }
      - { name: description, type: text, description: "The new description" }
    request:
      method: PUT
      path: "/tag-manager/{{ if(args.tag_id, args.tag_id, args.tag_id.is_needed) }}"
      json:
        data:
          key: "{{ args.key }}"
          value: "{{ args.value }}"
          description: "{{ args.description }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      tag_id: "{{ response.data.id }}"
      tag: "{{ response.data }}"
    sample: { tag_id: "", tag: {} }

  - name: delete-endpoint-tags
    description: "Delete endpoint tags, by id. The endpoints that carried them lose them."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: tag_id, type: text, required: true, description: "The id of the tag, or several: a list, or ids separated by commas" }
    request:
      method: DELETE
      path: /tag-manager
      json:
        filter:
          tagIds: "{{ if(args.tag_id | join(',') | split(',') | length > 0, args.tag_id | join(',') | split(','), args.tag_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  # ---- Threats ---------------------------------------------------------------------------------------
  - name: get-threats
    description: "Threats: by id, by the hash of the file, by state, by endpoint, by time."
    arguments:
      - { name: ids, type: text, description: "Threat ids, separated by commas (or a list)" }
      - { name: content_hash, type: text, description: "The SHA-1 of the file (or several, separated by commas)" }
      - { name: resolved, type: bool, description: "Only resolved ones (true) or only those still open (false): kept from the older API, incident_statuses says more" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: incident_statuses, type: list, description: "Only these incident states: unresolved, in_progress, resolved" }
      - { name: analyst_verdicts, type: list, description: "Only these verdicts of an analyst: undefined, true_positive, false_positive, suspicious" }
      - { name: confidence_levels, type: list, description: "Only these levels of confidence: malicious, suspicious" }
      - { name: mitigation_statuses, type: list, description: "Only these states of mitigation: not_mitigated, mitigated, marked_as_benign" }
      - { name: agent_ids, type: list, description: "Only of these agents (ids, as a list or separated by commas)" }
      - { name: computer_name, type: text, description: "A part of the computer name" }
      - { name: storylines, type: list, description: "Only threats of these storylines" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: created_after, type: text, description: "Created at this moment or later, ISO 8601: 2026-11-16T00:00:00Z" }
      - { name: created_before, type: text, description: "Created at this moment or earlier, ISO 8601" }
      - { name: updated_after, type: text, description: "Changed at this moment or later, ISO 8601" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /threats
      query:
        ids: "{{ args.ids | join(',') }}"
        contentHashes: "{{ args.content_hash | join(',') }}"
        resolved: "{{ args.resolved }}"
        query: "{{ args.query }}"
        incidentStatuses: "{{ args.incident_statuses | join(',') }}"
        analystVerdicts: "{{ args.analyst_verdicts | join(',') }}"
        confidenceLevels: "{{ args.confidence_levels | join(',') }}"
        mitigationStatuses: "{{ args.mitigation_statuses | join(',') }}"
        agentIds: "{{ args.agent_ids | join(',') }}"
        computerName__contains: "{{ args.computer_name }}"
        storylines: "{{ args.storylines | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        createdAt__gte: "{{ args.created_after }}"
        createdAt__lte: "{{ args.created_before }}"
        updatedAt__gte: "{{ args.updated_after }}"
        sortBy: "{{ args.sort_by }}"
        sortOrder: "{{ args.sort_order }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      threats: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      threat_id: "{{ response.items[0].id }}"
      threat_name: "{{ response.items[0].threatInfo.threatName }}"
      classification: "{{ response.items[0].threatInfo.classification }}"
      confidence_level: "{{ response.items[0].threatInfo.confidenceLevel }}"
      analyst_verdict: "{{ response.items[0].threatInfo.analystVerdict }}"
      incident_status: "{{ response.items[0].threatInfo.incidentStatus }}"
      mitigation_status: "{{ response.items[0].threatInfo.mitigationStatus }}"
      sha1: "{{ response.items[0].threatInfo.sha1 }}"
      sha256: "{{ response.items[0].threatInfo.sha256 }}"
      file_path: "{{ response.items[0].threatInfo.filePath }}"
      storyline: "{{ response.items[0].threatInfo.storyline }}"
      agent_id: "{{ response.items[0].agentRealtimeInfo.agentId }}"
      computer_name: "{{ response.items[0].agentRealtimeInfo.agentComputerName }}"
      site_id: "{{ response.items[0].agentRealtimeInfo.siteId }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: get-threat-notes
    description: "The notes written on a threat."
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat" }
      - { name: creator, type: text, description: "A part of the name of who wrote the note" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: "/threats/{{ if(args.threat_id, args.threat_id, args.threat_id.is_needed) }}/notes"
      query:
        creator__like: "{{ args.creator }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      notes: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: add-note
    description: "Write a note on a threat."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat, or several: a list, or ids separated by commas" }
      - { name: text, type: text, required: true, description: "The note" }
    request:
      method: POST
      path: /threats/notes
      json:
        filter:
          ids: "{{ if(args.threat_id | join(',') | split(',') | length > 0, args.threat_id | join(',') | split(','), args.threat_id.at_least_one) }}"
        data:
          text: "{{ args.text }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: update-threat-note
    description: "Replace the text of a note of a threat."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat" }
      - { name: note_id, type: text, required: true, description: "The id of the note" }
      - { name: text, type: text, required: true, description: "The new text" }
    request:
      method: PUT
      path: "/threats/{{ if(args.threat_id, args.threat_id, args.threat_id.is_needed) }}/notes/{{ if(args.note_id, args.note_id, args.note_id.is_needed) }}"
      json:
        data:
          text: "{{ args.text }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      note_id: "{{ response.data.id }}"
      text: "{{ response.data.text }}"
      updated_at: "{{ response.data.updatedAt }}"
    sample: { note_id: "", text: "", updated_at: "" }

  - name: delete-threat-note
    description: "Delete a note of a threat."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat" }
      - { name: note_id, type: text, required: true, description: "The id of the note" }
    request:
      method: DELETE
      path: "/threats/{{ if(args.threat_id, args.threat_id, args.threat_id.is_needed) }}/notes/{{ if(args.note_id, args.note_id, args.note_id.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      success: "{{ response.data.success }}"
    sample: { success: true }

  - name: mitigate-threat
    description: "Act on a threat. kill stops the processes; quarantine moves the files away, encrypted; remediate undoes what the threat changed (Windows and macOS); rollback-remediation restores the files from the shadow copies (Windows); un-quarantine puts the files back; network-quarantine isolates the endpoint."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat, or several: a list, or ids separated by commas" }
      - { name: action, type: choice, choices: [kill, quarantine, remediate, rollback-remediation, un-quarantine, network-quarantine], required: true, description: "What to do" }
    request:
      method: POST
      path: "/threats/mitigate/{{ args.action | map('kill', 'kill', 'quarantine', 'quarantine', 'remediate', 'remediate', 'rollback-remediation', 'rollback-remediation', 'un-quarantine', 'un-quarantine', 'network-quarantine', 'network-quarantine', else='none') }}"
      json:
        filter:
          ids: "{{ if(args.threat_id | join(',') | split(',') | length > 0, args.threat_id | join(',') | split(','), args.threat_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: mitigate-threats
    description: "Act on every threat a filter matches, in the console's own filter fields. The filter is required and no field of it may be empty. The actions are those of mitigate-threat."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: action, type: choice, choices: [kill, quarantine, remediate, rollback-remediation, un-quarantine, network-quarantine], required: true, description: "What to do" }
      - { name: filter, type: object, required: true, description: "The filter, as the console writes it: {\"contentHashes\": [\"…\"], \"incidentStatuses\": [\"unresolved\"]}" }
    request:
      method: POST
      path: "/threats/mitigate/{{ args.action | map('kill', 'kill', 'quarantine', 'quarantine', 'remediate', 'remediate', 'rollback-remediation', 'rollback-remediation', 'un-quarantine', 'un-quarantine', 'network-quarantine', 'network-quarantine', else='none') }}"
      json:
        filter: "{{ if(args.filter | entries | length > 0 and args.filter | entries | where('value', 'empty') | length == 0, args.filter, args.filter.every_field_filled) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: add-threat-to-blocklist
    description: "Put the SHA-1 of the file of a threat in the blocklist, for the group, the site or the account of its endpoint, or for everyone: agents there stop the file from running."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat, or several: a list, or ids separated by commas" }
      - { name: target_scope, type: choice, choices: [group, site, account, tenant], required: true, description: "How far it applies, from the endpoint of the threat: its group, its site, its account, or the whole tenant" }
      - { name: description, type: text, description: "Why it is blocked" }
      - { name: ticket_id, type: text, description: "The id of a ticket elsewhere, written on the threat" }
      - { name: note, type: text, description: "A note written on the threat" }
    request:
      method: POST
      path: /threats/add-to-blacklist
      json:
        filter:
          ids: "{{ if(args.threat_id | join(',') | split(',') | length > 0, args.threat_id | join(',') | split(','), args.threat_id.at_least_one) }}"
        data:
          targetScope: "{{ args.target_scope }}"
          description: "{{ args.description }}"
          externalTicketId: "{{ args.ticket_id }}"
          note: "{{ args.note }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: add-threat-to-exclusions
    description: "Make an exclusion from a threat: agents stop raising it. An exclusion is a hole in the protection: only for what is surely harmless, as narrow as it can be."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat, or several: a list, or ids separated by commas" }
      - { name: target_scope, type: choice, choices: [group, site, account, tenant], required: true, description: "How far it applies, from the endpoint of the threat: its group, its site, its account, or the whole tenant" }
      - { name: type, type: text, required: true, description: "What is excluded, one of what get-exclusion-options gives for the threat: path, file_hash…" }
      - { name: mode, type: text, description: "For a path only: how much the agent stops looking at (the console's names: suppress…)" }
      - { name: value, type: text, description: "The value to exclude (the one of the threat when empty)" }
      - { name: path_exclusion_type, type: text, description: "For a path only: file, folder or subfolders" }
      - { name: description, type: text, description: "Why it is excluded" }
      - { name: ticket_id, type: text, description: "The id of a ticket elsewhere, written on the threat" }
      - { name: note, type: text, description: "A note written on the threat" }
    request:
      method: POST
      path: /threats/add-to-exclusions
      json:
        filter:
          ids: "{{ if(args.threat_id | join(',') | split(',') | length > 0, args.threat_id | join(',') | split(','), args.threat_id.at_least_one) }}"
        data:
          targetScope: "{{ args.target_scope }}"
          type: "{{ args.type }}"
          mode: "{{ args.mode }}"
          value: "{{ args.value }}"
          pathExclusionType: "{{ args.path_exclusion_type }}"
          description: "{{ args.description }}"
          externalTicketId: "{{ args.ticket_id }}"
          note: "{{ args.note }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: get-exclusion-options
    description: "The kinds of exclusion that can be made from a threat (a path, the hash of its file…)."
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat" }
    request:
      method: GET
      path: "/threats/{{ if(args.threat_id, args.threat_id, args.threat_id.is_needed) }}/whitening-options"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      options: "{{ response.data.whiteningOptions }}"
      threat_type: "{{ response.data.threatType }}"
      policy: "{{ response.data.threatPolicy }}"

  # The reference gives the request that asks (POST /threats/fetch-file) and the address an upload is read
  # from; the number of the activity that announces the upload (86) is the one that the integrations
  # published for other products wait for. The reference calls the password a file encryption password and
  # does not name the format: the upload is the zip those same integrations open.
  - name: fetch-threat-file
    description: "Have the agent upload the file of a threat as a zip protected by the password given, wait for it (15 minutes at most), keep it as an artifact and unpack it: the file inside becomes an artifact too. The endpoint must be reachable."
    changes_outside: true
    idempotent: false
    timeout: 120
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat" }
      - { name: password, type: text, required: true, description: "The password the archive is protected with (for fetched files the console wants 10 characters or more, with upper and lower case letters, digits and symbols)" }
      - { name: activity_type, type: number, default: 86, description: "The number of the activity the console writes when an agent has uploaded a threat file (get-activity-types lists them)" }
    steps:
      # What was uploaded for this threat before, so that an older upload is not taken for this one.
      - name: before
        request:
          method: GET
          path: /activities
          query: { threatIds: "{{ args.threat_id }}", activityTypes: "{{ args.activity_type }}", sortBy: createdAt, sortOrder: desc, limit: 1 }
        error: { message: "{{ response.errors[0].detail }}" }
      - name: ask
        request:
          method: POST
          path: /threats/fetch-file
          json:
            data: { password: "{{ args.password }}" }
            filter: { ids: ["{{ if(args.threat_id, args.threat_id, args.threat_id.is_needed) }}"] }
        error: { message: "{{ response.errors[0].detail }}" }
      - name: uploaded
        request:
          method: GET
          path: /activities
          query: { threatIds: "{{ args.threat_id }}", activityTypes: "{{ args.activity_type }}", sortBy: createdAt, sortOrder: desc, limit: 1 }
        error: { message: "{{ response.errors[0].detail }}" }
        poll:
          until:
            all:
              - { left: "{{ response.data[0].id }}", op: exists }
              - { left: "{{ response.data[0].id }}", op: ne, right: "{{ steps.before.response.data[0].id | default('') }}" }
          every: 15
          timeout: 900
      - name: download
        request:
          method: GET
          path: "/agents/{{ steps.uploaded.response.data[0].agentId }}/uploads/{{ steps.uploaded.response.data[0].id }}"
          answer: file
          unpack: { format: zip, password: "{{ args.password }}" }
        error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ steps.download.response.artifact }}"
      name: "{{ steps.download.response.name }}"
      sha256: "{{ steps.download.response.sha256 }}"
      size: "{{ steps.download.response.size }}"
      type: "{{ steps.download.response.type }}"
      agent_id: "{{ steps.uploaded.response.data[0].agentId }}"
      activity_id: "{{ steps.uploaded.response.data[0].id }}"
      files: "{{ steps.download.response.files }}"
      count: "{{ steps.download.response.count }}"
      skipped: "{{ steps.download.response.skipped }}"
    sample: { artifact: "", name: "", sha256: "", size: 0, type: "", agent_id: "", activity_id: "", files: [], count: 0, skipped: [] }

  - name: get-threat-cloud-link
    description: "Where the file of a threat can be downloaded from, when the console keeps it in its cloud: the link and the name of the file."
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat" }
    request:
      method: GET
      path: "/threats/{{ if(args.threat_id, args.threat_id, args.threat_id.is_needed) }}/download-from-cloud"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      download_url: "{{ response.data.downloadUrl }}"
      file_name: "{{ response.data.fileName }}"

  # The link is followed when it is on the host of the console. One that names another host is refused by Nik
  # (a connector reaches its own instance and the hosts it lists by name): the link itself is what
  # get-threat-cloud-link gives.
  - name: download-threat-from-cloud
    description: "Keep as an artifact the file of a threat that the console holds in its cloud, as it came. It follows the link only when the link is on the console itself. When it is on another host: get-threat-cloud-link gives the link, nik.download-file fetches it (the host must be among those the playbook may reach; no credentials go with it), and nik.unpack-artifact opens it when it is an archive."
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat" }
    steps:
      - name: link
        request: { method: GET, path: "/threats/{{ if(args.threat_id, args.threat_id, args.threat_id.is_needed) }}/download-from-cloud" }
        error: { message: "{{ response.errors[0].detail }}" }
      - name: download
        request:
          method: GET
          path: "{{ steps.link.response.data.downloadUrl }}"
          answer: file
          save_as: { name: "{{ steps.link.response.data.fileName }}" }
        error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ steps.download.response.artifact }}"
      name: "{{ steps.download.response.name }}"
      sha256: "{{ steps.download.response.sha256 }}"
      size: "{{ steps.download.response.size }}"
      type: "{{ steps.download.response.type }}"
      download_url: "{{ steps.link.response.data.downloadUrl }}"

  - name: get-threat-events
    description: "What the agent recorded around a threat: the processes, files, connections and registry changes of its storyline."
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat" }
      - { name: process_name, type: text, description: "A part of the name of the process" }
      - { name: event_types, type: list, description: "Only these kinds of event, as the console names them" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: "/threats/{{ if(args.threat_id, args.threat_id, args.threat_id.is_needed) }}/explore/events"
      query:
        processName__like: "{{ args.process_name }}"
        eventTypes: "{{ args.event_types | join(',') }}"
        sortBy: "{{ args.sort_by }}"
        sortOrder: "{{ args.sort_order }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      events: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: export-threat-events
    description: "The events around a threat as the file the console exports, kept as an artifact."
    arguments:
