  - name: get-log-collection-rules
    description: "The rules that say which logs the agents send to the Data Lake, for a scope."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: name, type: text, description: "A part of the name" }
      - { name: enabled, type: bool, description: "Only rules that are on (true) or off (false)" }
      - { name: agent_types, type: list, description: "Only for these kinds of agent, as the console names them" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: tenant, type: bool, description: "Ask at the level of the whole tenant (the global scope)" }
      - { name: include_children, type: bool, description: "Also what the scopes under the one asked for hold" }
      - { name: include_parents, type: bool, description: "Also what the scopes above the one asked for hold" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /log-collection/rules
      query:
        ids: "{{ args.ids | join(',') }}"
        name__contains: "{{ args.name }}"
        enabled: "{{ args.enabled }}"
        agentTypes: "{{ args.agent_types | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        tenant: "{{ args.tenant }}"
        includeChildren: "{{ args.include_children }}"
        includeParents: "{{ args.include_parents }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      rules: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  # ---- Remote scripts --------------------------------------------------------------------------------
  - name: get-scripts
    description: "The scripts of the script library that can be run on endpoints: SentinelOne's own and those uploaded."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: script_type, type: list, description: "Only these kinds: action, dataCollection, artifactCollection" }
      - { name: os_types, type: list, description: "Only these operating systems: windows, macos, linux" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /remote-scripts
      query:
        ids: "{{ args.ids | join(',') }}"
        query: "{{ args.query }}"
        scriptType: "{{ args.script_type | join(',') }}"
        osTypes: "{{ args.os_types | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        sortBy: "{{ args.sort_by }}"
        sortOrder: "{{ args.sort_order }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      scripts: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      script_id: "{{ response.items[0].id }}"
      script_name: "{{ response.items[0].scriptName }}"
      input_required: "{{ response.items[0].inputRequired }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: get-script-content
    description: "The text of a script of the library, to read it before running it."
    arguments:
      - { name: script_id, type: text, required: true, description: "The id of the script" }
    request:
      method: GET
      path: /remote-scripts/script-content
      query:
        scriptId: "{{ if(args.script_id, args.script_id, args.script_id.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      content: "{{ response.data.scriptContent }}"

  # The reference prints no value of the output destination: these are the ones the console offers.
  - name: run-script
    description: "Run a script of the library on endpoints, with the rights of the agent (the system). It answers at once with the id of the task: get-script-tasks follows it, download-script-result keeps its output."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
      - { name: script_id, type: text, required: true, description: "The id of the script (get-scripts)" }
      - { name: task_description, type: text, required: true, description: "A line that says why, kept with the task" }
      - { name: output_destination, type: text, default: SentinelCloud, description: "Where the output goes: SentinelCloud keeps it in the console (get-script-results then gives it), Local leaves it on the endpoint, None keeps none" }
      - { name: input_params, type: text, description: "What the script is given, when it takes input (get-scripts says how)" }
      - { name: output_directory, type: text, description: "For Local: the folder of the endpoint the output is written to" }
      - { name: password, type: text, description: "A password to protect the archive of the output with" }
      - { name: timeout_seconds, type: number, description: "How long the script may run on the endpoint" }
      - { name: requires_approval, type: bool, description: "Ask for the approval of a second person in the console before it runs" }
    request:
      method: POST
      path: /remote-scripts/execute
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
        data:
          scriptId: "{{ if(args.script_id, args.script_id, args.script_id.is_needed) }}"
          taskDescription: "{{ args.task_description }}"
          outputDestination: "{{ args.output_destination }}"
          inputParams: "{{ args.input_params }}"
          outputDirectory: "{{ args.output_directory }}"
          password: "{{ args.password }}"
          scriptRuntimeTimeoutSeconds: "{{ args.timeout_seconds }}"
          requiresApproval: "{{ args.requires_approval }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      parent_task_id: "{{ response.data.parentTaskId }}"
      affected: "{{ response.data.affected }}"
      pending: "{{ response.data.pending }}"
      pending_execution_id: "{{ response.data.pendingExecutionId }}"
    sample: { parent_task_id: "", affected: 1, pending: false, pending_execution_id: "" }

  - name: get-script-tasks
    description: "How the tasks of a run of a script are doing, one for each endpoint: created, pending, in progress, completed, failed."
    arguments:
      - { name: parent_task_id, type: text, description: "The id run-script gave: the console wants it, or ids" }
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: computer_name, type: text, description: "A part of the computer name" }
      - { name: statuses, type: list, description: "Only these states: created, pending, in_progress, completed, failed…" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /remote-scripts/status
      query:
        parentTaskId: "{{ args.parent_task_id }}"
        ids: "{{ args.ids | join(',') }}"
        computerName__contains: "{{ args.computer_name }}"
        status: "{{ args.statuses | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        sortBy: "{{ args.sort_by }}"
        sortOrder: "{{ args.sort_order }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      tasks: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      task_id: "{{ response.items[0].id }}"
      status: "{{ response.items[0].status }}"
      detailed_status: "{{ response.items[0].detailedStatus }}"
      agent_id: "{{ response.items[0].agentId }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: get-script-results
    description: "Where the output of finished script tasks can be downloaded from: a link and a file name for each task."
    arguments:
      - { name: task_id, type: text, required: true, description: "The id of the task (not of the run), or several: a list, or ids separated by commas" }
    request:
      method: POST
      path: /remote-scripts/fetch-files
      json:
        data:
          taskIds: "{{ if(args.task_id | join(',') | split(',') | length > 0, args.task_id | join(',') | split(','), args.task_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      links: "{{ response.data.downloadLinks }}"
      urls: "{{ response.data.downloadLinks | pluck('downloadUrl') }}"
      download_url: "{{ response.data.downloadLinks[0].downloadUrl }}"
      file_name: "{{ response.data.downloadLinks[0].fileName }}"
      errors: "{{ response.data.errors }}"

  # The link is followed when it is on the host of the console: see download-threat-from-cloud.
  - name: download-script-result
    description: "Keep as an artifact the output of a finished script task, as it came (the password the run set, if any, is what opens it). It follows the link only when the link is on the console itself. When it is on another host: get-script-results gives the link, nik.download-file fetches it (the host must be among those the playbook may reach; no credentials go with it), and nik.unpack-artifact opens it when it is an archive."
    arguments:
      - { name: task_id, type: text, required: true, description: "The id of the task (get-script-tasks)" }
    steps:
      - name: link
        request:
          method: POST
          path: /remote-scripts/fetch-files
          json: { data: { taskIds: ["{{ if(args.task_id, args.task_id, args.task_id.is_needed) }}"] } }
        error: { message: "{{ response.errors[0].detail }}" }
      - name: download
        request:
          method: GET
          path: "{{ steps.link.response.data.downloadLinks[0].downloadUrl }}"
          answer: file
          save_as: { name: "{{ steps.link.response.data.downloadLinks[0].fileName }}" }
        error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ steps.download.response.artifact }}"
      name: "{{ steps.download.response.name }}"
      sha256: "{{ steps.download.response.sha256 }}"
      size: "{{ steps.download.response.size }}"
      type: "{{ steps.download.response.type }}"
      download_url: "{{ steps.link.response.data.downloadLinks[0].downloadUrl }}"

  - name: upload-script
    description: "Add a script Nik holds as an artifact to the script library, for a scope. The console takes a new script as a file only: its text alone is accepted just to copy an existing one."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: file, type: file, required: true, description: "The script, as an artifact Nik holds" }
      - { name: script_name, type: text, required: true, description: "The name it has in the library" }
      - { name: script_type, type: text, required: true, description: "Its kind: action, dataCollection or artifactCollection" }
      - { name: scope_level, type: text, required: true, description: "The level it is for: site, account, group or tenant" }
      - { name: scope_id, type: text, description: "The id of that site, account or group" }
      - { name: os_types, type: list, description: "The operating systems it runs on: windows, macos, linux" }
      - { name: input_required, type: bool, default: false, description: "Whether it must be given input to run" }
      - { name: description, type: text, description: "What it does" }
      - { name: input_instructions, type: text, description: "How to write its input" }
      - { name: input_example, type: text, description: "An example of its input" }
      - { name: timeout_seconds, type: number, description: "How long it may run on an endpoint" }
    request:
      method: POST
      path: /remote-scripts
      multipart:
        scriptName: "{{ args.script_name }}"
        scriptType: "{{ args.script_type }}"
        scopeLevel: "{{ args.scope_level }}"
        scopeId: "{{ args.scope_id }}"
        osTypes: "{{ args.os_types | join(',') }}"
        inputRequired: "{{ args.input_required }}"
        scriptDescription: "{{ args.description }}"
        inputInstructions: "{{ args.input_instructions }}"
        inputExample: "{{ args.input_example }}"
        scriptRuntimeTimeoutSeconds: "{{ args.timeout_seconds }}"
      files: { file: { artifact: "{{ args.file }}" } }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      script_id: "{{ response.data.id }}"
      script: "{{ response.data }}"
    sample: { script_id: "", script: {} }

  - name: get-pending-script-runs
    description: "The runs of scripts that wait for a second person to approve them in the console."
    arguments:
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /remote-scripts/pending-executions
      query:
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        sortBy: "{{ args.sort_by }}"
        sortOrder: "{{ args.sort_order }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      runs: "{{ response.items }}"
      ids: "{{ response.items | pluck('pendingExecutionId') }}"
      pending_execution_id: "{{ response.items[0].pendingExecutionId }}"
      state: "{{ response.items[0].state }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  # The reference names the action as an enumeration without printing its values.
  - name: review-pending-script-run
    description: "Approve or decline a run of a script that waits for approval. Approved, the script runs on its endpoints."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: pending_execution_id, type: text, required: true, description: "The id of the waiting run" }
      - { name: action, type: text, required: true, description: "approve or decline, as the console names the two" }
    request:
      method: PUT
      path: "/remote-scripts/pending-executions/{{ if(args.pending_execution_id, args.pending_execution_id, args.pending_execution_id.is_needed) }}"
      json:
        data:
          action: "{{ args.action }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      success: "{{ response.data.success }}"
    sample: { success: true }

  - name: check-script-guardrail
    description: "Whether running a script on some agents would need the approval of a second person, as the guardrails of the console are set."
    arguments:
      - { name: script_id, type: text, required: true, description: "The id of the script" }
      - { name: agent_ids, type: list, description: "The agents it would run on: a list, or ids separated by commas" }
    request:
      method: POST
      path: /remote-scripts/guardrails/check
      json:
        data:
          scriptId: "{{ if(args.script_id, args.script_id, args.script_id.is_needed) }}"
          agentIds: "{{ if(args.agent_ids, args.agent_ids | join(',') | split(',')) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      requires_approval: "{{ response.data.requiresApproval }}"

  - name: schedule-script
    description: "Have a script of the library run on endpoints at a later time, once or again and again."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
      - { name: script_id, type: text, required: true, description: "The id of the script (get-scripts)" }
      - { name: task_description, type: text, required: true, description: "A line that says why, kept with the task" }
      - { name: output_destination, type: text, default: SentinelCloud, description: "Where the output goes: SentinelCloud keeps it in the console (get-script-results then gives it), Local leaves it on the endpoint, None keeps none" }
      - { name: input_params, type: text, description: "What the script is given, when it takes input (get-scripts says how)" }
      - { name: output_directory, type: text, description: "For Local: the folder of the endpoint the output is written to" }
      - { name: password, type: text, description: "A password to protect the archive of the output with" }
      - { name: timeout_seconds, type: number, description: "How long the script may run on the endpoint" }
      - { name: requires_approval, type: bool, description: "Ask for the approval of a second person in the console before it runs" }
      - { name: run_at, type: text, required: true, description: "When it runs, in UTC, ISO 8601: 2026-11-21T02:00:00Z" }
      - { name: time_zone, type: text, default: UTC, description: "The time zone the schedule is shown in" }
      - { name: expire_time, type: object, description: "When the schedule ends: {\"utc\": \"2026-12-21T02:00:00Z\", \"tz\": \"UTC\"}" }
      - { name: recurrence, type: object, description: "To run again and again: {\"unit\": …, \"interval\": 1}, with dayOfMonth for a monthly one" }
    request:
      method: POST
      path: /remote-ops/schedule/remote-script
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
        data:
          action:
            scriptId: "{{ if(args.script_id, args.script_id, args.script_id.is_needed) }}"
            taskDescription: "{{ args.task_description }}"
            outputDestination: "{{ args.output_destination }}"
            inputParams: "{{ args.input_params }}"
            outputDirectory: "{{ args.output_directory }}"
            password: "{{ args.password }}"
            scriptRuntimeTimeoutSeconds: "{{ args.timeout_seconds }}"
            requiresApproval: "{{ args.requires_approval }}"
          scheduling:
            scheduledTime:
              utc: "{{ args.run_at }}"
              tz: "{{ args.time_zone }}"
            expireTime: "{{ args.expire_time }}"
            recurrence: "{{ args.recurrence }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      scheduled_task_id: "{{ response.data.scheduledTaskId }}"
      affected: "{{ response.data.affected }}"
      pending_execution_id: "{{ response.data.pendingExecutionId }}"
    sample: { scheduled_task_id: "", affected: 1, pending_execution_id: "" }

  - name: get-scheduled-tasks
    description: "The scripts and forensic collections that are scheduled to run later."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: name, type: text, description: "A part of the name" }
      - { name: status, type: list, description: "Only these states" }
      - { name: type, type: list, description: "Only these kinds of task" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /remote-ops/scheduled-tasks
      query:
        ids: "{{ args.ids | join(',') }}"
        query: "{{ args.query }}"
        name__contains: "{{ args.name }}"
        status: "{{ args.status | join(',') }}"
        type: "{{ args.type | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        sortBy: "{{ args.sort_by }}"
        sortOrder: "{{ args.sort_order }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      tasks: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      scheduled_task_id: "{{ response.items[0].id }}"
      status: "{{ response.items[0].status }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: update-scheduled-task
    description: "Change when a scheduled task runs. The console wants the three parts of the schedule again: the time, the end and the recurrence."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: scheduled_task_id, type: text, required: true, description: "The id of the scheduled task" }
      - { name: run_at, type: text, required: true, description: "When it runs, in UTC, ISO 8601" }
      - { name: time_zone, type: text, default: UTC, description: "The time zone the schedule is shown in" }
      - { name: expire_time, type: object, required: true, description: "When the schedule ends: {\"utc\": …, \"tz\": …}" }
      - { name: recurrence, type: object, required: true, description: "How it repeats: {\"unit\": …, \"interval\": 1}" }
    request:
      method: PUT
      path: "/remote-ops/scheduled-tasks/{{ if(args.scheduled_task_id, args.scheduled_task_id, args.scheduled_task_id.is_needed) }}"
      json:
        data:
          scheduling:
            scheduledTime:
              utc: "{{ args.run_at }}"
              tz: "{{ args.time_zone }}"
            expireTime: "{{ args.expire_time }}"
            recurrence: "{{ args.recurrence }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      scheduled_task_id: "{{ response.data.scheduledTaskId }}"
    sample: { scheduled_task_id: "" }

  - name: delete-scheduled-tasks
    description: "Delete scheduled tasks, by id: they will not run. Those that cannot be deleted are skipped."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: scheduled_task_id, type: text, required: true, description: "The id of the scheduled task id, or several: a list, or ids separated by commas" }
    request:
      method: DELETE
      path: /remote-ops/scheduled-tasks
      json:
        filter:
          ids: "{{ if(args.scheduled_task_id | join(',') | split(',') | length > 0, args.scheduled_task_id | join(',') | split(','), args.scheduled_task_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      deleted: "{{ response.data.affected }}"
    sample: { deleted: [""] }

  # ---- Forensic collections --------------------------------------------------------------------------
  - name: get-forensic-profiles
    description: "The profiles a forensic collection can follow: each a set of artifacts to collect."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: os_types, type: list, description: "Only these operating systems: windows, macos, linux" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /remote-ops/forensics/collection-profiles
      query:
        ids: "{{ args.ids | join(',') }}"
        query: "{{ args.query }}"
        osTypes: "{{ args.os_types | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        sortBy: "{{ args.sort_by }}"
        sortOrder: "{{ args.sort_order }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      profiles: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      profile_id: "{{ response.items[0].id }}"
      name: "{{ response.items[0].name }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: get-forensic-profile
    description: "One collection profile, with the artifacts it collects."
    arguments:
      - { name: profile_id, type: text, required: true, description: "The id of the profile" }
    request:
      method: GET
      path: "/remote-ops/forensics/collection-profiles/{{ if(args.profile_id, args.profile_id, args.profile_id.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      profile: "{{ response.data }}"
      name: "{{ response.data.name }}"
      artifacts: "{{ response.data.artifacts }}"

  - name: get-forensic-artifact-types
    description: "Every kind of artifact a forensic collection can take, by operating system."
    request:
      method: GET
      path: /remote-ops/forensics/artifact-types
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      types: "{{ response.data }}"
      names: "{{ response.data | pluck('artifactType') }}"
      count: "{{ response.data | length }}"

  # The reference says this answers 202 and documents no body: the id of the task is read where the run of
  # a script puts it. get-script-tasks lists the tasks of the collection, one for each endpoint.
  - name: start-forensic-collection
    description: "Have agents collect the artifacts of a profile (event logs, prefetch, registry hives…) and upload them. It answers at once: get-forensic-collection follows the task, download-forensic-collection keeps the archive."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
      - { name: profile_id, type: text, required: true, description: "The id of the collection profile (get-forensic-profiles)" }
      - { name: password, type: text, description: "A password to protect the collected archive with" }
      - { name: destination_profile_id, type: text, description: "The id of a destination profile of the console, to send the collection there instead" }
      - { name: description, type: text, description: "A line that says why, kept with the task" }
      - { name: tag, type: text, description: "A tag for the collection" }
    request:
      method: POST
      path: /remote-ops/forensics/start-collection
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
        data:
          collectionProfileId: "{{ if(args.profile_id, args.profile_id, args.profile_id.is_needed) }}"
          destination:
            password: "{{ args.password }}"
            profileId: "{{ args.destination_profile_id }}"
          description: "{{ args.description }}"
          tag: "{{ args.tag }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      parent_task_id: "{{ response.data.parentTaskId }}"
      affected: "{{ response.data.affected }}"
    sample: { parent_task_id: "", affected: 1 }

  - name: get-forensic-collection
    description: "What a collection task gave: the state of each artifact, and what describes the collected file once it is uploaded."
    arguments:
      - { name: task_id, type: text, required: true, description: "The id of the task of one endpoint (get-script-tasks, from the id start-forensic-collection gave)" }
    request:
      method: GET
      path: /remote-ops/forensics/task-result
      query:
        taskId: "{{ if(args.task_id, args.task_id, args.task_id.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      collection: "{{ response.data.collection }}"
      artifacts: "{{ response.data.collection.artifacts }}"
      statuses: "{{ response.data.collection.artifacts | pluck('status') | unique }}"
      file: "{{ response.data.collectionFile }}"
      has_file: "{{ response.data.collectionFile.signature | default('') != '' }}"
      file_error: "{{ response.data.collectionFileError }}"
      profile_name: "{{ response.data.collectionProfile.name }}"

  - name: find-forensic-collection
    description: "Whether a collected file exists for a storyline of an agent (a collection the policy started by itself on a threat), and what describes it."
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent" }
      - { name: storyline, type: text, required: true, description: "The storyline" }
    request:
      method: GET
      path: /remote-ops/forensics/is-collection-file
      query:
        agentId: "{{ if(args.agent_id, args.agent_id, args.agent_id.is_needed) }}"
        storyline: "{{ if(args.storyline, args.storyline, args.storyline.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      agent_id: "{{ response.data.agentId }}"
      site_id: "{{ response.data.siteId }}"
      signature: "{{ response.data.signature }}"
      signature_type: "{{ response.data.signatureType }}"
      uploaded_at: "{{ response.data.uploadedTimestamp }}"

  - name: get-forensic-collection-link
    description: "A link, valid for a short time, to download a collected file, from what describes it (get-forensic-collection, find-forensic-collection)."
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent" }
      - { name: site_id, type: text, required: true, description: "The id of its site" }
      - { name: signature, type: text, required: true, description: "The signature of the collected file" }
      - { name: signature_type, type: text, required: true, description: "The kind of signature" }
      - { name: uploaded_at, type: text, required: true, description: "When the file was uploaded, as the console wrote it" }
    request:
      method: GET
      path: /remote-ops/forensics/collection-file-url
      query:
        agentId: "{{ if(args.agent_id, args.agent_id, args.agent_id.is_needed) }}"
        siteId: "{{ if(args.site_id, args.site_id, args.site_id.is_needed) }}"
        signature: "{{ if(args.signature, args.signature, args.signature.is_needed) }}"
        signatureType: "{{ args.signature_type }}"
        uploadedTimestamp: "{{ args.uploaded_at }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      download_url: "{{ response.data.downloadUrl }}"
      file_name: "{{ response.data.fileName }}"

  # The link is followed when it is on the host of the console: see download-threat-from-cloud.
  - name: download-forensic-collection
    description: "Keep as an artifact what a collection task uploaded, as it came (the password the collection set, if any, is what opens it). It follows the link only when the link is on the console itself. When it is on another host: get-forensic-collection-link gives the link, nik.download-file fetches it (the host must be among those the playbook may reach; no credentials go with it), and nik.unpack-artifact opens it when it is an archive."
    arguments:
      - { name: task_id, type: text, required: true, description: "The id of the task of one endpoint (get-script-tasks)" }
    steps:
      - name: result
        request:
          method: GET
          path: /remote-ops/forensics/task-result
          query: { taskId: "{{ if(args.task_id, args.task_id, args.task_id.is_needed) }}" }
        success: { when: { all: [{ left: "{{ response.data.collectionFile.signature }}", op: exists }] } }
        error: { message: "{{ first_of(response.errors[0].detail, response.data.collectionFileError, 'the task has no collected file yet') }}" }
      - name: link
        request:
          method: GET
          path: /remote-ops/forensics/collection-file-url
          query:
            agentId: "{{ steps.result.response.data.collectionFile.agentId }}"
            siteId: "{{ steps.result.response.data.collectionFile.siteId }}"
            signature: "{{ steps.result.response.data.collectionFile.signature }}"
            signatureType: "{{ steps.result.response.data.collectionFile.signatureType | default('') }}"
            uploadedTimestamp: "{{ steps.result.response.data.collectionFile.uploadedTimestamp }}"
        error: { message: "{{ response.errors[0].detail }}" }
      - name: download
        request:
          method: GET
          path: "{{ steps.link.response.data.downloadUrl }}"
          answer: file
          save_as: { name: "{{ steps.link.response.data.fileName }}" }
        error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ steps.download.response.artifact }}"
      name: "{{ steps.download.response.name }}"
      sha256: "{{ steps.download.response.sha256 }}"
      size: "{{ steps.download.response.size }}"
      type: "{{ steps.download.response.type }}"
      download_url: "{{ steps.link.response.data.downloadUrl }}"
      agent_id: "{{ steps.result.response.data.collectionFile.agentId }}"

  - name: schedule-forensic-collection
    description: "Have agents collect the artifacts of a profile at a later time, once or again and again."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
      - { name: profile_id, type: text, required: true, description: "The id of the collection profile (get-forensic-profiles)" }
      - { name: password, type: text, description: "A password to protect the collected archive with" }
      - { name: destination_profile_id, type: text, description: "The id of a destination profile of the console, to send the collection there instead" }
      - { name: description, type: text, description: "A line that says why, kept with the task" }
      - { name: tag, type: text, description: "A tag for the collection" }
      - { name: run_at, type: text, required: true, description: "When it runs, in UTC, ISO 8601: 2026-11-21T02:00:00Z" }
      - { name: time_zone, type: text, default: UTC, description: "The time zone the schedule is shown in" }
      - { name: expire_time, type: object, description: "When the schedule ends: {\"utc\": \"2026-12-21T02:00:00Z\", \"tz\": \"UTC\"}" }
      - { name: recurrence, type: object, description: "To run again and again: {\"unit\": …, \"interval\": 1}, with dayOfMonth for a monthly one" }
    request:
      method: POST
      path: /remote-ops/schedule/forensics
      json:
        filter:
          ids: "{{ if(args.agent_id | join(',') | split(',') | length > 0, args.agent_id | join(',') | split(','), args.agent_id.at_least_one) }}"
        data:
          action:
            collectionProfileId: "{{ if(args.profile_id, args.profile_id, args.profile_id.is_needed) }}"
            destination:
              password: "{{ args.password }}"
              profileId: "{{ args.destination_profile_id }}"
            description: "{{ args.description }}"
            tag: "{{ args.tag }}"
          scheduling:
            scheduledTime:
              utc: "{{ args.run_at }}"
              tz: "{{ args.time_zone }}"
            expireTime: "{{ args.expire_time }}"
            recurrence: "{{ args.recurrence }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      scheduled_task_id: "{{ response.data.scheduledTaskId }}"
      affected: "{{ response.data.affected }}"
    sample: { scheduled_task_id: "", affected: 1 }

  # ---- Threat intelligence ---------------------------------------------------------------------------
  # The reference prints no value of the kind of an indicator beyond saying it is written in upper case:
  # these are the ones the console lists.
  - name: get-iocs
    description: "The indicators of compromise the console matches what the agents see against: by value, by kind, by source."
    arguments:
      - { name: value, type: text, description: "The indicator, exactly" }
      - { name: type, type: text, description: "Only this kind: DNS, IPV4, IPV6, MD5, SHA1, SHA256, URL" }
      - { name: sources, type: list, description: "Only from these sources" }
      - { name: name, type: text, description: "A part of the name" }
      - { name: external_id, type: text, description: "The id it has in the system it came from" }
      - { name: uuids, type: list, description: "Only these, by UUID" }
