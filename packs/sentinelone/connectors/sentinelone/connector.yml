    request:
      method: GET
      path: "/export/threats/{{ if(args.threat_id, args.threat_id, args.threat_id.is_needed) }}/explore/events"
      answer: file
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ response.artifact }}"
      name: "{{ response.name }}"
      sha256: "{{ response.sha256 }}"
      size: "{{ response.size }}"
      type: "{{ response.type }}"

  - name: get-threat-timeline
    description: "What happened to a threat, in order: detection, what the agent did, what people did."
