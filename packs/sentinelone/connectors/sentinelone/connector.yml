  # ---- Custom detection rules ------------------------------------------------------------------------
  # The reference prints no value of the state, the severity nor the kind of a rule: the descriptions name
  # those the console shows, and get-detection-rules gives the ones an instance really uses.
  - name: get-detection-rules
    description: "The custom detection rules (STAR) of a scope: by name, by state, by severity."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: name, type: text, description: "A part of the name" }
      - { name: statuses, type: list, description: "Only these states: Active, Draft, Disabled…" }
      - { name: severities, type: list, description: "Only these severities: Low, Medium, High, Critical" }
      - { name: query_type, type: text, description: "Only this kind of rule: events, scheduled, correlation…" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /cloud-detection/rules
      query:
        ids: "{{ args.ids | join(',') }}"
        query: "{{ args.query }}"
        name__contains: "{{ args.name }}"
        statuses: "{{ args.statuses | join(',') }}"
        severities: "{{ args.severities | join(',') }}"
        queryType: "{{ args.query_type }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        sortBy: "{{ args.sort_by }}"
        sortOrder: "{{ args.sort_order }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      rules: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      rule_id: "{{ response.items[0].id }}"
      name: "{{ response.items[0].name }}"
      status: "{{ response.items[0].status }}"
      severity: "{{ response.items[0].severity }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: create-detection-rule
    description: "Make a custom detection rule for sites, groups, accounts or the whole tenant. Active, it raises alerts from then on; with network_quarantine it isolates endpoints by itself."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: name, type: text, required: true, description: "The name of the rule" }
      - { name: query, type: text, description: "What it looks for, in the query language of the rule: SrcProcCmdLine ContainsCIS \"-enc\"" }
      - { name: severity, type: text, required: true, description: "Its severity, as the console names it: Low, Medium, High, Critical" }
      - { name: status, type: text, default: Draft, description: "Its state: Active to start detecting, Draft or Disabled not to" }
      - { name: query_type, type: text, default: events, description: "The kind of rule: events for one that matches single events" }
      - { name: expiration_mode, type: text, default: Permanent, description: "Permanent, or Temporary with an expiration" }
      - { name: expiration, type: text, description: "For a temporary rule: when it stops, ISO 8601" }
      - { name: description, type: text, description: "What it is for" }
      - { name: query_language, type: text, description: "The version of the query language, when the console needs it said: 1.0, 2.0" }
      - { name: network_quarantine, type: bool, description: "Isolate the endpoint when the rule matches" }
      - { name: treat_as_threat, type: text, description: "Raise what it matches as a threat: Suspicious or Malicious (an alert only when empty)" }
      - { name: scheduled_params, type: object, description: "For a scheduled rule: the object the console calls scheduledParams (query, runIntervalMinutes, lookbackWindowMinutes…)" }
      - { name: correlation_params, type: object, description: "For a correlation rule: the object the console calls correlationParams" }
      - { name: cool_off, type: object, description: "Not to be alerted twice in a row for the same match: {\"renotifyMinutes\": 60}" }
      - { name: site_ids, type: list, description: "The sites it is for (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "The groups it is for" }
      - { name: account_ids, type: list, description: "The accounts it is for" }
      - { name: tenant, type: bool, description: "For the whole tenant (the global scope)" }
    request:
      method: POST
      path: /cloud-detection/rules
      json:
        data:
          name: "{{ args.name }}"
          description: "{{ args.description }}"
          severity: "{{ args.severity }}"
          status: "{{ args.status }}"
          expirationMode: "{{ args.expiration_mode }}"
          expiration: "{{ args.expiration }}"
          queryType: "{{ args.query_type }}"
          s1ql: "{{ args.query }}"
          queryLang: "{{ args.query_language }}"
          networkQuarantine: "{{ args.network_quarantine }}"
          treatAsThreat: "{{ args.treat_as_threat }}"
          scheduledParams: "{{ args.scheduled_params }}"
          correlationParams: "{{ args.correlation_params }}"
          coolOffSettings: "{{ args.cool_off }}"
        filter:
          siteIds: "{{ if(args.site_ids, args.site_ids | join(',') | split(',')) }}"
          groupIds: "{{ if(args.group_ids, args.group_ids | join(',') | split(',')) }}"
          accountIds: "{{ if(args.account_ids, args.account_ids | join(',') | split(',')) }}"
          tenant: "{{ args.tenant }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      rule_id: "{{ response.data.id }}"
      rule: "{{ response.data }}"
    sample: { rule_id: "", rule: {} }

  - name: update-detection-rule
    description: "Change a custom detection rule. The console wants the whole rule again: name, severity, state, kind and expiration mode, with what changes."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: rule_id, type: text, required: true, description: "The id of the rule" }
      - { name: name, type: text, required: true, description: "The name of the rule" }
      - { name: query, type: text, description: "What it looks for, in the query language of the rule: SrcProcCmdLine ContainsCIS \"-enc\"" }
      - { name: severity, type: text, required: true, description: "Its severity, as the console names it: Low, Medium, High, Critical" }
      - { name: status, type: text, default: Draft, description: "Its state: Active to start detecting, Draft or Disabled not to" }
      - { name: query_type, type: text, default: events, description: "The kind of rule: events for one that matches single events" }
      - { name: expiration_mode, type: text, default: Permanent, description: "Permanent, or Temporary with an expiration" }
      - { name: expiration, type: text, description: "For a temporary rule: when it stops, ISO 8601" }
      - { name: description, type: text, description: "What it is for" }
      - { name: query_language, type: text, description: "The version of the query language, when the console needs it said: 1.0, 2.0" }
      - { name: network_quarantine, type: bool, description: "Isolate the endpoint when the rule matches" }
      - { name: treat_as_threat, type: text, description: "Raise what it matches as a threat: Suspicious or Malicious (an alert only when empty)" }
      - { name: scheduled_params, type: object, description: "For a scheduled rule: the object the console calls scheduledParams (query, runIntervalMinutes, lookbackWindowMinutes…)" }
      - { name: correlation_params, type: object, description: "For a correlation rule: the object the console calls correlationParams" }
      - { name: cool_off, type: object, description: "Not to be alerted twice in a row for the same match: {\"renotifyMinutes\": 60}" }
      - { name: site_ids, type: list, description: "The sites it is for (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "The groups it is for" }
      - { name: account_ids, type: list, description: "The accounts it is for" }
      - { name: tenant, type: bool, description: "For the whole tenant (the global scope)" }
    request:
      method: PUT
      path: "/cloud-detection/rules/{{ if(args.rule_id, args.rule_id, args.rule_id.is_needed) }}"
      json:
        data:
          name: "{{ args.name }}"
          description: "{{ args.description }}"
          severity: "{{ args.severity }}"
          status: "{{ args.status }}"
          expirationMode: "{{ args.expiration_mode }}"
          expiration: "{{ args.expiration }}"
          queryType: "{{ args.query_type }}"
          s1ql: "{{ args.query }}"
          queryLang: "{{ args.query_language }}"
          networkQuarantine: "{{ args.network_quarantine }}"
          treatAsThreat: "{{ args.treat_as_threat }}"
          scheduledParams: "{{ args.scheduled_params }}"
          correlationParams: "{{ args.correlation_params }}"
          coolOffSettings: "{{ args.cool_off }}"
        filter:
          siteIds: "{{ if(args.site_ids, args.site_ids | join(',') | split(',')) }}"
          groupIds: "{{ if(args.group_ids, args.group_ids | join(',') | split(',')) }}"
          accountIds: "{{ if(args.account_ids, args.account_ids | join(',') | split(',')) }}"
          tenant: "{{ args.tenant }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      rule_id: "{{ response.data.id }}"
      rule: "{{ response.data }}"
    sample: { rule_id: "", rule: {} }

  - name: enable-detection-rules
    description: "Turn custom detection rules on, by id: they raise alerts from then on."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: rule_id, type: text, required: true, description: "The id of the rule id, or several: a list, or ids separated by commas" }
    request:
      method: PUT
      path: /cloud-detection/rules/enable
      json:
        filter:
          ids: "{{ if(args.rule_id | join(',') | split(',') | length > 0, args.rule_id | join(',') | split(','), args.rule_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: disable-detection-rules
    description: "Turn custom detection rules off, by id: they stop raising alerts."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: rule_id, type: text, required: true, description: "The id of the rule id, or several: a list, or ids separated by commas" }
    request:
      method: PUT
      path: /cloud-detection/rules/disable
      json:
        filter:
          ids: "{{ if(args.rule_id | join(',') | split(',') | length > 0, args.rule_id | join(',') | split(','), args.rule_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: delete-detection-rules
    description: "Delete custom detection rules, by id."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: rule_id, type: text, required: true, description: "The id of the rule id, or several: a list, or ids separated by commas" }
    request:
      method: DELETE
      path: /cloud-detection/rules
      json:
        filter:
          ids: "{{ if(args.rule_id | join(',') | split(',') | length > 0, args.rule_id | join(',') | split(','), args.rule_id.at_least_one) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: get-managed-rules
    description: "The detection rules SentinelOne maintains (the library), as a scope has them: which are on, which are off."
    arguments:
      - { name: rule_ids, type: list, description: "Only these rules of the library (ids, as a list or separated by commas)" }
      - { name: name, type: text, description: "A part of the name" }
      - { name: statuses, type: list, description: "Only these states" }
      - { name: severities, type: list, description: "Only these severities" }
      - { name: scope_level, type: text, description: "The level of the scope asked for: site, account, group or global" }
      - { name: scope_id, type: text, description: "The id of that site, account or group" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /detection-library/platform-rules
      query:
        platformRuleIds: "{{ args.rule_ids | join(',') }}"
        ruleNameSubstring: "{{ args.name }}"
        statuses: "{{ args.statuses | join(',') }}"
        severities: "{{ args.severities | join(',') }}"
        scopeLevel: "{{ args.scope_level }}"
        scopeId: "{{ args.scope_id }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      rules: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      rule_id: "{{ response.items[0].id }}"
      name: "{{ response.items[0].name }}"
      status: "{{ response.items[0].status }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  # The reference gives this body as the filter itself, with no "filter" around it.
  - name: enable-managed-rules
    description: "Turn rules of SentinelOne's library on for a scope: each becomes an active rule there."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: rule_ids, type: list, required: true, description: "The ids of the rules of the library: a list, or ids separated by commas" }
      - { name: scope_level, type: text, required: true, description: "The level of the scope: site, account, group or global" }
      - { name: scope_id, type: text, description: "The id of that site, account or group" }
    request:
      method: PUT
      path: /detection-library/platform-rules/enable
      json:
        platformRuleIds: "{{ if(args.rule_ids | join(',') | split(',') | length > 0, args.rule_ids | join(',') | split(','), args.rule_ids.at_least_one) }}"
        scopeLevel: "{{ args.scope_level }}"
        scopeId: "{{ args.scope_id }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  # The reference gives this body as the filter itself, with no "filter" around it.
  - name: disable-managed-rules
    description: "Turn rules of SentinelOne's library off for a scope."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: rule_ids, type: list, required: true, description: "The ids of the rules of the library: a list, or ids separated by commas" }
      - { name: scope_level, type: text, required: true, description: "The level of the scope: site, account, group or global" }
      - { name: scope_id, type: text, description: "The id of that site, account or group" }
    request:
      method: PUT
      path: /detection-library/platform-rules/disable
      json:
        platformRuleIds: "{{ if(args.rule_ids | join(',') | split(',') | length > 0, args.rule_ids | join(',') | split(','), args.rule_ids.at_least_one) }}"
        scopeLevel: "{{ args.scope_level }}"
        scopeId: "{{ args.scope_id }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
