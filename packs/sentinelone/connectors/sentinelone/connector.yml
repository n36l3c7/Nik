      - { name: tenant, type: bool, description: "Ask at the level of the whole tenant (the global scope)" }
      - { name: updated_after, type: text, description: "Changed at this moment or later, ISO 8601" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /threat-intelligence/iocs
