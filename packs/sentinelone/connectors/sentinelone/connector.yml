      truncated: "{{ response.truncated }}"

  # ---- The console -----------------------------------------------------------------------------------
  - name: get-system-info
    description: "The version of the console: build, release, patch, and the newest version of the agent it knows."
    request:
      method: GET
      path: /system/info
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      version: "{{ response.data.version }}"
      build: "{{ response.data.build }}"
      release: "{{ response.data.release }}"
      latest_agent_version: "{{ response.data.latestAgentVersion }}"

  - name: get-system-status
    description: "Whether the console says it is up. It answers without looking at the token."
    request:
      method: GET
      path: /system/status
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      health: "{{ response.data.health }}"

fetch:
  interval_seconds: 120
  first_fetch: 3 days
  request:
    method: GET
    path: /threats
    query:
      # From the moment itself: a threat read a second time is taken once, since each is told apart by its id.
      createdAt__gte: "{{ since.iso }}"
      sortBy: createdAt
      sortOrder: asc
  error: { message: "{{ response.errors[0].detail }}" }
  pagination:
    type: cursor
    param: cursor
    limit_param: limit
    limit: 100
    items: "{{ response.data }}"
    next: "{{ response.pagination.nextCursor }}"
    max_pages: 2
  item_id: "{{ item.id }}"
  occurred: "{{ item.threatInfo.createdAt }}"

schema:
  incoming:
    - { name: id, type: text, description: The id of the threat }
    - { name: threatInfo.threatName, type: text }
    - { name: threatInfo.classification, type: text, description: "Malware, Ransomware, Trojan…" }
    - { name: threatInfo.confidenceLevel, type: text, description: "malicious or suspicious" }
    - { name: threatInfo.analystVerdict, type: text, description: "undefined, true_positive, false_positive or suspicious" }
    - { name: threatInfo.incidentStatus, type: text, description: "unresolved, in_progress or resolved" }
    - { name: threatInfo.mitigationStatus, type: text }
    - { name: threatInfo.sha1, type: text }
    - { name: threatInfo.sha256, type: text }
    - { name: threatInfo.md5, type: text }
    - { name: threatInfo.filePath, type: text }
    - { name: threatInfo.storyline, type: text, description: The storyline the agent gave the threat }
    - { name: threatInfo.originatorProcess, type: text }
    - { name: threatInfo.processUser, type: text }
    - { name: threatInfo.initiatedBy, type: text }
    - { name: threatInfo.externalTicketId, type: text }
    - { name: threatInfo.createdAt, type: date }
    - { name: threatInfo.updatedAt, type: date }
    - { name: agentRealtimeInfo.agentComputerName, type: text }
    - { name: agentRealtimeInfo.agentId, type: text }
    - { name: agentRealtimeInfo.agentUuid, type: text }
    - { name: agentRealtimeInfo.agentOsName, type: text }
    - { name: agentRealtimeInfo.agentNetworkStatus, type: text }
    - { name: agentRealtimeInfo.siteId, type: text }
    - { name: agentRealtimeInfo.siteName, type: text }
    - { name: agentRealtimeInfo.groupName, type: text }
    - { name: agentDetectionInfo.agentLastLoggedInUserName, type: text }
    - { name: agentDetectionInfo.externalIp, type: text }
