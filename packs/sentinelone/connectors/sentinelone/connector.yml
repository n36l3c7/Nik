  # ---- Deep Visibility -------------------------------------------------------------------------------
  - name: search-deep-visibility
    description: "Run a Deep Visibility query (S1QL 1.0) over a time range and read its events. SentinelOne marks this API as deprecated: run-query of the SentinelOne SIEM connector is the one that replaces it."
    timeout: 120
    arguments:
      - { name: query, type: text, required: true, description: "The query: SrcProcName = \"powershell.exe\"" }
      - { name: from_date, type: text, required: true, description: "From when, ISO 8601: 2026-11-16T00:00:00Z" }
      - { name: to_date, type: text, required: true, description: "To when, ISO 8601" }
      - { name: limit, type: number, default: 100, description: "How many events to read (1000 at most)" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts" }
    steps:
      - name: start
        request:
          method: POST
          path: /dv/init-query
          json:
            query: "{{ args.query }}"
            fromDate: "{{ args.from_date }}"
            toDate: "{{ args.to_date }}"
            siteIds: "{{ if(args.site_ids, args.site_ids | join(',') | split(',')) }}"
            accountIds: "{{ if(args.account_ids, args.account_ids | join(',') | split(',')) }}"
        error: { message: "{{ response.errors[0].detail }}" }
      - name: ready
        request:
          method: GET
          path: /dv/query-status
          query: { queryId: "{{ steps.start.response.data.queryId }}" }
        poll:
          # The states are those the reference lists; a query that found nothing ends as EMPTY_RESULTS.
          until: { any: [{ left: "{{ response.data.responseState }}", op: in, right: [FINISHED, EMPTY_RESULTS] }] }
          fail_when:
            any:
              - left: "{{ response.data.responseState }}"
                op: in
                right: [FAILED, FAILED_CLIENT, TIMED_OUT, QUERY_CANCEL, QUERY_EXPIRED, QUERY_NOT_FOUND]
          every: 5
          timeout: 600
      - name: events
        request:
          method: GET
          path: /dv/events
          query:
            queryId: "{{ steps.start.response.data.queryId }}"
            limit: "{{ args.limit }}"
        error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      query_id: "{{ steps.start.response.data.queryId }}"
      events: "{{ steps.events.response.data }}"
      count: "{{ steps.events.response.data | length }}"
      total: "{{ steps.events.response.pagination.totalItems }}"

  - name: get-event-file-link
    description: "Where the file of the source process of a Deep Visibility event can be downloaded from: the link and the name of the file."
    arguments:
      - { name: download_token, type: text, required: true, description: "The download token the event carries" }
    request:
      method: GET
      path: /dv/fetch-file
      query:
        downloadToken: "{{ if(args.download_token, args.download_token, args.download_token.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      download_url: "{{ response.data.downloadUrl }}"
      file_name: "{{ response.data.fileName }}"

  # The link is followed when it is on the host of the console: see download-threat-from-cloud.
  - name: download-event-file
    description: "Keep as an artifact the file of the source process of a Deep Visibility event, as it came. It follows the link only when the link is on the console itself. When it is on another host: get-event-file-link gives the link, nik.download-file fetches it (the host must be among those the playbook may reach; no credentials go with it), and nik.unpack-artifact opens it when it is an archive."
    arguments:
      - { name: download_token, type: text, required: true, description: "The download token the event carries" }
    steps:
      - name: link
        request:
          method: GET
          path: /dv/fetch-file
          query: { downloadToken: "{{ if(args.download_token, args.download_token, args.download_token.is_needed) }}" }
        error: { message: "{{ response.errors[0].detail }}" }
      - name: download
        request:
          method: GET
          path: "{{ steps.link.response.data.downloadUrl }}"
          answer: file
          save_as: { name: "{{ steps.link.response.data.fileName }}" }
        error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ steps.download.response.artifact }}"
      name: "{{ steps.download.response.name }}"
      sha256: "{{ steps.download.response.sha256 }}"
      size: "{{ steps.download.response.size }}"
      type: "{{ steps.download.response.type }}"
      download_url: "{{ steps.link.response.data.downloadUrl }}"

