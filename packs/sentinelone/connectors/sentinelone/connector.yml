  - name: disconnect-container
    description: "Cut the container of a threat off the network."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat, or several: a list, or ids separated by commas" }
      - { name: container_id, type: text, required: true, description: "The id of the container: containerInfo.id of the threat" }
    request:
      method: POST
      path: /threats/actions/container-network-disconnect
      json:
        filter:
          ids: "{{ if(args.threat_id | join(',') | split(',') | length > 0, args.threat_id | join(',') | split(','), args.threat_id.at_least_one) }}"
        data:
          containerId: "{{ if(args.container_id, args.container_id, args.container_id.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      success: "{{ response.data.success }}"
    sample: { success: true }

  - name: reconnect-container
    description: "Put the container of a threat back on the network."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: threat_id, type: text, required: true, description: "The id of the threat, or several: a list, or ids separated by commas" }
      - { name: container_id, type: text, required: true, description: "The id of the container: containerInfo.id of the threat" }
    request:
      method: POST
      path: /threats/actions/container-network-connect
      json:
        filter:
          ids: "{{ if(args.threat_id | join(',') | split(',') | length > 0, args.threat_id | join(',') | split(','), args.threat_id.at_least_one) }}"
        data:
          containerId: "{{ if(args.container_id, args.container_id, args.container_id.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      success: "{{ response.data.success }}"
    sample: { success: true }

  # The reference names the status as an enumeration without printing its values.
  - name: mark-as-threat
    description: "Turn something seen in Deep Visibility into a threat, by its storyline: the console raises it and adds its file to the blocklist."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: storyline, type: text, required: true, description: "The storyline of the event" }
      - { name: agent_id, type: text, required: true, description: "The id of the agent that reported the event" }
      - { name: status, type: text, required: true, description: "What to mark it as, in the console's words: malicious or suspicious" }
      - { name: agent_uuid, type: text, description: "The UUID of the agent, when it is known instead (it wins over the id)" }
    request:
      method: POST
      path: /threats/dv-mark-as-threat
      json:
        data:
          status: "{{ args.status }}"
          events:
            - storyline: "{{ if(args.storyline, args.storyline, args.storyline.is_needed) }}"
              agentId: "{{ args.agent_id }}"
              agentUuid: "{{ args.agent_uuid }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: block-event-hash
    description: "Put in the blocklist a SHA-1 seen in Deep Visibility, for the group, the site or the account of the agent that saw it, or for everyone."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: hash, type: text, required: true, description: "The SHA-1 of the file" }
      - { name: agent_id, type: text, required: true, description: "The id of the agent that reported the event" }
      - { name: target_scope, type: choice, choices: [group, site, account, tenant], required: true, description: "How far it applies, from the endpoint of the threat: its group, its site, its account, or the whole tenant" }
    request:
      method: POST
      path: /threats/dv-add-to-blacklist
      json:
        data:
          targetScope: "{{ args.target_scope }}"
          hashes:
            - hash: "{{ if(args.hash, args.hash, args.hash.is_needed) }}"
              agentId: "{{ if(args.agent_id, args.agent_id, args.agent_id.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  # ---- Alerts of custom detection rules --------------------------------------------------------------
  # The reference prints no value of the verdict nor of the status of an alert: the upper-case ones are
  # those that the integrations published for other products send.
  - name: get-alerts
    description: "The alerts raised by custom detection rules (STAR): by id, by rule, by endpoint, by state, by time."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: rule_name, type: text, description: "A part of the name of the rule" }
      - { name: agent_name, type: text, description: "A part of the name of the endpoint" }
      - { name: storyline, type: text, description: "The storyline of the process that set the rule off" }
      - { name: severities, type: list, description: "Only these severities, as the rules name them: Low, Medium, High, Critical" }
      - { name: analyst_verdicts, type: list, description: "Only these verdicts: UNDEFINED, TRUE_POSITIVE, FALSE_POSITIVE, SUSPICIOUS" }
      - { name: incident_statuses, type: list, description: "Only these incident states: UNRESOLVED, IN_PROGRESS, RESOLVED" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: created_after, type: text, description: "Created at this moment or later, ISO 8601: 2026-11-16T00:00:00Z" }
      - { name: created_before, type: text, description: "Created at this moment or earlier, ISO 8601" }
      - { name: reported_after, type: text, description: "Reported at this moment or later, ISO 8601" }
      - { name: sort_by, type: text, description: "The field to sort by: id, createdAt…" }
      - { name: sort_order, type: choice, choices: [asc, desc], description: "The direction of the sort" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /cloud-detection/alerts
      query:
        ids: "{{ args.ids | join(',') }}"
        query: "{{ args.query }}"
        ruleName__contains: "{{ args.rule_name }}"
        origAgentName__contains: "{{ args.agent_name }}"
        sourceProcessStoryline__equals: "{{ args.storyline }}"
        severity: "{{ args.severities | join(',') }}"
        analystVerdict: "{{ args.analyst_verdicts | join(',') }}"
        incidentStatus: "{{ args.incident_statuses | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        createdAt__gte: "{{ args.created_after }}"
        createdAt__lte: "{{ args.created_before }}"
        reportedAt__gte: "{{ args.reported_after }}"
        sortBy: "{{ args.sort_by }}"
        sortOrder: "{{ args.sort_order }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      alerts: "{{ response.items }}"
      ids: "{{ response.items | pluck('alertInfo.alertId') }}"
      alert_id: "{{ response.items[0].alertInfo.alertId }}"
      rule_name: "{{ response.items[0].ruleInfo.name }}"
      severity: "{{ response.items[0].ruleInfo.severity }}"
      analyst_verdict: "{{ response.items[0].alertInfo.analystVerdict }}"
      incident_status: "{{ response.items[0].alertInfo.incidentStatus }}"
      agent_name: "{{ response.items[0].agentDetectionInfo.name }}"
      agent_uuid: "{{ response.items[0].agentDetectionInfo.uuid }}"
      storyline: "{{ response.items[0].sourceProcessInfo.storyline }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: set-alert-verdict
    description: "Set the analyst verdict of an alert of a custom detection rule."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: alert_id, type: text, required: true, description: "The id of the alert id, or several: a list, or ids separated by commas" }
      - { name: analyst_verdict, type: choice, choices: [UNDEFINED, TRUE_POSITIVE, FALSE_POSITIVE, SUSPICIOUS], required: true, description: "The verdict" }
    request:
      method: POST
      path: /cloud-detection/alerts/analyst-verdict
      json:
        filter:
          ids: "{{ if(args.alert_id | join(',') | split(',') | length > 0, args.alert_id | join(',') | split(','), args.alert_id.at_least_one) }}"
        data:
          analystVerdict: "{{ args.analyst_verdict }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: set-alert-incident
    description: "Set the incident status of an alert of a custom detection rule."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: alert_id, type: text, required: true, description: "The id of the alert id, or several: a list, or ids separated by commas" }
      - { name: incident_status, type: choice, choices: [UNRESOLVED, IN_PROGRESS, RESOLVED], required: true, description: "The status" }
    request:
      method: POST
      path: /cloud-detection/alerts/incident
      json:
        filter:
          ids: "{{ if(args.alert_id | join(',') | split(',') | length > 0, args.alert_id | join(',') | split(','), args.alert_id.at_least_one) }}"
        data:
          incidentStatus: "{{ args.incident_status }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: mitigate-alert
    description: "Treat an alert as a threat and act on it, by the storyline of the alert and the agent that reported it. The actions are those of mitigate-threat."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: storyline, type: text, required: true, description: "The storyline of the alert: sourceProcessInfo.storyline" }
      - { name: agent_id, type: text, required: true, description: "The id of the agent that reported it" }
      - { name: action, type: text, required: true, description: "What to do, as mitigate-threat names it: kill, quarantine, remediate, rollback-remediation…" }
    request:
      method: POST
      path: /threats/mitigate-alerts
      json:
        data:
          action: "{{ args.action }}"
          alerts:
            - storyline: "{{ if(args.storyline, args.storyline, args.storyline.is_needed) }}"
              agentId: "{{ if(args.agent_id, args.agent_id, args.agent_id.is_needed) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  # ---- Blocklist -------------------------------------------------------------------------------------
  # Asked with type black_hash, as the reference's own example: the same list holds the exclusions otherwise.
  - name: get-blocklist
    description: "The hashes in the blocklist of a scope: by hash, by id, by who put them there."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: value, type: text, description: "The hash, exactly" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: os_types, type: list, description: "Only these operating systems: windows, macos, linux" }
      - { name: sources, type: list, description: "Only from these sources: user, cloud, action_from_threat…" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: tenant, type: bool, description: "Ask at the level of the whole tenant (the global scope)" }
      - { name: include_children, type: bool, description: "Also what the scopes under the one asked for hold" }
      - { name: include_parents, type: bool, description: "Also what the scopes above the one asked for hold" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /restrictions
      query:
        ids: "{{ args.ids | join(',') }}"
        value: "{{ args.value }}"
        query: "{{ args.query }}"
        osTypes: "{{ args.os_types | join(',') }}"
        source: "{{ args.sources | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        tenant: "{{ args.tenant }}"
        includeChildren: "{{ args.include_children }}"
        includeParents: "{{ args.include_parents }}"
        type: black_hash
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  # The type is always black_hash: the reference warns that any other value makes an exclusion instead.
  - name: add-hash-to-blocklist
    description: "Put the hash of a file in the blocklist, for some sites, groups or accounts, or for the whole tenant when none is named: agents there stop the file from running."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: hash, type: text, description: "The SHA-1 of the file" }
      - { name: os_type, type: choice, choices: [windows, macos, linux], default: windows, description: "The operating system" }
      - { name: description, type: text, description: "Why it is blocked" }
      - { name: site_ids, type: list, description: "The sites it is blocked on (the whole tenant when no site, group nor account is named)" }
      - { name: sha256, type: text, description: "The SHA-256 of the file, beside the SHA-1 or instead of it" }
      - { name: group_ids, type: list, description: "The groups it is blocked on" }
      - { name: account_ids, type: list, description: "The accounts it is blocked on" }
    request:
      method: POST
      path: /restrictions
      json:
        data:
          value: "{{ args.hash }}"
          sha256Value: "{{ args.sha256 }}"
          type: black_hash
          osType: "{{ args.os_type }}"
          description: "{{ args.description }}"
          source: Nik
        filter:
          siteIds: "{{ if(args.site_ids, args.site_ids | join(',') | split(',')) }}"
          groupIds: "{{ if(args.group_ids, args.group_ids | join(',') | split(',')) }}"
          accountIds: "{{ if(args.account_ids, args.account_ids | join(',') | split(',')) }}"
          tenant: "{{ if(args.site_ids or args.group_ids or args.account_ids, null, true) }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      ids: "{{ response.data[*].id }}"
    sample: { ids: ["0000000000000000000"] }

  - name: update-blocklist-item
    description: "Change an item of the blocklist: its description, its operating system, its hash."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: item_id, type: text, required: true, description: "The id of the item (get-blocklist)" }
      - { name: os_type, type: choice, choices: [windows, macos, linux], default: windows, description: "The operating system" }
      - { name: description, type: text, description: "The new description" }
      - { name: hash, type: text, description: "The SHA-1" }
      - { name: sha256, type: text, description: "The SHA-256" }
    request:
      method: PUT
      path: /restrictions
      json:
        data:
          id: "{{ if(args.item_id, args.item_id, args.item_id.is_needed) }}"
          type: black_hash
          osType: "{{ args.os_type }}"
          description: "{{ args.description }}"
          value: "{{ args.hash }}"
          sha256Value: "{{ args.sha256 }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      item_id: "{{ response.data.id }}"
      item: "{{ response.data }}"
    sample: { item_id: "", item: {} }

  - name: delete-blocklist-items
    description: "Take items out of the blocklist, by id: the agents let those files run again."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: item_id, type: text, required: true, description: "The id of the item, or several: a list, or ids separated by commas" }
    request:
      method: DELETE
      path: /restrictions
      json:
        data:
          ids: "{{ if(args.item_id | join(',') | split(',') | length > 0, args.item_id | join(',') | split(','), args.item_id.at_least_one) }}"
          type: black_hash
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      affected: "{{ response.data.affected }}"
    sample: { affected: 1 }

  - name: validate-blocklist-item
    description: "Ask whether SentinelOne advises against blocking a hash, or does not allow it, before adding it."
    arguments:
      - { name: hash, type: text, description: "The SHA-1 of the file" }
      - { name: sha256, type: text, description: "The SHA-256 of the file" }
      - { name: os_type, type: choice, choices: [windows, macos, linux], default: windows, description: "The operating system" }
    request:
      method: POST
      path: /restrictions/validate
      json:
        data:
          value: "{{ args.hash }}"
          sha256Value: "{{ args.sha256 }}"
          osType: "{{ args.os_type }}"
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      status: "{{ response.data.status }}"
      details: "{{ response.data.details }}"

  - name: export-blocklist
    description: "The blocklist of a scope as the CSV file the console exports, kept as an artifact."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: value, type: text, description: "The hash, exactly" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: os_types, type: list, description: "Only these operating systems: windows, macos, linux" }
      - { name: sources, type: list, description: "Only from these sources: user, cloud, action_from_threat…" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: tenant, type: bool, description: "Ask at the level of the whole tenant (the global scope)" }
      - { name: include_children, type: bool, description: "Also what the scopes under the one asked for hold" }
      - { name: include_parents, type: bool, description: "Also what the scopes above the one asked for hold" }
    request:
      method: GET
      path: /export/restrictions
      query:
        ids: "{{ args.ids | join(',') }}"
        value: "{{ args.value }}"
        query: "{{ args.query }}"
        osTypes: "{{ args.os_types | join(',') }}"
        source: "{{ args.sources | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        tenant: "{{ args.tenant }}"
        includeChildren: "{{ args.include_children }}"
        includeParents: "{{ args.include_parents }}"
        type: black_hash
      answer: file
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      artifact: "{{ response.artifact }}"
      name: "{{ response.name }}"
      sha256: "{{ response.sha256 }}"
      size: "{{ response.size }}"
      type: "{{ response.type }}"

  # ---- Exclusions ------------------------------------------------------------------------------------
  # The reference prints no value of the kind of an exclusion; these are the ones its text and the console name.
  - name: get-exclusions
    description: "The exclusions of a scope: what the agents there do not raise."
    arguments:
      - { name: ids, type: list, description: "Only those with these ids, as a list or separated by commas" }
      - { name: type, type: text, description: "The kind of exclusion: path, white_hash, certificate, browser, file_type" }
      - { name: value, type: text, description: "A part of what is excluded" }
      - { name: query, type: text, description: "A text looked for in the fields the console searches" }
      - { name: os_types, type: list, description: "Only these operating systems: windows, macos, linux" }
      - { name: modes, type: list, description: "For paths: only these modes (suppress…)" }
      - { name: site_ids, type: list, description: "Only in these sites (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "Only in these groups (ids, as a list or separated by commas)" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
      - { name: tenant, type: bool, description: "Ask at the level of the whole tenant (the global scope)" }
      - { name: include_children, type: bool, description: "Also what the scopes under the one asked for hold" }
      - { name: include_parents, type: bool, description: "Also what the scopes above the one asked for hold" }
      - { name: limit, type: number, default: 100, description: "How many a page holds, 1 to 1000" }
      - { name: pages, type: number, default: 5, description: "How many pages are read at most (each is one request)" }
    request:
      method: GET
      path: /exclusions
      query:
        ids: "{{ args.ids | join(',') }}"
        type: "{{ args.type }}"
        value__contains: "{{ args.value }}"
        query: "{{ args.query }}"
        osTypes: "{{ args.os_types | join(',') }}"
        modes: "{{ args.modes | join(',') }}"
        siteIds: "{{ args.site_ids | join(',') }}"
        groupIds: "{{ args.group_ids | join(',') }}"
        accountIds: "{{ args.account_ids | join(',') }}"
        tenant: "{{ args.tenant }}"
        includeChildren: "{{ args.include_children }}"
        includeParents: "{{ args.include_parents }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: "{{ args.limit }}"
      items: "{{ response.data }}"
      next: "{{ response.pagination.nextCursor }}"
      max_pages: "{{ args.pages }}"
      keep: { total: "{{ response.pagination.totalItems }}" }
    error: { message: "{{ response.errors[0].detail }}" }
    outputs:
      exclusions: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      truncated: "{{ response.truncated }}"

  - name: create-exclusion
    description: "Make an exclusion for sites, groups, accounts or the whole tenant: the agents there stop raising what it names. Every exclusion is a hole in the protection: as narrow as it can be."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: type, type: text, required: true, description: "The kind: path, white_hash, certificate, browser or file_type" }
      - { name: value, type: text, required: true, description: "What is excluded: the path, the hash, the signer, the extension" }
      - { name: os_type, type: choice, choices: [windows, macos, linux], default: windows, description: "The operating system" }
      - { name: description, type: text, description: "Why it is excluded" }
      - { name: mode, type: text, description: "For a path: how much the agent stops looking at, in the console's names (suppress is the narrowest)" }
      - { name: path_exclusion_type, type: text, description: "For a path: file, folder or subfolders" }
      - { name: actions, type: list, description: "What the exclusion does, in the console's names" }
      - { name: site_ids, type: list, description: "The sites it is for (ids, as a list or separated by commas)" }
      - { name: group_ids, type: list, description: "The groups it is for" }
      - { name: account_ids, type: list, description: "The accounts it is for" }
      - { name: tenant, type: bool, description: "For the whole tenant (the global scope)" }
    request:
