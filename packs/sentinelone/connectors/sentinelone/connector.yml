  - name: disable-agent
    description: "Turn the protection of an agent off: it stays connected to the console but detects and stops nothing until it is enabled again."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: agent_id, type: text, required: true, description: "The id of the agent, or several: a list, or ids separated by commas" }
