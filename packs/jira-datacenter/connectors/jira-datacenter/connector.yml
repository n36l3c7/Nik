# Jira Data Center (and Server), through its REST API v2.
#
# Written against the REST API of Jira Software Data Center 11.3
# (developer.atlassian.com/server/jira/platform/rest). For a site at
# atlassian.net use "Jira Cloud": the two differ in how they sign in and in
# how a text is written. Not run against a real server: see "verified" below.
#
# The connection signs in with a personal access token (your profile,
# Personal Access Tokens; Jira 8.14 or later). Texts are plain text, with
# Jira's wiki markup if you want it.
#
# Fetching brings in the issues a JQL filter finds ("Issues to fetch"), oldest
# first, created since the last cycle. JQL reads and compares a time to the
# minute and in the time zone of the account that signs in: the first cycle
# starts from a UTC time, so with an account in another zone it starts some
# hours off.
name: Jira Data Center
id: jira-datacenter
version: 4
description: Issues, comments and transitions in Jira Data Center.
api_version: "Jira Data Center REST API v2 (/rest/api/2), 11.3"
verified: false
configuration:
  - name: url
    label: Server address
    type: url
    required: true
    help: "https://jira.example.org (with the context path, if it has one: https://example.org/jira)"
  - name: credentials
    type: bearer
  - name: fetch_jql
    label: Issues to fetch
    type: text
    default: "created is not EMPTY"
    help: "A JQL filter for the issues that become incidents when fetching is on: project = SEC AND issuetype = Incident"
base_url: "{{ config.url }}"
headers:
  Accept: application/json
test:
  request: { method: GET, path: /rest/api/2/myself }
commands:
  - name: create-issue
    description: Open an issue.
    changes_outside: true
    idempotent: false
    arguments:
      - { name: project, type: text, required: true, description: "The key of the project: SEC" }
      - { name: issue_type, type: text, default: Task, description: "The name of the issue type: Task, Bug, Incident" }
      - { name: summary, type: text, required: true, description: The title }
      - { name: description, type: text, description: What it is about }
      - { name: labels, type: list, description: Labels to put on it }
    request:
      method: POST
      path: /rest/api/2/issue
      json:
        fields:
          project: { key: "{{ args.project }}" }
          issuetype: { name: "{{ args.issue_type }}" }
          summary: "{{ args.summary }}"
          labels: "{{ args.labels }}"
          description: "{{ args.description }}"
    success: { status: [200, 201] }
    error: { message: "{{ response.errorMessages | join('; ') }} {{ response.errors | json }}" }
    outputs:
      key: "{{ response.key }}"
      id: "{{ response.id }}"
      url: "{{ config.url }}/browse/{{ response.key }}"
    # The ticket, in the context of the incident the playbook works on.
    context:
      - path: Ticket(val.ID == obj.ID)
        value:
          ID: "{{ response.id }}"
          Number: "{{ response.key }}"
          System: Jira
          URL: "{{ config.url }}/browse/{{ response.key }}"
    sample: { key: SEC-1, id: "10000", url: "https://jira.example.org/browse/SEC-1" }

  - name: get-issue
    description: An issue, by its key.
    arguments:
      - { name: key, type: text, required: true, description: "The key of the issue: SEC-12" }
    request:
      method: GET
      path: "/rest/api/2/issue/{{ args.key }}"
      query: { fields: "summary,description,status,assignee,priority,labels,issuetype,created,updated" }
    error: { message: "{{ response.errorMessages | join('; ') }}" }
    outputs:
      key: "{{ response.key }}"
      summary: "{{ response.fields.summary }}"
      status: "{{ response.fields.status.name }}"
      assignee: "{{ response.fields.assignee.displayName }}"
      labels: "{{ response.fields.labels }}"
      issue: "{{ response }}"

  - name: update-issue
    description: Change fields of an issue.
    changes_outside: true
    idempotent: true
    arguments:
      - { name: key, type: text, required: true, description: "The key of the issue: SEC-12" }
      - name: fields
        type: object
        required: true
        description: "The fields to change, as Jira names them: {\"summary\": \"New title\", \"labels\": [\"phishing\"]}"
    request:
      method: PUT
      path: "/rest/api/2/issue/{{ args.key }}"
      json: { fields: "{{ args.fields }}" }
    success: { status: [200, 204] }
    error: { message: "{{ response.errorMessages | join('; ') }} {{ response.errors | json }}" }
    outputs:
      key: "{{ args.key }}"
    sample: { key: SEC-1 }

  - name: add-comment
    description: Write a comment on an issue.
    changes_outside: true
    idempotent: false
    arguments:
      - { name: key, type: text, required: true, description: "The key of the issue: SEC-12" }
      - { name: text, type: text, required: true, description: The comment }
    request:
      method: POST
      path: "/rest/api/2/issue/{{ args.key }}/comment"
      json:
        body: "{{ args.text }}"
    success: { status: [200, 201] }
    error: { message: "{{ response.errorMessages | join('; ') }}" }
    outputs:
      id: "{{ response.id }}"
    sample: { id: "10001" }

  - name: list-transitions
    description: "The transitions an issue offers now, each with its id and its name."
    arguments:
      - { name: key, type: text, required: true, description: "The key of the issue: SEC-12" }
    request: { method: GET, path: "/rest/api/2/issue/{{ args.key }}/transitions" }
    error: { message: "{{ response.errorMessages | join('; ') }}" }
    outputs:
      transitions: "{{ response.transitions }}"
      names: "{{ response.transitions | pluck('name') }}"

  - name: transition-issue
    # The id is the one "list-transitions" gives; in a playbook:
    #   {{ transitions.transitions | where('name', 'eq', 'Done') | first | get('id') }}
    description: "Move an issue along its workflow, by the id of the transition (list-transitions gives the ids)."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: key, type: text, required: true, description: "The key of the issue: SEC-12" }
      - { name: transition_id, type: text, required: true, description: The id of the transition }
    request:
      method: POST
      path: "/rest/api/2/issue/{{ args.key }}/transitions"
      json:
        transition: { id: "{{ args.transition_id }}" }
    success: { status: [200, 204] }
    error: { message: "{{ response.errorMessages | join('; ') }}" }
    outputs:
      key: "{{ args.key }}"
      transition_id: "{{ args.transition_id }}"
    sample: { key: SEC-1, transition_id: "31" }

  - name: get-comments
    description: The comments of an issue, oldest first.
    arguments:
      - { name: key, type: text, required: true, description: "The key of the issue: SEC-12" }
    request:
      method: GET
      path: "/rest/api/2/issue/{{ args.key }}/comment"
      query: { orderBy: created, maxResults: 100 }
    error: { message: "{{ response.errorMessages | join('; ') }}" }
    outputs:
      comments: "{{ response.comments }}"

fetch:
  interval_seconds: 120
  first_fetch: 3 days
  request:
    method: GET
    path: /rest/api/2/search
    query:
      jql: "({{ config.fetch_jql }}) AND created >= \"{{ since.epoch | date('%Y-%m-%d %H:%M') }}\" ORDER BY created ASC"
      fields: "summary,description,status,priority,labels,issuetype,created,updated"
  error: { message: "{{ response.errorMessages | join('; ') }}" }
  pagination:
    type: offset
    param: startAt
    limit_param: maxResults
    limit: 100
    items: "{{ response.issues }}"
    max_pages: 2
  item_id: "{{ item.id }}"
  occurred: "{{ item.fields.created | date('%Y-%m-%dT%H:%M:%SZ') }}"

schema:
  incoming:
    - { name: id, type: text, description: The id of the issue }
    - { name: key, type: text, description: "Its key: SEC-12" }
    - { name: fields.summary, type: text }
    - { name: fields.description, type: text }
    - { name: fields.status.name, type: text, description: "The status, as the workflow names it" }
    - { name: fields.status.statusCategory.key, type: text, description: "new, indeterminate or done" }
    - { name: fields.priority.name, type: text }
    - { name: fields.issuetype.name, type: text }
    - { name: fields.labels, type: list }
    - { name: fields.created, type: date }
    - { name: fields.updated, type: date }
  outgoing:
    - { name: summary, type: text }
    - { name: description, type: text }
    - { name: labels, type: list }
    - { name: priority, type: object, description: "{\"name\": \"High\"}" }

mirror:
  interval_seconds: 120
  get: { command: get-issue }
  item: "{{ result.issue }}"
  update:
    command: update-issue
    args: { key: "{{ mirror.id }}", fields: "{{ fields }}" }
  comments:
    list: { command: get-comments }
    items: "{{ result.comments }}"
    id: "{{ item.id }}"
    text: "{{ item.body }}"
    author: "{{ item.author.displayName }}"
    at: "{{ item.created }}"
    add:
      command: add-comment
      args: { key: "{{ mirror.id }}", text: "{{ comment.text }}" }
