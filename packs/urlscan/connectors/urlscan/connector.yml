  # --------------------------------------------------------------- incidents --
  - name: create-incident
    description: Open an incident, which watches a hostname, a domain, an IP address or an address, scans it again and again and tells of what changes.
    premium: true
    changes_outside: true
    idempotent: false
    arguments:
      - { name: observable, type: text, required: true, description: "What to watch: a hostname, a domain, an IP address or an address" }
      - { name: visibility, type: choice, required: true, default: private, choices: [unlisted, private], description: Who may see its scans }
      - { name: channels, type: list, description: The ids of the channels told of this incident }
      - { name: extra_path, type: text, description: A path added to the hostname of an incident on a hostname }
      - { name: scan_interval, type: number, description: Seconds between two full scans of the site }
      - { name: scan_interval_mode, type: choice, choices: [manual, automatic], description: "manual: the intervals after suspended and after malicious have no effect" }
      - { name: watched_attributes, type: list, description: "What is watched: detections, tls, dns, labels, page, meta, ip" }
      - { name: user_agents, type: list, description: The browser User-Agents the scans use }
      - { name: user_agents_per_interval, type: number, description: How many User-Agents are used at each interval }
      - { name: countries, type: list, description: "The countries to scan from, as two letters each" }
      - { name: countries_per_interval, type: number, description: How many countries are used at each interval }
      - { name: stop_delay_suspended, type: number, description: When the incident closes by itself after what it watches was suspended }
      - { name: stop_delay_inactive, type: number, description: When the incident closes by itself after what it watches became inactive }
      - { name: stop_delay_malicious, type: number, description: When the incident closes by itself after what it watches became malicious }
      - { name: scan_interval_after_suspended, type: number, description: The scan interval once what it watches was suspended }
      - { name: scan_interval_after_malicious, type: number, description: The scan interval once what it watches became malicious }
      - { name: incident_profile, type: text, description: The id of the incident profile to open it with }
      - { name: expire_after, type: number, description: Seconds until the incident closes by itself }
    request:
      method: POST
      path: /api/v1/user/incidents
      json:
        incident:
          observable: "{{ args.observable }}"
          visibility: "{{ args.visibility }}"
          channels: "{{ args.channels }}"
          extraPath: "{{ args.extra_path }}"
          scanInterval: "{{ args.scan_interval }}"
          scanIntervalMode: "{{ args.scan_interval_mode }}"
          watchedAttributes: "{{ args.watched_attributes }}"
          userAgents: "{{ args.user_agents }}"
          userAgentsPerInterval: "{{ args.user_agents_per_interval }}"
          countries: "{{ args.countries }}"
          countriesPerInterval: "{{ args.countries_per_interval }}"
          stopDelaySuspended: "{{ args.stop_delay_suspended }}"
          stopDelayInactive: "{{ args.stop_delay_inactive }}"
          stopDelayMalicious: "{{ args.stop_delay_malicious }}"
          scanIntervalAfterSuspended: "{{ args.scan_interval_after_suspended }}"
          scanIntervalAfterMalicious: "{{ args.scan_interval_after_malicious }}"
          incidentProfile: "{{ args.incident_profile }}"
          expireAfter: "{{ args.expire_after }}"
    error: { message: "{{ response.message }}" }
    outputs:
      id: "{{ response.incident._id }}"
      state: "{{ response.incident.state }}"
      type: "{{ response.incident.type }}"
      expire_at: "{{ response.incident.expireAt }}"
      incident: "{{ response.incident }}"
    sample: { id: 6f1c2a9be4b0a1d2c3e4fdef, state: active, type: hostname, expire_at: "2025-01-24T11:44:52.563Z", incident: { _id: 6f1c2a9be4b0a1d2c3e4fdef, observable: foobar.com, state: active } }

  - name: get-incident
    description: One incident, with its options and its state.
    premium: true
    arguments:
      - { name: incident_id, type: text, required: true, description: The id of the incident }
    request: { method: GET, path: "/api/v1/user/incidents/{{ args.incident_id }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      id: "{{ response.incident._id }}"
      state: "{{ response.incident.state }}"
      type: "{{ response.incident.type }}"
      observable: "{{ response.incident.observable }}"
      labels: "{{ response.incident.labels }}"
      scanned_at: "{{ response.incident.scannedAt }}"
      expire_at: "{{ response.incident.expireAt }}"
      incident: "{{ response.incident }}"

  - name: update-incident
    description: Change the options of an incident that runs.
    premium: true
    changes_outside: true
    arguments:
      - { name: incident_id, type: text, required: true, description: The id of the incident }
      - { name: observable, type: text, description: "What to watch: a hostname, a domain, an IP address or an address" }
      - { name: visibility, type: choice, choices: [unlisted, private], description: Who may see its scans }
      - { name: channels, type: list, description: The ids of the channels told of this incident }
      - { name: extra_path, type: text, description: A path added to the hostname of an incident on a hostname }
      - { name: scan_interval, type: number, description: Seconds between two full scans of the site }
      - { name: scan_interval_mode, type: choice, choices: [manual, automatic], description: "manual: the intervals after suspended and after malicious have no effect" }
      - { name: watched_attributes, type: list, description: "What is watched: detections, tls, dns, labels, page, meta, ip" }
      - { name: user_agents, type: list, description: The browser User-Agents the scans use }
      - { name: user_agents_per_interval, type: number, description: How many User-Agents are used at each interval }
      - { name: countries, type: list, description: "The countries to scan from, as two letters each" }
      - { name: countries_per_interval, type: number, description: How many countries are used at each interval }
      - { name: stop_delay_suspended, type: number, description: When the incident closes by itself after what it watches was suspended }
      - { name: stop_delay_inactive, type: number, description: When the incident closes by itself after what it watches became inactive }
      - { name: stop_delay_malicious, type: number, description: When the incident closes by itself after what it watches became malicious }
      - { name: scan_interval_after_suspended, type: number, description: The scan interval once what it watches was suspended }
      - { name: scan_interval_after_malicious, type: number, description: The scan interval once what it watches became malicious }
      - { name: incident_profile, type: text, description: The id of the incident profile }
      - { name: expire_after, type: number, description: Seconds until the incident closes by itself }
    request:
      method: PUT
      path: "/api/v1/user/incidents/{{ args.incident_id }}"
      json:
        incident:
          observable: "{{ args.observable }}"
          visibility: "{{ args.visibility }}"
          channels: "{{ args.channels }}"
          extraPath: "{{ args.extra_path }}"
          scanInterval: "{{ args.scan_interval }}"
          scanIntervalMode: "{{ args.scan_interval_mode }}"
          watchedAttributes: "{{ args.watched_attributes }}"
          userAgents: "{{ args.user_agents }}"
          userAgentsPerInterval: "{{ args.user_agents_per_interval }}"
          countries: "{{ args.countries }}"
          countriesPerInterval: "{{ args.countries_per_interval }}"
          stopDelaySuspended: "{{ args.stop_delay_suspended }}"
          stopDelayInactive: "{{ args.stop_delay_inactive }}"
          stopDelayMalicious: "{{ args.stop_delay_malicious }}"
          scanIntervalAfterSuspended: "{{ args.scan_interval_after_suspended }}"
          scanIntervalAfterMalicious: "{{ args.scan_interval_after_malicious }}"
          incidentProfile: "{{ args.incident_profile }}"
          expireAfter: "{{ args.expire_after }}"
    error: { message: "{{ response.message }}" }
    outputs:
      id: "{{ response.incident._id }}"
      state: "{{ response.incident.state }}"
      expire_at: "{{ response.incident.expireAt }}"
      incident: "{{ response.incident }}"
    sample: { id: 6f1c2a9be4b0a1d2c3e4fdef, state: active, expire_at: "2025-01-24T11:44:52.563Z", incident: { _id: 6f1c2a9be4b0a1d2c3e4fdef, observable: foobar.com, state: active } }

  - name: close-incident
    description: Close an incident - it stops scanning.
    premium: true
    changes_outside: true
    arguments:
      - { name: incident_id, type: text, required: true, description: The id of the incident }
    request: { method: PUT, path: "/api/v1/user/incidents/{{ args.incident_id }}/close" }
    error: { message: "{{ response.message }}" }
    sample: { response: {} }

  - name: restart-incident
    description: Start a closed incident again. Its end is moved further and it starts with new states.
    premium: true
    changes_outside: true
    arguments:
      - { name: incident_id, type: text, required: true, description: The id of the incident }
    request: { method: PUT, path: "/api/v1/user/incidents/{{ args.incident_id }}/restart" }
    error: { message: "{{ response.message }}" }
    sample: { response: {} }

  - name: copy-incident
    description: Copy an incident without its history.
    premium: true
    changes_outside: true
    idempotent: false
    arguments:
      - { name: incident_id, type: text, required: true, description: The id of the incident to copy }
    request: { method: POST, path: "/api/v1/user/incidents/{{ args.incident_id }}/copy" }
    error: { message: "{{ response.message }}" }
    outputs:
      id: "{{ response.incident._id }}"
      state: "{{ response.incident.state }}"
      incident: "{{ response.incident }}"
    sample: { id: 6f1c2a9be4b0a1d2c3e4f111, state: active, incident: { _id: 6f1c2a9be4b0a1d2c3e4f111, observable: foobar.com, sourceType: copy } }

  - name: fork-incident
    description: Copy an incident together with its history (its states).
    premium: true
    changes_outside: true
    idempotent: false
    arguments:
      - { name: incident_id, type: text, required: true, description: The id of the incident to copy }
    request: { method: POST, path: "/api/v1/user/incidents/{{ args.incident_id }}/fork" }
    error: { message: "{{ response.message }}" }
    outputs:
      id: "{{ response.incident._id }}"
      state: "{{ response.incident.state }}"
      incident: "{{ response.incident }}"
    sample: { id: 6f1c2a9be4b0a1d2c3e4f222, state: active, incident: { _id: 6f1c2a9be4b0a1d2c3e4f222, observable: foobar.com, sourceType: fork } }

  - name: list-watchable-attributes
    description: The attributes an incident can watch (what its watched_attributes takes).
    premium: true
    arguments: []
    request: { method: GET, path: /api/v1/user/watchableAttributes }
    error: { message: "{{ response.message }}" }

  - name: get-incident-states
    description: The states an incident went through, each with the time it started and ended.
    premium: true
    arguments:
      - { name: incident_id, type: text, required: true, description: The id of the incident }
    request: { method: GET, path: "/api/v1/user/incidentstates/{{ args.incident_id }}/" }
    error: { message: "{{ response.message }}" }
    outputs:
      states: "{{ response.incidentstates }}"
      count: "{{ response.incidentstates | length }}"

  # ------------------------------------------------------------------- files --
  - name: download-file
    description: "A file a scanned page made the browser download, by its SHA-256, kept as an artifact: a ZIP encrypted with a password (urlscan! unless you give another) that holds the one file, named after its SHA-256. Nik stores the ZIP as it came and never opens it."
    premium: true
    arguments:
      - { name: file_hash, type: text, required: true, description: The SHA-256 of the file }
      - { name: password, type: text, description: "The password the ZIP is encrypted with: urlscan! (with the exclamation mark) when left out" }
      - { name: filename, type: text, description: "The name of the ZIP: the hash and .zip when left out. The file inside keeps its name" }
    request:
      method: GET
      path: "/downloads/{{ args.file_hash | urlencode }}"
      query:
        password: "{{ args.password }}"
        filename: "{{ args.filename }}"
      answer: file
      save_as: { name: "{{ first_of(args.filename, args.file_hash ~ '.zip') }}", type: application/zip }
    error: { message: "{{ response.message }}" }
    timeout: 300
    sample: { name: sample.zip, type: application/zip, size: 0, sha256: "", artifact: "", linked: false }

  # -------------------------------------------------------------- data dumps --
  - name: list-data-dumps
    description: The data dump files there are for a window of time, a kind of file and a day.
    premium: true
    arguments:
      - { name: time_window, type: choice, required: true, choices: [days, hours, minutes], description: The window of time a file covers }
      - { name: file_type, type: choice, required: true, choices: [api, search, screenshot, dom], description: The kind of file }
      - { name: date, type: text, required: true, description: "The day, as YYYYMMDD: 20251001" }
    request: { method: GET, path: "/api/v1/datadump/list/{{ args.time_window }}/{{ args.file_type }}/{{ args.date }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      files: "{{ response.files }}"
      paths: "{{ response.files | pluck('path') }}"
      count: "{{ response.files | length }}"

  - name: download-data-dump
    description: "One data dump file, by the path list-data-dumps gives, kept as an artifact (gzip). urlscan makes a temporary download link for it: when that link is on another host than urlscan.io, the host must be listed in the connector before the file can be fetched."
    premium: true
    arguments:
      - { name: path, type: text, required: true, description: "The path of the file, as list-data-dumps gives it: days/search/20251001.gz" }
    request:
      method: GET
      path: "/api/v1/datadump/link/{{ args.path | urlencode | replace('%2F', '/') }}"
      answer: file
      save_as: { name: "{{ args.path | replace('/', '-') }}", type: application/gzip }
    error: { message: "{{ response.message }}" }
    timeout: 300
    sample: { name: days-search-20251001.gz, type: application/gzip, size: 0, sha256: "", artifact: "", linked: false }
