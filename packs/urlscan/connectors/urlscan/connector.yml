# urlscan.io, through its public API (v1) and the urlscan Pro endpoints.
#
# Written against the OpenAPI description urlscan publishes ("urlscan.io
# APIs", version 1.0.0: https://docs.urlscan.io/apis/urlscan-openapi) and the
# pages beside it (quickstart, rate limits, error codes, best practices).
# Not run against the real service: see "verified" below.
#
# The key goes in the API-Key header, as urlscan asks. It is optional: the
# description says "most" endpoints require authentication, and that the
# search answers unauthenticated requests with a shorter history. An instance
# without a key sends no header, and only the search (and so the two
# reputation commands) is known to answer it.
#
# A scan is asked for with submit-url and read with wait-for-result: until
# the scan is finished the result answers 404, and 410 once it was deleted.
# Every action has its own quota by the minute, the hour and the day: a
# request over it is answered 429, which is tried again; a poll waits as long
# as a Retry-After header says.
#
# The verdict of the two reputation commands is the one Nik's own enrichment
# gives for this source. A result counts as judged malicious when its
# verdicts.malicious is set (what the search documents) or its
# verdicts.overall.malicious is (the shape of the result API, which older
# answers of the search had). One with both counts once: the results where
# the first is set, plus, among the others, those where the second is.
#
# The commands marked premium are the ones the documentation gives to
# urlscan Pro. Three commands keep a file as an artifact: the screenshot of
# a scan, a file by its hash (an encrypted ZIP, never opened here) and a data
# dump file.
name: urlscan.io
id: urlscan
version: 3
description: Scans of web pages on urlscan.io - submit an address, read the result, search what was scanned before - and the urlscan Pro endpoints.
api_version: "urlscan.io API v1 (OpenAPI description 1.0.0)"
verified: false
# Among the sources of an indicator's reputation: how much the verdict counts in the overall one (1 to 3).
lookups: { weight: 2 }
configuration:
  - name: api_key
    label: API key
    type: header
    header: API-Key
    help: "An API key of your urlscan.io account: Settings & API, then New API key."
base_url: "https://urlscan.io"
test:
  request: { method: GET, path: /user/username }
commands:
  # ------------------------------------------------------------- reputation --
  - name: get-url-reputation
    description: What the public scans of urlscan.io say of an address. Nothing is submitted, only the scans that exist are searched.
    reputation: url
    arguments:
      - { name: url, type: text, required: true, description: "The address, as it was scanned: https://example.com/login" }
    request:
      method: GET
      path: /api/v1/search
      query:
        q: 'page.url:"{{ args.url | replace("\\", "\\\\") | replace("\"", "\\\"") }}"'
        size: 10
    # A 404 is read as Nik's own look-up reads it: nothing was scanned.
    success: { status: [200, 404] }
    error: { message: "{{ response.message }}" }
    outputs:
      # Malicious when one of the results read (the last ten) was judged malicious, in either shape of the
      # answer; urlscan never says "clean".
      verdict: "{{ if(response.results | default([]) | count('verdicts.malicious') > 0
        or response.results | default([]) | count('verdicts.overall.malicious') > 0,
        'malicious', 'unknown') }}"
      # "3 public scans, 1 judged malicious". The total is the one urlscan counts, or the results read when it
      # gives none; a result judged malicious in both shapes counts once.
      summary: "{{ if(response.results | default([]),
        if(response.total, response.total | int, response.results | default([]) | length) | plural('public scan')
        ~ if(response.results | default([]) | count('verdicts.malicious') > 0
        or response.results | default([]) | count('verdicts.overall.malicious') > 0,
        ', ' ~ (response.results | default([]) | count('verdicts.malicious')
        + response.results | default([]) | without(response.results | default([]) | where('verdicts.malicious'))
        | count('verdicts.overall.malicious')) ~ ' judged malicious', ''),
        'never scanned on urlscan.io') }}"
      link: 'https://urlscan.io/search/#{{ ("page.url:\"" ~ (args.url | replace("\\", "\\\\") | replace("\"", "\\\"")) ~ "\"") | urlencode | replace("%2F", "/") }}'
      total: "{{ if(response.total, response.total | int, response.results | default([]) | length) }}"
      malicious: "{{ (response.results | default([]) | count('verdicts.malicious')
        + response.results | default([]) | without(response.results | default([]) | where('verdicts.malicious'))
        | count('verdicts.overall.malicious')) }}"
      scans: "{{ response.results }}"
      reports: "{{ response.results | pluck('result') }}"

  - name: get-domain-reputation
    description: What the public scans of urlscan.io say of a domain. Nothing is submitted, only the scans that exist are searched.
    reputation: domain
    arguments:
      - { name: domain, type: text, required: true, description: "The domain of the scanned page: example.com" }
    request:
      method: GET
      path: /api/v1/search
      query:
        q: 'page.domain:"{{ args.domain | replace("\\", "\\\\") | replace("\"", "\\\"") }}"'
        size: 10
    # A 404 is read as Nik's own look-up reads it: nothing was scanned.
    success: { status: [200, 404] }
    error: { message: "{{ response.message }}" }
    outputs:
      # Malicious when one of the results read (the last ten) was judged malicious, in either shape of the
      # answer; urlscan never says "clean".
      verdict: "{{ if(response.results | default([]) | count('verdicts.malicious') > 0
        or response.results | default([]) | count('verdicts.overall.malicious') > 0,
        'malicious', 'unknown') }}"
      # "3 public scans, 1 judged malicious". The total is the one urlscan counts, or the results read when it
      # gives none; a result judged malicious in both shapes counts once.
      summary: "{{ if(response.results | default([]),
        if(response.total, response.total | int, response.results | default([]) | length) | plural('public scan')
        ~ if(response.results | default([]) | count('verdicts.malicious') > 0
        or response.results | default([]) | count('verdicts.overall.malicious') > 0,
        ', ' ~ (response.results | default([]) | count('verdicts.malicious')
        + response.results | default([]) | without(response.results | default([]) | where('verdicts.malicious'))
        | count('verdicts.overall.malicious')) ~ ' judged malicious', ''),
        'never scanned on urlscan.io') }}"
      link: 'https://urlscan.io/search/#{{ ("page.domain:\"" ~ (args.domain | replace("\\", "\\\\") | replace("\"", "\\\"")) ~ "\"") | urlencode | replace("%2F", "/") }}'
      total: "{{ if(response.total, response.total | int, response.results | default([]) | length) }}"
      malicious: "{{ (response.results | default([]) | count('verdicts.malicious')
        + response.results | default([]) | without(response.results | default([]) | where('verdicts.malicious'))
        | count('verdicts.overall.malicious')) }}"
      scans: "{{ response.results }}"
      reports: "{{ response.results | pluck('result') }}"

  # ---------------------------------------------------------------- scanning --
  - name: submit-url
    description: Ask urlscan.io to scan an address. The answer is the id of the scan; wait-for-result reads it once it is finished.
    changes_outside: true
    idempotent: false
    arguments:
      - { name: url, type: text, required: true, description: The address to scan }
      - { name: visibility, type: choice, choices: [public, unlisted, private], description: "Who may see the result: public by default. Use unlisted or private for an address that holds personal data." }
      - { name: country, type: text, description: "The country to scan from, as two letters (de, us): list-available-countries. Chosen by urlscan when left out." }
      - { name: tags, type: list, description: "Tags of your own for this scan: phishing, malicious" }
      - { name: referer, type: text, description: The HTTP referer the scan sends }
      - { name: customagent, type: text, description: The User-Agent the scan sends }
      - { name: override_safety, type: text, description: "Any value turns off the reclassification of addresses that may hold personal data. Use with care." }
    request:
      method: POST
      path: /api/v1/scan
      json:
        url: "{{ args.url }}"
        visibility: "{{ args.visibility }}"
        country: "{{ args.country }}"
        tags: "{{ args.tags }}"
        referer: "{{ args.referer }}"
        customagent: "{{ args.customagent }}"
        overrideSafety: "{{ args.override_safety }}"
    error: { message: "{{ response.message }}: {{ response.description | default('') }}" }
    outputs:
      uuid: "{{ response.uuid }}"
      url: "{{ response.url }}"
      visibility: "{{ response.visibility }}"
      country: "{{ response.country }}"
    sample: { uuid: 68e26c59-2eae-437b-aeb1-cf750fafe7d7, url: "https://urlscan.io/", visibility: public, country: de }

  - name: get-result
    description: The result of a scan that is finished. A scan still running answers 404 - wait-for-result waits for it.
    arguments:
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the scan }
    request: { method: GET, path: "/api/v1/result/{{ args.scan_id }}/" }
    error: { message: "{{ response.message }}" }
    outputs:
      malicious: "{{ response.verdicts.overall.malicious }}"
      score: "{{ response.verdicts.overall.score }}"
      categories: "{{ response.verdicts.overall.categories }}"
      brands: "{{ response.verdicts.overall.brands }}"
      url: "{{ response.page.url }}"
      domain: "{{ response.page.domain }}"
      ip: "{{ response.page.ip }}"
      country: "{{ response.page.country }}"
      server: "{{ response.page.server }}"
      asn: "{{ response.page.asn }}"
      report: "{{ response.task.reportURL }}"
      screenshot: "{{ response.task.screenshotURL }}"
      dom: "{{ response.task.domURL }}"
      ips: "{{ response.lists.ips }}"
      domains: "{{ response.lists.domains }}"
      urls: "{{ response.lists.urls }}"
      verdicts: "{{ response.verdicts }}"
      task: "{{ response.task }}"
      page: "{{ response.page }}"
      lists: "{{ response.lists }}"
      stats: "{{ response.stats }}"
      meta: "{{ response.meta }}"

  - name: wait-for-result
    description: Wait until a scan is finished (five minutes at most) and give its result. Fails when the result was deleted. Asked every five seconds, or as long after as urlscan says in Retry-After.
    arguments:
      - { name: scan_id, type: text, required: true, description: "The id (UUID) of the scan, as submit-url gave it" }
    request: { method: GET, path: "/api/v1/result/{{ args.scan_id }}/" }
    # 404: not finished yet. 410: the result was deleted. A Retry-After header on an answer is honoured by
    # the poll itself: the next try waits that long when it is longer than "every".
    success: { status: [200, 404, 410] }
    error: { message: "{{ response.message }}" }
    poll:
      until: { all: [{ left: "{{ status }}", op: eq, right: 200 }] }
      fail_when: { all: [{ left: "{{ status }}", op: eq, right: 410 }] }
      every: 5
      timeout: 300
    outputs:
      malicious: "{{ response.verdicts.overall.malicious }}"
      score: "{{ response.verdicts.overall.score }}"
      categories: "{{ response.verdicts.overall.categories }}"
      brands: "{{ response.verdicts.overall.brands }}"
      url: "{{ response.page.url }}"
      domain: "{{ response.page.domain }}"
      ip: "{{ response.page.ip }}"
      country: "{{ response.page.country }}"
      server: "{{ response.page.server }}"
      asn: "{{ response.page.asn }}"
      report: "{{ response.task.reportURL }}"
      screenshot: "{{ response.task.screenshotURL }}"
      dom: "{{ response.task.domURL }}"
      ips: "{{ response.lists.ips }}"
      domains: "{{ response.lists.domains }}"
      urls: "{{ response.lists.urls }}"
      verdicts: "{{ response.verdicts }}"
      task: "{{ response.task }}"
      page: "{{ response.page }}"
      lists: "{{ response.lists }}"
      stats: "{{ response.stats }}"
      meta: "{{ response.meta }}"

  - name: get-dom
    description: The DOM of the page as the scan left it, as text.
    arguments:
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the scan }
    request: { method: GET, path: "/dom/{{ args.scan_id }}/", answer: text }
    outputs:
      dom: "{{ response.text }}"

  - name: get-screenshot
    description: The screenshot of the page as the scan left it, a PNG image kept as an artifact. For a scan that is finished.
    arguments:
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the scan }
    request:
      method: GET
      path: "/screenshots/{{ args.scan_id | urlencode }}.png"
      answer: file
      save_as: { name: "{{ args.scan_id }}.png", type: image/png }
    error: { message: "{{ response.message }}" }
    sample: { name: 68e26c59-2eae-437b-aeb1-cf750fafe7d7.png, type: image/png, size: 0, sha256: "", artifact: "", linked: false }

  - name: get-response
    description: What a scanned page was answered for one of its requests (a script, a document, a fetch), as text, by the SHA-256 of the content.
    arguments:
      - { name: file_hash, type: text, required: true, description: "The SHA-256 of the response, as the result of a scan lists it" }
    request: { method: GET, path: "/responses/{{ args.file_hash }}/", answer: text }
    outputs:
      content: "{{ response.text }}"

  - name: set-result-visibility
    description: Change who may see a scan of yours or of your team, or delete it.
    premium: true
    changes_outside: true
    arguments:
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the scan }
      - { name: visibility, type: choice, required: true, choices: [public, unlisted, private, deleted], description: The new visibility of the result }
    request:
      method: PUT
      path: "/api/v1/result/{{ args.scan_id }}/visibility/"
      json: { visibility: "{{ args.visibility }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      uuid: "{{ response.uuid }}"
      message: "{{ response.message }}"
      visibility: "{{ response.visibility }}"
    sample: { uuid: 68e26c59-2eae-437b-aeb1-cf750fafe7d7, message: Visibility updated, visibility: private }

  - name: reset-result-visibility
    description: Give a scan of yours or of your team the visibility it was submitted with.
    premium: true
    changes_outside: true
    arguments:
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the scan }
    request: { method: DELETE, path: "/api/v1/result/{{ args.scan_id }}/visibility/" }
    error: { message: "{{ response.message }}" }
    outputs:
      uuid: "{{ response.uuid }}"
      message: "{{ response.message }}"
    sample: { uuid: 68e26c59-2eae-437b-aeb1-cf750fafe7d7, message: Visibility reset }

  - name: list-available-countries
    description: The countries a scan can be made from.
    arguments: []
    request: { method: GET, path: /api/v1/availableCountries }
    error: { message: "{{ response.message }}" }
    outputs:
      countries: "{{ response.countries }}"

  # ------------------------------------------------------------------ search --
  - name: search
    description: Search the scans urlscan.io holds (one page of results). The public scans of anyone, and the unlisted and private ones of your account.
    arguments:
      - { name: query, type: text, required: true, description: "The search, in Elasticsearch query string syntax: page.domain:example.com AND date:>now-7d" }
      - { name: size, type: number, default: 100, description: How many results to give }
      - { name: search_after, type: text, description: "For the next page: the search_after output of the previous call" }
      - { name: datasource, type: choice, choices: [scans, hostnames, incidents, notifications, certificates], description: "What to search: scans by default; the others need urlscan Pro" }
      - { name: collapse, type: text, description: "A field to keep one result of each value of: page.domain.keyword" }
    request:
      method: GET
      path: /api/v1/search
      query:
        q: "{{ args.query }}"
        size: "{{ args.size }}"
        search_after: "{{ args.search_after }}"
        datasource: "{{ args.datasource }}"
        collapse: "{{ args.collapse }}"
    error: { message: "{{ response.message }}" }
    outputs:
      results: "{{ response.results }}"
      total: "{{ response.total }}"
      has_more: "{{ response.has_more }}"
      count: "{{ response.results | length }}"
      ids: "{{ response.results | pluck('_id') }}"
      malicious: "{{ response.results | where('verdicts.malicious') | length }}"
      search_after: "{{ response.results | last | get('sort') | join(',') }}"
      search_date_limit_days: "{{ response.search_date_limit_days }}"

  - name: search-all
    description: Search the scans urlscan.io holds and read the results page after page, a hundred at a time, a thousand at most.
    arguments:
      - { name: query, type: text, required: true, description: "The search, in Elasticsearch query string syntax. Limit it by date when you can: date:>now-24h" }
      - { name: datasource, type: choice, choices: [scans, hostnames, incidents, notifications, certificates], description: "What to search: scans by default; the others need urlscan Pro" }
    request:
      method: GET
      path: /api/v1/search
      query:
        q: "{{ args.query }}"
        datasource: "{{ args.datasource }}"
    error: { message: "{{ response.message }}" }
    pagination:
      type: cursor
      items: "{{ response.results }}"
      param: search_after
      next: "{{ response.results | last | get('sort') | join(',') }}"
      limit_param: size
      limit: 100
      max_pages: 10
      keep: { total: "{{ response.total }}" }
    outputs:
      results: "{{ response.items }}"
      count: "{{ response.items | length }}"
      total: "{{ response.kept.total }}"
      ids: "{{ response.items | pluck('_id') }}"
      malicious: "{{ response.items | where('verdicts.malicious') | length }}"
      truncated: "{{ response.truncated }}"

  - name: get-similar-results
    description: The scans whose page is built like the page of a given scan (Structure Search).
    premium: true
    arguments:
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the scan to compare to }
      - { name: query, type: text, description: "A search that narrows the results: page.domain:example.com" }
      - { name: size, type: number, description: How many results to give at most }
      - { name: search_after, type: text, description: "For older results: the search_after output of the previous call" }
    request:
      method: GET
      path: "/api/v1/pro/result/{{ args.scan_id }}/similar/"
      query:
        q: "{{ args.query }}"
        size: "{{ args.size }}"
        search_after: "{{ args.search_after }}"
    error: { message: "{{ response.message }}" }
    outputs:
      results: "{{ response.results }}"
      total: "{{ response.total }}"
      count: "{{ response.results | length }}"
      ids: "{{ response.results | pluck('_id') }}"
      search_after: "{{ response.results | last | get('sort') | join(',') }}"

  - name: get-phishfeed
    description: The pages urlscan detected as phishing. A shortcut over the search, which urlscan advises to use instead.
    premium: true
    arguments:
      - { name: query, type: text, description: "A search that narrows the feed: date:>now-24h" }
      - { name: limit, type: number, description: How many results to give }
    request:
      method: GET
      path: /api/v1/pro/phishfeed
      query:
        q: "{{ args.query }}"
        limit: "{{ args.limit }}"
        format: json
    error: { message: "{{ response.message }}" }
    outputs:
      results: "{{ response.results }}"
      total: "{{ response.total }}"
      count: "{{ response.results | length }}"
      urls: "{{ response.results[*].page.url }}"

  # ----------------------------------------------------------------- account --
  - name: get-quotas
    description: The quotas of the account for each action (public, unlisted and private scans, search, retrieve), and what is used of them.
    arguments: []
    request: { method: GET, path: /api/v1/quotas }
    error: { message: "{{ response.message }}" }
    outputs:
      scope: "{{ response.scope }}"
      limits: "{{ response.limits }}"
      search_remaining_today: "{{ response.limits.search.day.remaining }}"
      public_remaining_today: "{{ response.limits.public.day.remaining }}"
      unlisted_remaining_today: "{{ response.limits.unlisted.day.remaining }}"
      private_remaining_today: "{{ response.limits.private.day.remaining }}"
      products: "{{ response.limits.products }}"

  - name: get-user
    description: The user or the API key the requests are made as.
    arguments: []
    request: { method: GET, path: /user/username }
    error: { message: "{{ response.message }}" }

  # ------------------------------------------------------------------ brands --
  - name: list-available-brands
    description: The brands urlscan follows for its phishing detection.
    premium: true
    arguments: []
    request: { method: GET, path: /api/v1/pro/availableBrands }
    error: { message: "{{ response.message }}" }
    outputs:
      brands: "{{ response.kits }}"
      names: "{{ response.kits | pluck('name') }}"
      keys: "{{ response.kits | pluck('key') }}"

  - name: list-brands
    description: The brands urlscan detects phishing pages of, with the number of pages detected and the latest one for each. Slower than list-available-brands.
    premium: true
    arguments: []
    request: { method: GET, path: /api/v1/pro/brands }
    error: { message: "{{ response.message }}" }

  # --------------------------------------------------------------- hostnames --
  - name: get-hostname-history
    description: What was observed of a hostname over time (certificates, passive DNS, scans, zone files), a thousand observations a page.
    premium: true
    arguments:
      - { name: hostname, type: text, required: true, description: "The hostname: www.example.com" }
    request: { method: GET, path: "/api/v1/hostname/{{ args.hostname }}" }
    error: { message: "{{ response.message }}" }
    pagination:
      type: cursor
      items: "{{ response.results }}"
      param: pageState
      next: "{{ response.pageState }}"
      limit_param: limit
      limit: 1000
      max_pages: 10
    outputs:
      observations: "{{ response.items }}"
      count: "{{ response.items | length }}"
      sources: "{{ response.items | pluck('source') | unique }}"
      truncated: "{{ response.truncated }}"

  - name: lookup-malicious-observable
    description: How often an address, a hostname, a domain or an IP address was seen in scans judged malicious, and when first and last.
    premium: true
    arguments:
      - { name: type, type: choice, required: true, choices: [ip, hostname, domain, url], description: "What the value is. domain is the registered domain and covers its subdomains; hostname is one exact host." }
      - { name: value, type: text, required: true, description: "The value: 192.0.2.1, www.example.com, example.com or https://example.com/path" }
    request:
      method: GET
      # The value is a part of the path: what would end it or start a query is encoded, as urlscan asks for a URL.
      path: "/api/v1/malicious/{{ args.type }}/{{ args.value | replace('%', '%25') | replace(':', '%3A') | replace('/', '%2F') | replace('?', '%3F') | replace('#', '%23') | replace('&', '%26') | replace('=', '%3D') | replace(' ', '%20') }}"
    error: { message: "{{ response.message }}" }
    outputs:
      observable: "{{ response.observable }}"
      type: "{{ response.type }}"
      count: "{{ response.count }}"
      first_seen: "{{ response.firstSeen }}"
      last_seen: "{{ response.lastSeen }}"

  # ----------------------------------------------------------- live scanning --
  - name: list-live-scanners
    description: The Live Scanning nodes that can be used, with what is known of each.
    premium: true
    arguments: []
    request: { method: GET, path: /api/v1/livescan/scanners/ }
    error: { message: "{{ response.message }}" }

  - name: start-live-scan
    description: Ask a Live Scanning node to scan an address, without waiting. The answer is the id of the scan; get-live-scan-result reads it.
    premium: true
    changes_outside: true
    idempotent: false
    arguments:
      - { name: scanner_id, type: text, required: true, description: "The id of the node: de01 (list-live-scanners)" }
      - { name: url, type: text, required: true, description: The address to scan }
      - { name: visibility, type: choice, choices: [public, unlisted, private], description: Who may see the scan }
      - { name: tags, type: list, description: "Tags of your own for this scan: phishing, malicious" }
      - { name: scanner, type: object, description: "How the node scans: pageTimeout and captureDelay (milliseconds), extraHeaders (an object), enableFeatures and disableFeatures (lists), evalScript, userAgent" }
    request:
      method: POST
      path: "/api/v1/livescan/{{ args.scanner_id }}/task/"
      json:
        task:
          url: "{{ args.url }}"
          visibility: "{{ args.visibility }}"
          tags: "{{ args.tags }}"
        scanner: "{{ args.scanner }}"
    error: { message: "{{ response.message }}" }
    outputs:
      uuid: "{{ response.uuid }}"
    sample: { uuid: 92d683cd-1575-4bde-89d1-99cd46ae07a7 }

  - name: run-live-scan
    description: Ask a Live Scanning node to scan an address and wait for the scan to finish. The answer is the id of the scan.
    premium: true
    changes_outside: true
    idempotent: false
    timeout: 300
    arguments:
      - { name: scanner_id, type: text, required: true, description: "The id of the node: de01 (list-live-scanners)" }
      - { name: url, type: text, required: true, description: The address to scan }
      - { name: visibility, type: choice, choices: [public, unlisted, private], description: Who may see the scan }
      - { name: tags, type: list, description: "Tags of your own for this scan: phishing, malicious" }
      - { name: scanner, type: object, description: "How the node scans: pageTimeout and captureDelay (milliseconds), extraHeaders (an object), enableFeatures and disableFeatures (lists), evalScript, userAgent" }
    request:
      method: POST
      path: "/api/v1/livescan/{{ args.scanner_id }}/scan/"
      json:
        task:
          url: "{{ args.url }}"
          visibility: "{{ args.visibility }}"
          tags: "{{ args.tags }}"
        scanner: "{{ args.scanner }}"
    error: { message: "{{ response.message }}" }
    outputs:
      uuid: "{{ response.uuid }}"
    sample: { uuid: 10dae531-a98a-42fc-8c6f-cb8610ec0c10 }

  - name: get-live-scan-result
    description: The result of a live scan, read from the node that made it (it keeps a scan for an hour).
    premium: true
    arguments:
      - { name: scanner_id, type: text, required: true, description: "The id of the node: de01" }
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the live scan }
    request: { method: GET, path: "/api/v1/livescan/{{ args.scanner_id }}/result/{{ args.scan_id }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      malicious: "{{ response.verdicts.overall.malicious }}"
      score: "{{ response.verdicts.overall.score }}"
      url: "{{ response.page.url }}"
      domain: "{{ response.page.domain }}"
      ip: "{{ response.page.ip }}"
      verdicts: "{{ response.verdicts }}"
      task: "{{ response.task }}"
      page: "{{ response.page }}"
      lists: "{{ response.lists }}"

  - name: get-live-scan-dom
    description: The DOM of the page of a live scan, as text, read from the node that made it.
    premium: true
    arguments:
      - { name: scanner_id, type: text, required: true, description: "The id of the node: de01" }
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the live scan }
    request: { method: GET, path: "/api/v1/livescan/{{ args.scanner_id }}/dom/{{ args.scan_id }}", answer: text }
    outputs:
      dom: "{{ response.text }}"

  - name: get-live-scan-response
    description: What a page was answered for one of its requests during a live scan, as text, by the SHA-256 of the content.
    premium: true
    arguments:
      - { name: scanner_id, type: text, required: true, description: "The id of the node: de01" }
      - { name: file_hash, type: text, required: true, description: The SHA-256 of the response }
    request: { method: GET, path: "/api/v1/livescan/{{ args.scanner_id }}/response/{{ args.file_hash }}", answer: text }
    outputs:
      content: "{{ response.text }}"

  - name: store-live-scan
    description: Keep a live scan as a permanent scan on urlscan.io (a node drops it after an hour otherwise).
    premium: true
    changes_outside: true
    arguments:
      - { name: scanner_id, type: text, required: true, description: "The id of the node: de01" }
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the live scan }
      - { name: visibility, type: choice, choices: [public, unlisted, private], description: Who may see the stored scan }
    request:
      method: PUT
      path: "/api/v1/livescan/{{ args.scanner_id }}/{{ args.scan_id }}/"
      json:
        task:
          visibility: "{{ args.visibility }}"
    error: { message: "{{ response.message }}" }
    sample: { response: {} }

  - name: purge-live-scan
    description: Remove a live scan from its node at once.
    premium: true
    changes_outside: true
    arguments:
      - { name: scanner_id, type: text, required: true, description: "The id of the node: de01" }
      - { name: scan_id, type: text, required: true, description: The id (UUID) of the live scan }
    request: { method: DELETE, path: "/api/v1/livescan/{{ args.scanner_id }}/{{ args.scan_id }}/" }
    error: { message: "{{ response.message }}" }
    sample: { response: {} }

