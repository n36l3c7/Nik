# SentinelOne Singularity Data Lake (the SIEM) and the alerts of the
# Singularity Operations Center.
#
# The queries are written from SentinelOne's own reference of the API (the
# one the console shows to a signed-in user): launching a query, polling it
# and deleting it under /sdl/v2/api/queries, the header that routes the poll
# to the server that started the query, the bearer token. The reference says
# the result of a query is "an object" and no more: the columns and the rows
# of a PowerQuery are read where SentinelOne's own code on GitHub
# (Sentinel-One/purple-mcp) reads them.
#
# The alerts (/web/api/v2.1/unifiedalerts/graphql) are not in that reference.
# They are written from purple-mcp and, for the changes to an alert, from the
# Cortex XSOAR integration, which is the only public source for them: the two
# things that are the least certain are marked below. Not run against a real
# console: see "verified" below.
#
# The token is one of a service user of the console, with its scope at
# account or site level (a token of global scope is refused by the Data Lake).
#
# Deep Visibility, the custom detection rules and their alerts are commands
# of the SentinelOne EDR connector: they are part of the Management API,
# which takes the token another way.
name: SentinelOne SIEM
id: sentinelone-sdl
version: 4
description: PowerQuery and event searches in the Singularity Data Lake, and the alerts of the Singularity Operations Center.
api_version: "SDL long-running query API v2 (/sdl/v2/api/queries); unified alerts GraphQL (/web/api/v2.1/unifiedalerts/graphql)"
verified: false
configuration:
  - name: url
    label: Console address
    type: url
    required: true
    help: "https://your-tenant.sentinelone.net"
  - name: credentials
    type: bearer
base_url: "{{ config.url }}"
test:
  request:
    method: POST
    path: /web/api/v2.1/unifiedalerts/graphql
    json: { query: "query { alerts(first: 1) { totalCount } }" }
  expect:
    status: 200
    when: { all: [{ left: "{{ response.errors }}", op: empty }] }
commands:
  - name: run-query
    description: Run a PowerQuery over a time range and read the rows it gives.
    timeout: 120
    arguments:
      - { name: query, type: text, required: true, description: "The PowerQuery: event.type = 'Process Creation' | limit 100" }
      - { name: start_time, type: text, required: true, description: "From when: an ISO 8601 time, or as the Data Lake reads it (24h)" }
      - { name: end_time, type: text, description: To when (now when empty) }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
    steps:
      - name: launch
        request:
          method: POST
          path: /sdl/v2/api/queries
          json:
            queryType: PQ
            tenant: true
            startTime: "{{ args.start_time }}"
            endTime: "{{ args.end_time }}"
            accountIds: "{{ if(args.account_ids, args.account_ids | join(',') | split(',')) }}"
            queryPriority: LOW
            pq: { query: "{{ args.query }}", resultType: TABLE }
        error: { message: "{{ response.error.message }}" }
      - name: result
        request:
          method: GET
          path: "/sdl/v2/api/queries/{{ steps.launch.response.id }}"
          query: { lastStepSeen: 0 }
          # The Data Lake answers a query from the server that started it: its tag is sent back.
          headers:
            X-Dataset-Query-Forward-Tag: "{{ steps.launch.headers['x-dataset-query-forward-tag'] | default('') }}"
        error: { message: "{{ response.error.message }}" }
        poll:
          until: { all: [{ left: "{{ response.stepsCompleted }}", op: gte, right: "{{ response.stepsTotal }}" }] }
          fail_when: { all: [{ left: "{{ response.error.message }}", op: exists }] }
          every: 2
          timeout: 280
      # A query is deleted once it is read: the reference asks for it.
      - name: cleanup
        request:
          method: DELETE
          path: "/sdl/v2/api/queries/{{ steps.launch.response.id }}"
          headers:
            X-Dataset-Query-Forward-Tag: "{{ steps.launch.headers['x-dataset-query-forward-tag'] | default('') }}"
        success: { status: [200, 204, 404] }
    outputs:
      columns: "{{ steps.result.response.data.columns | pluck('name') }}"
      rows: "{{ steps.result.response.data.values }}"
      matches: "{{ steps.result.response.data.matchCount }}"
      count: "{{ steps.result.response.data.values | length }}"

  - name: search-events
    description: The events that match a filter over a time range, in order of time, as the Event Search of the console lists them.
    timeout: 120
    arguments:
      - { name: filter, type: text, required: true, description: "What to match, as the search field of the console takes it: event.type = 'Process Creation' and endpoint.name = 'WKS-FINANCE-01'" }
      - { name: start_time, type: text, required: true, description: "From when: an ISO 8601 time, or as the Data Lake reads it (24h)" }
      - { name: end_time, type: text, description: To when (now when empty) }
      - { name: limit, type: number, default: 100, description: How many events to read (the Data Lake gives 1000 when not said) }
      - { name: oldest_first, type: bool, default: false, description: From the oldest to the newest (from the newest when off) }
      - { name: cursor, type: text, description: "To go on from where an earlier search stopped: the cursor its answer gave" }
      - { name: account_ids, type: list, description: "Only in these accounts (ids, as a list or separated by commas)" }
    steps:
      - name: launch
        request:
          method: POST
          path: /sdl/v2/api/queries
          json:
            queryType: LOG
            tenant: true
            startTime: "{{ args.start_time }}"
            endTime: "{{ args.end_time }}"
            accountIds: "{{ if(args.account_ids, args.account_ids | join(',') | split(',')) }}"
            queryPriority: LOW
            log:
              filter: "{{ args.filter }}"
              limit: "{{ args.limit }}"
              ascending: "{{ args.oldest_first }}"
              cursor: "{{ args.cursor }}"
        error: { message: "{{ response.error.message }}" }
      - name: result
        request:
          method: GET
          path: "/sdl/v2/api/queries/{{ steps.launch.response.id }}"
          query: { lastStepSeen: 0 }
          headers:
            X-Dataset-Query-Forward-Tag: "{{ steps.launch.headers['x-dataset-query-forward-tag'] | default('') }}"
        error: { message: "{{ response.error.message }}" }
        poll:
          until: { all: [{ left: "{{ response.stepsCompleted }}", op: gte, right: "{{ response.stepsTotal }}" }] }
          fail_when: { all: [{ left: "{{ response.error.message }}", op: exists }] }
          every: 2
          timeout: 280
      - name: cleanup
        request:
          method: DELETE
          path: "/sdl/v2/api/queries/{{ steps.launch.response.id }}"
          headers:
            X-Dataset-Query-Forward-Tag: "{{ steps.launch.headers['x-dataset-query-forward-tag'] | default('') }}"
        success: { status: [200, 204, 404] }
    # The reference says the result is an object and does not describe it: it is given as it comes.
    outputs:
      data: "{{ steps.result.response.data }}"
      query_id: "{{ steps.launch.response.id }}"

  - name: list-saved-searches
    description: The searches saved in the Event Search of the console, private to the token's user or shared in its scope.
    arguments:
      - { name: type, type: choice, choices: [PRIVATE, SHARED], default: PRIVATE, description: Whose searches }
    request:
      method: GET
      path: /sdl/v2/api/saved-searches
      query: { type: "{{ args.type }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      searches: "{{ response }}"
      names: "{{ response | pluck('name') }}"
      count: "{{ response | length }}"

  - name: get-alert
    description: One alert of the Singularity Operations Center.
    arguments:
      - { name: id, type: text, required: true, description: The id of the alert }
    request:
      method: POST
      path: /web/api/v2.1/unifiedalerts/graphql
      json:
        query: "query Alert($id: ID!) { alert(id: $id) { id name description severity status analystVerdict classification confidenceLevel detectedAt createdAt updatedAt storylineId asset { id name agentUuid osType } } }"
        variables: { id: "{{ args.id }}" }
    success: { when: { all: [{ left: "{{ response.errors }}", op: empty }] } }
    error: { message: "{{ response.errors[0].message }}" }
    outputs:
      alert: "{{ response.data.alert }}"
      status: "{{ response.data.alert.status }}"
      severity: "{{ response.data.alert.severity }}"

  - name: update-alert
    # Least certain: the mutation and its action ids are known only from the Cortex XSOAR integration.
    description: Set the status of an alert (NEW, IN_PROGRESS, RESOLVED, FALSE_POSITIVE).
    changes_outside: true
    idempotent: true
    arguments:
      - { name: id, type: text, required: true, description: The id of the alert }
      - name: status
        type: choice
        choices: [NEW, IN_PROGRESS, RESOLVED, FALSE_POSITIVE]
        required: true
        description: The status
    request:
      method: POST
      path: /web/api/v2.1/unifiedalerts/graphql
      json:
        query: "mutation SetStatus($id: String!, $status: String!) { alertTriggerActions(filter: { or: [ { and: [ { fieldId: \"id\", stringEqual: { value: $id } } ] } ] }, actions: [ { id: \"S1/alert/statusUpdate\", payload: { status: { value: $status } } } ]) { actions { actionId alertCount success { id } failure { id errorMessage } } } }"
        variables: { id: "{{ args.id }}", status: "{{ args.status }}" }
    success: { when: { all: [{ left: "{{ response.errors }}", op: empty }] } }
    error: { message: "{{ response.errors[0].message }}" }
    outputs:
      updated: "{{ response.data.alertTriggerActions.actions[0].alertCount }}"
      failed: "{{ response.data.alertTriggerActions.actions[0].failure | length }}"
    sample: { updated: 1, failed: 0 }

# Least certain: nothing public says in what order the alerts come, nor how to
# ask for an order. A cycle asks for the alerts detected since five minutes
# before the last one (an alert read twice is taken once) and reads 100 of
# them: where more than 100 are detected between two cycles, some are not read.
fetch:
  interval_seconds: 120
  first_fetch: 1 days
  lookback_minutes: 5
  request:
    method: POST
    path: /web/api/v2.1/unifiedalerts/graphql
    json:
      query: "query SearchAlerts($filters: [FilterInput!], $first: Int!) { alerts(filters: $filters, first: $first) { edges { node { id name description severity status analystVerdict classification confidenceLevel detectedAt storylineId asset { id name } } } pageInfo { hasNextPage endCursor } totalCount } }"
      variables:
        first: 100
        filters:
          - fieldId: detectedAt
            dateTimeRange: { start: "{{ since.epoch_ms }}", startInclusive: true }
  success: { when: { all: [{ left: "{{ response.errors }}", op: empty }] } }
  error: { message: "{{ response.errors[0].message }}" }
  items: "{{ response.data.alerts.edges }}"
  item_id: "{{ item.node.id }}"
  occurred: "{{ item.node.detectedAt }}"

schema:
  incoming:
    - { name: node.id, type: text, description: The id of the alert }
    - { name: node.name, type: text }
    - { name: node.description, type: text }
    - { name: node.severity, type: text, description: "CRITICAL, HIGH, MEDIUM, LOW, INFO or UNKNOWN" }
    - { name: node.status, type: text, description: "NEW, IN_PROGRESS, RESOLVED or FALSE_POSITIVE" }
    - { name: node.analystVerdict, type: text }
    - { name: node.classification, type: text }
    - { name: node.confidenceLevel, type: text }
    - { name: node.detectedAt, type: date }
    - { name: node.storylineId, type: text }
    - { name: node.asset.name, type: text }
