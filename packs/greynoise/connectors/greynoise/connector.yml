      overview: "{{ response }}"

  - name: download-gnql-file
    description: "Every address matching a GNQL query as one CSV file GreyNoise builds and keeps current. The first request for a query subscribes to it, which counts against the limit of the workspace, and waits for the file to be built. Nik keeps the first 200 000 characters. Needs an Advanced or Elite licence."
    premium: true
    changes_outside: true
    arguments:
      - { name: query, type: text, required: true, description: "The GNQL query that selects the addresses, 4 096 characters at most. Each query is a subscription of its own" }
      - { name: profile, type: text, description: "The layout of the columns, as id or id@version: ngsiem when left out. list-feed-profiles gives the others" }
      - { name: limit, type: number, description: "How many addresses at most, most recently seen first: all of them when left out" }
    request:
      method: GET
      path: "/v3/files/gnql"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
        format: "csv"
        profile: "{{ args.profile }}"
        limit: "{{ args.limit }}"
      answer: text
    success: { status: [200, 202] }
    poll:
      until: { all: [{ left: "{{ status }}", op: "eq", right: 200 }] }
      every: 30
      timeout: 900
    error: { message: "{{ response.message }}" }
    timeout: 300
    outputs:
      text: "{{ response.text }}"
      generated_at: "{{ headers['x-greynoise-generated-at'] }}"
      row_count: "{{ headers['x-greynoise-row-count'] }}"
      total_count: "{{ headers['x-greynoise-total-count'] }}"
      truncated: "{{ headers['x-greynoise-truncated'] }}"
      feed_status: "{{ headers['x-greynoise-feed-status'] }}"
      profile: "{{ headers['x-greynoise-profile'] }}"
    sample: { text: "source.ip,source.ip.greynoise.is.classification\n198.51.100.42,malicious\n", generated_at: "2026-10-26T12:00:00Z", row_count: "1", total_count: "1", truncated: "false", feed_status: "active", profile: "ngsiem@1" }

  - name: delete-gnql-file-subscription
    description: "Delete the subscription download-gnql-file made for a query, at once: it stops counting against the limit of the workspace."
    premium: true
    changes_outside: true
    arguments:
      - { name: query, type: text, required: true, description: "The GNQL query the subscription was made for" }
      - { name: profile, type: text, description: "The profile it was fetched with, as id or id@version: ngsiem when left out. With a version, it is deleted only while it is pinned to that version" }
    request:
      method: DELETE
      path: "/v3/files/gnql"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
        format: "csv"
        profile: "{{ args.profile }}"
    success: { status: 204 }
    error: { message: "{{ response.message }}" }
    outputs:
      deleted: "{{ status | map('204', true, else=false) }}"
    sample: { deleted: true }

  - name: get-gnql-file-metadata
    description: "Describe the file download-gnql-file would give for a query, without the file: its status, when it was built and how many addresses it holds. Like the download, the first request for a query subscribes to it. Needs an Advanced or Elite licence."
    premium: true
    changes_outside: true
    arguments:
      - { name: query, type: text, required: true, description: "The GNQL query that selects the addresses, 4 096 characters at most" }
      - { name: profile, type: text, description: "The layout of the columns, as id or id@version: ngsiem when left out. list-feed-profiles gives the others" }
      - { name: limit, type: number, description: "How many addresses at most, most recently seen first: all of them when left out" }
    request:
      method: GET
      path: "/v3/files/gnql/metadata"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
        format: "csv"
        profile: "{{ args.profile }}"
        limit: "{{ args.limit }}"
    success: { status: [200, 202] }
    error: { message: "{{ response.message }}" }
    outputs:
      ready: "{{ status | map('200', true, else=false) }}"
      status: "{{ response.status }}"
      generated_at: "{{ response.generated_at }}"
      row_count: "{{ response.row_count }}"
      total_count: "{{ response.total_count }}"
      truncated: "{{ response.truncated }}"
      profile: "{{ response.profile }}"
      deprecated: "{{ response.deprecated }}"
    sample: { ready: true, status: "active", generated_at: "2026-10-26T12:00:00Z", row_count: 1, total_count: 1, truncated: false, profile: "ngsiem@1", deprecated: false }

  - name: list-feed-profiles
    description: "The profiles a GNQL query file can be asked in, each with the columns its files carry."
    premium: true
