# GreyNoise, through its API v3 (and what remains under /v1).
#
# Written from the vendor's reference, https://docs.greynoise.io/reference:
# one page for each endpoint, each with its OpenAPI definition. Not run
# against the real service: see "verified" below.
#
# The key goes in the "key" header. The Community API (get-community-ip)
# answers without a key, a few addresses a day: the key is optional here, and
# a request is sent without the header when the connection has none.
#
# Almost everything else needs a paid plan, and often one entitlement or
# add-on module among several: those commands say "premium: true", and what
# each needs beyond a plan is in its description. GreyNoise answers 403 to a
# key that may not use an endpoint, and 206 with the fields left out named in
# "restricted_fields" when the plan gives a part only.
#
# The verdict of get-community-ip is the one Nik's own enrichment gives for
# this source: harmless for a common business service (RIOT) and for what
# GreyNoise classifies as benign, malicious for what it classifies as
# malicious, unknown for the rest and for an address GreyNoise has not seen
# (which it answers with 404, taken here as an answer). An expression has no
# "if": each word is written by the one piece that holds for it.
#
# A yes or no in a query is written "true" or "false", as the API reads it.
#
# Not here, because the answer is a binary file, which a connector cannot
# carry: the PCAP of a session or of several (/v3/sessions/export,
# /v3/sessions/{id}/frames, /v3/sessions/{id}/export), the BSI bulk file
# (/v3/bsi/download) and the Psychic models (/v1/psychic,
# /v1/psychic/snapshots). And the private RSS feed (/v3/articles/rss/{token}):
# its address is its credential, and an argument is not a secret.
name: GreyNoise
id: greynoise
version: 1
description: "What GreyNoise knows of an IP address (internet scanner, business service, classification), GNQL searches, CVEs, tags, callback addresses, blocklists, event feeds and the sessions of your own sensors."
api_version: "GreyNoise API v3 (api.greynoise.io, OpenAPI 3.0.0 of the reference)"
verified: false
configuration:
  - name: api_key
    label: API key
    type: secret
    help: "The API key of your GreyNoise account. Leave it empty to ask only the Community API, without an account, a few addresses a day."
base_url: "https://api.greynoise.io"
test:
  request: { method: GET, path: /ping, headers: { key: "{{ secret.api_key | default(null) }}" } }
commands:
  - name: get-community-ip
    description: "What GreyNoise knows of an IP address, from the free Community API: whether it scans the internet (noise), whether it belongs to a common business service (RIOT), and how GreyNoise classifies it."
    reputation: ip
    arguments:
      - { name: ip, type: text, required: true, description: "A routable IPv4 address" }
    request:
      method: GET
      path: "/v3/community/{{ args.ip }}"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    success: { status: [200, 404] }
    error: { message: "{{ response.message }}" }
    outputs:
      verdict: "{{ response | where('riot') | length | map('1', 'harmless', else='') }}\
        {{ response | where('riot', 'ne', true) | where('classification', 'eq', 'malicious') | length | map('1', 'malicious', else='') }}\
        {{ response | where('riot', 'ne', true) | where('classification', 'eq', 'benign') | length | map('1', 'harmless', else='') }}\
        {{ response | where('riot', 'ne', true) | where('classification', 'ne', 'malicious') | where('classification', 'ne', 'benign') | length | map('1', 'unknown', else='') }}"
      summary: "{{ response | where('riot') | length | map('1', 'common business service', else='') }}\
        {{ response | where('riot', 'ne', true) | where('noise') | pluck('classification') | join('') }}\
        {{ response | where('riot', 'ne', true) | where('noise') | length | map('1', ' internet scanner', else='') }}\
        {{ response | where('riot', 'ne', true) | where('noise', 'ne', true) | length | map('1', 'not seen scanning the internet', else='') }}\
        {{ response | where('name') | where('name', 'ne', 'unknown') | length | map('1', ' (', else='') }}\
        {{ response | where('name', 'ne', 'unknown') | pluck('name') | join('') }}\
        {{ response | where('name') | where('name', 'ne', 'unknown') | length | map('1', ')', else='') }}"
      link: "https://viz.greynoise.io/ip/{{ args.ip }}"
      known: "{{ status | map('200', true, else=false) }}"
      noise: "{{ response.noise }}"
      riot: "{{ response.riot }}"
      classification: "{{ response.classification }}"
      name: "{{ response.name }}"
      last_seen: "{{ response.last_seen }}"
      message: "{{ response.message }}"

  - name: ping
    description: "Check that GreyNoise answers and what the key gives: its plan, its add-on modules and when it expires."
    arguments: []
    request:
      method: GET
      path: "/ping"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      message: "{{ response.message }}"
      plan: "{{ response.plan }}"
      modules: "{{ response.modules }}"
      offering: "{{ response.offering }}"
      expiration: "{{ response.expiration }}"
      address: "{{ response.address }}"

  - name: get-ip
    description: "Everything GreyNoise knows of an IP address: what it was seen scanning for (classification, actor, tags, CVEs, ports and requests) and the business service it belongs to, with its trust level."
    premium: true
    arguments:
      - { name: ip, type: text, required: true, description: "An IP address" }
      - { name: quick, type: bool, description: "Only the address with its classification or trust level, for a faster answer" }
      - { name: workspace_labels, type: text, description: "The datasets to read, separated by commas: greynoise (GreyNoise's own, the only one read when left out), community (what the community contributes), personal (your own workspace). Needs the Community Dataset entitlement" }
    request:
      method: GET
      path: "/v3/ip/{{ args.ip }}"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        quick: "{{ args.quick | map('true', 'true', 'false', 'false') }}"
        workspace_labels: "{{ args.workspace_labels }}"
    error: { message: "{{ response.message }}" }
    outputs:
      ip: "{{ response.ip }}"
      seen_scanning: "{{ response.internet_scanner_intelligence.found }}"
      classification: "{{ response.internet_scanner_intelligence.classification }}"
      actor: "{{ response.internet_scanner_intelligence.actor }}"
      tags: "{{ response.internet_scanner_intelligence.tags | pluck('name') }}"
      cves: "{{ response.internet_scanner_intelligence.cves }}"
      first_seen: "{{ response.internet_scanner_intelligence.first_seen }}"
      last_seen: "{{ response.internet_scanner_intelligence.last_seen }}"
      tor: "{{ response.internet_scanner_intelligence.tor }}"
      vpn: "{{ response.internet_scanner_intelligence.vpn }}"
      spoofable: "{{ response.internet_scanner_intelligence.spoofable }}"
      organization: "{{ response.internet_scanner_intelligence.metadata.organization }}"
      country: "{{ response.internet_scanner_intelligence.metadata.source_country }}"
      asn: "{{ response.internet_scanner_intelligence.metadata.asn }}"
      rdns: "{{ response.internet_scanner_intelligence.metadata.rdns }}"
      business_service: "{{ response.business_service_intelligence.found }}"
      service_name: "{{ response.business_service_intelligence.name }}"
      service_category: "{{ response.business_service_intelligence.category }}"
      trust_level: "{{ response.business_service_intelligence.trust_level }}"
      scanner: "{{ response.internet_scanner_intelligence }}"
      service: "{{ response.business_service_intelligence }}"
      restricted_fields: "{{ response.request_metadata.restricted_fields }}"

  - name: get-ips
    description: "Everything GreyNoise knows of several IP addresses at once, 10 000 at most: for each, what it was seen scanning for and the business service it belongs to."
    premium: true
    arguments:
      - { name: ips, type: list, required: true, description: "The IP addresses, 10 000 at most" }
      - { name: quick, type: bool, description: "Only each address with its classification or trust level, for a faster answer" }
      - { name: workspace_labels, type: text, description: "The datasets to read, separated by commas: greynoise (GreyNoise's own, the only one read when left out), community (what the community contributes), personal (your own workspace). Needs the Community Dataset entitlement" }
    request:
      method: POST
      path: "/v3/ip"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        quick: "{{ args.quick | map('true', 'true', 'false', 'false') }}"
        workspace_labels: "{{ args.workspace_labels }}"
      json:
        ips: "{{ args.ips }}"
    error: { message: "{{ response.message }}" }
    outputs:
      records: "{{ response.data }}"
      found: "{{ response.data | pluck('ip') }}"
      not_found: "{{ response.request_metadata.ips_not_found }}"
      invalid: "{{ response.request_metadata.invalid_ips }}"
      message: "{{ response.request_metadata.message }}"
      restricted_fields: "{{ response.request_metadata.restricted_fields }}"

  - name: get-ip-timeline
    description: "How one field of an IP address' scanning changed over time: its classification, the ports it reached, its tags, its user agents, counted for each span of time. Needs an additional licence."
    premium: true
    arguments:
      - { name: ip, type: text, required: true, description: "An IPv4 address" }
      - { name: field, type: choice, choices: ["classification", "destination_port", "http_path", "http_user_agent", "source_asn", "source_asn_subnet", "source_org", "source_rdns", "tag_ids"], default: "classification", description: "The field whose values are counted" }
      - { name: days, type: number, description: "How many days back: 1 when left out; source_asn_subnet goes back 90 days at most" }
      - { name: granularity, type: text, description: "The length of a span, in hours (1h to 24h) or days (1d to 90d): 1d when left out" }
      - { name: workspace_labels, type: text, description: "The datasets to read, separated by commas: greynoise (GreyNoise's own, the only one read when left out), community (what the community contributes), personal (your own workspace). Needs the Community Dataset entitlement" }
    request:
      method: GET
      path: "/v3/noise/ips/{{ args.ip }}/timeline"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        field: "{{ args.field }}"
        days: "{{ args.days }}"
        granularity: "{{ args.granularity }}"
        workspace_labels: "{{ args.workspace_labels }}"
    error: { message: "{{ response.message }}" }
    outputs:
      results: "{{ response.results }}"
      labels: "{{ response.results | pluck('label') | unique }}"
      first_seen: "{{ response.metadata.first_seen }}"
      start: "{{ response.metadata.start }}"
      end: "{{ response.metadata.end }}"
      metadata: "{{ response.metadata }}"

  - name: search-gnql
    description: "The IP addresses that match a GNQL query, each with everything GreyNoise knows of it, read page by page (5 000 addresses at most)."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
      - { name: quick, type: bool, description: "Only each address with its classification or trust level" }
      - { name: exclude, type: text, description: "Fields to leave out of each record, separated by commas: raw_data,metadata.organization,tags" }
    request:
      method: GET
      path: "/v3/gnql"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
        quick: "{{ args.quick | map('true', 'true', 'false', 'false') }}"
        exclude: "{{ args.exclude }}"
    pagination:
      type: cursor
      param: scroll
      next: "{{ response.request_metadata.scroll }}"
      limit_param: size
      limit: 1000
      items: "{{ response.data }}"
      max_pages: 5
    error: { message: "{{ response.message }}" }
    timeout: 120
    outputs:
      records: "{{ response.items }}"
      ips: "{{ response.items | pluck('ip') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"

  - name: search-gnql-metadata
    description: "The IP addresses that match a GNQL query, each without the raw data of its scans (ports, requests, fingerprints): a lighter answer than search-gnql, read page by page (5 000 addresses at most)."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
      - { name: quick, type: bool, description: "Only each address with its classification or trust level" }
      - { name: exclude, type: text, description: "More fields to leave out of each record, separated by commas: metadata.organization,metadata.rdns,tags" }
    request:
      method: GET
      path: "/v3/gnql/metadata"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
        quick: "{{ args.quick | map('true', 'true', 'false', 'false') }}"
        exclude: "{{ args.exclude }}"
    pagination:
      type: cursor
      param: scroll
      next: "{{ response.request_metadata.scroll }}"
      limit_param: size
      limit: 1000
      items: "{{ response.data }}"
      max_pages: 5
    error: { message: "{{ response.message }}" }
    timeout: 120
    outputs:
      records: "{{ response.items }}"
      ips: "{{ response.items | pluck('ip') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"

  - name: get-gnql-stats
    description: "The most common organisations, actors, tags, ASNs, countries, classifications and operating systems among the addresses that match a GNQL query."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
      - { name: count, type: number, description: "How many of the most common values of each kind: 1 to 10 000, 1 000 when left out" }
    request:
      method: GET
      path: "/v3/gnql/stats"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
        count: "{{ args.count }}"
    error: { message: "{{ response.message }}" }
    outputs:
      count: "{{ response.count }}"
      adjusted_query: "{{ response.adjusted_query }}"
      classifications: "{{ response.stats.classifications }}"
      tags: "{{ response.stats.tags }}"
      actors: "{{ response.stats.actors }}"
      organizations: "{{ response.stats.organizations }}"
      asns: "{{ response.stats.asns }}"
      source_countries: "{{ response.stats.source_countries }}"
      stats: "{{ response.stats }}"

  - name: count-gnql
    description: "How many IP addresses match a GNQL query, without the addresses themselves."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
    request:
      method: GET
      path: "/v3/gnql/count"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
    error: { message: "{{ response.message }}" }
    outputs:
      count: "{{ response.count }}"
      query: "{{ response.query }}"
      adjusted_query: "{{ response.adjusted_query }}"
      message: "{{ response.message }}"
      restricted_fields: "{{ response.restricted_fields }}"

  - name: export-gnql-ips
    description: "Every IP address that matches a GNQL query, the addresses alone, most recently seen first, in one answer. Needs the IP bulk export entitlement."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
      - { name: exclude_riot, type: bool, description: "Leave out the addresses of business services of trust level 1 and 2, which a blocklist should never hold. Needs the BSI module: without it nothing is left out" }
    request:
      method: GET
      path: "/v3/gnql/ips"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
        exclude_riot: "{{ args.exclude_riot | map('true', 'true', 'false', 'false') }}"
    error: { message: "{{ response.message }}" }
    timeout: 300
    outputs:
      ips: "{{ response.ips }}"
      count: "{{ response.request_metadata.count }}"
      adjusted_query: "{{ response.request_metadata.adjusted_query }}"
      message: "{{ response.request_metadata.message }}"

  - name: validate-gnql
    description: "Say whether a GNQL query would be accepted, without running it, with every reason it is refused and the query that would run if the plan rewrites it."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "The GNQL query to check, 4 096 characters at most" }
      - { name: report_unknown_tags, type: bool, description: "Also name the tags of the query that no tag of your workspace matches" }
    request:
      method: POST
      path: "/v3/gnql/validate"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        query: "{{ args.query }}"
        report_unknown_tags: "{{ args.report_unknown_tags }}"
    error: { message: "{{ response.message }}" }
    outputs:
      valid: "{{ response.valid }}"
      message: "{{ response.message }}"
      errors: "{{ response.errors }}"
      adjusted_query: "{{ response.adjusted_query }}"
      is_query_adjusted: "{{ response.is_query_adjusted }}"
      unknown_tags: "{{ response.unknown_tags }}"

  - name: list-gnql-fields
    description: "The fields a GNQL query may use, each with what it holds, the kinds of value it takes and whether your plan includes it."
    premium: true
    arguments: []
    request:
      method: GET
      path: "/v3/gnql/fields"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      fields: "{{ response.fields }}"
      names: "{{ response.fields | pluck('name') }}"
      restricted: "{{ response.fields | where('is_restricted') | pluck('name') }}"

  - name: get-gnql-timeseries
    description: "The records that matched a GNQL query in each hour of a time range (Recall): the answer has one entry for each hour, named YYYY-MM-DD-HH, holding the addresses seen in it."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
      - { name: start, type: text, description: "The start of the time range, as an ISO 8601 date: 2025-01-01T00:00:00Z" }
      - { name: end, type: text, description: "The end of the time range, as an ISO 8601 date: 2025-01-07T23:59:59Z" }
      - { name: limit, type: number, description: "How many records are read, spread over the hours" }
      - { name: offset, type: number, description: "How many records to skip before the limit applies, to read a long answer in parts" }
    request:
      method: GET
      path: "/v3/gnql/timeseries"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
        start: "{{ args.start }}"
        end: "{{ args.end }}"
        limit: "{{ args.limit }}"
        offset: "{{ args.offset }}"
    error: { message: "{{ response.message }}" }
    timeout: 120
    outputs:
      hours: "{{ response | keys }}"
      records: "{{ response }}"

  - name: get-gnql-timeseries-stats
    description: "How many distinct IP addresses matched a GNQL query in each hour or each day of a time range (Recall)."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
      - { name: interval, type: choice, required: true, choices: ["hour", "day"], description: "Count for each hour or for each day" }
      - { name: start, type: text, description: "The start of the time range, as an ISO 8601 date: 2025-01-01T00:00:00Z" }
      - { name: end, type: text, description: "The end of the time range, as an ISO 8601 date: 2025-01-07T23:59:59Z" }
    request:
      method: GET
      path: "/v3/gnql/timeseries/stats"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        query: "{{ args.query }}"
        interval: "{{ args.interval }}"
        start: "{{ args.start }}"
        end: "{{ args.end }}"
    error: { message: "{{ response.message }}" }
    outputs:
      count: "{{ response.count }}"
      min: "{{ response.min }}"
      max: "{{ response.max }}"
      points: "{{ response.data }}"

  - name: list-cves
    description: "The CVEs GreyNoise tracks, newest first or by CVSS score, 1 000 at most. Needs the bulk CVE search entitlement; how much each record says depends on the CVE Insights tier of the plan."
    premium: true
    arguments:
      - { name: sort, type: choice, choices: ["published", "updated", "cvss"], description: "What the list is ordered by: published when left out" }
      - { name: order, type: choice, choices: ["desc", "asc"], description: "Highest or newest first (desc, the default) or last (asc)" }
      - { name: exploitable_only, type: bool, description: "Only the CVEs that are attacked over the network" }
      - { name: limit, type: number, description: "How many CVEs: 1 to 1 000, 100 when left out" }
      - { name: include_vendors, type: bool, description: "Also give the vendors and the products the CVE concerns" }
    request:
      method: GET
      path: "/v3/cves/list"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        sort: "{{ args.sort }}"
        order: "{{ args.order }}"
        exploitable_only: "{{ args.exploitable_only | map('true', 'true', 'false', 'false') }}"
        limit: "{{ args.limit }}"
        include_vendors: "{{ args.include_vendors | map('true', 'true', 'false', 'false') }}"
    error: { message: "{{ response.message }}" }
    outputs:
      cves: "{{ response.cves }}"
      ids: "{{ response.cves | pluck('id') }}"
      count: "{{ response.cves | length }}"
      generated_at: "{{ response.generated_at }}"

  - name: get-cves
    description: "What GreyNoise knows of several CVEs at once, 10 000 at most: details, dates, whether they are exploited and by how many addresses. How much each record says depends on the plan."
    premium: true
    arguments:
      - { name: cves, type: list, required: true, description: "The CVE ids, 10 000 at most: CVE-2024-12345" }
      - { name: include_vendors, type: bool, description: "Also give the vendors and the products the CVE concerns" }
    request:
      method: POST
      path: "/v3/cves"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        include_vendors: "{{ args.include_vendors | map('true', 'true', 'false', 'false') }}"
      json:
        cves: "{{ args.cves }}"
    error: { message: "{{ response.message }}" }
    outputs:
      cves: "{{ response }}"
      ids: "{{ response | pluck('id') }}"
      exploited: "{{ response | where('exploitation_activity.activity_seen') | pluck('id') }}"

  - name: get-cve
    description: "What GreyNoise knows of one CVE: its details, its dates, whether an exploit exists and whether addresses were seen exploiting it in the last 1, 10 and 30 days. How much it says depends on the plan."
    premium: true
    arguments:
      - { name: cve, type: text, required: true, description: "The id of the CVE: CVE-2024-12345" }
      - { name: include_vendors, type: bool, description: "Also give the vendors and the products the CVE concerns" }
      - { name: workspace_labels, type: text, description: "The datasets to read, separated by commas: greynoise (GreyNoise's own, the only one read when left out), community (what the community contributes), personal (your own workspace). Needs the Community Dataset entitlement" }
    request:
      method: GET
      path: "/v1/cve/{{ args.cve }}"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        include_vendors: "{{ args.include_vendors | map('true', 'true', 'false', 'false') }}"
        workspace_labels: "{{ args.workspace_labels }}"
    error: { message: "{{ response.message }}" }
    outputs:
      id: "{{ response.id }}"
      name: "{{ response.details.vulnerability_name }}"
      description: "{{ response.details.vulnerability_description }}"
      cvss: "{{ response.details.cve_cvss_score }}"
      vendor: "{{ response.details.vendor }}"
      product: "{{ response.details.product }}"
      published: "{{ response.timeline.cve_published_date }}"
      kev_added: "{{ response.timeline.cisa_kev_date_added }}"
      attack_vector: "{{ response.exploitation_details.attack_vector }}"
      exploit_found: "{{ response.exploitation_details.exploit_found }}"
      in_kev: "{{ response.exploitation_details.exploitation_registered_in_kev }}"
      epss: "{{ response.exploitation_details.epss_score }}"
      activity_seen: "{{ response.exploitation_activity.activity_seen }}"
      threat_ips_1d: "{{ response.exploitation_activity.threat_ip_count_1d }}"
      threat_ips_10d: "{{ response.exploitation_activity.threat_ip_count_10d }}"
      threat_ips_30d: "{{ response.exploitation_activity.threat_ip_count_30d }}"
      cve: "{{ response }}"

  - name: list-tags
    description: "The tags GreyNoise gives to what addresses do (a worm, a scanner, the exploitation of a CVE), each with its intention, its category, its CVEs and whether GreyNoise recommends blocking."
    arguments:
      - { name: name, type: text, description: "Only the tags whose name holds this text: Mirai" }
      - { name: slug, type: text, description: "Only the tag with exactly this slug: mirai" }
      - { name: cve, type: text, description: "Only the tags that concern this CVE: CVE-2020-1234" }
      - { name: include_vendors, type: bool, description: "Also give the vendors and the products each tag concerns" }
    request:
      method: GET
      path: "/v3/tags"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        name: "{{ args.name }}"
        slug: "{{ args.slug }}"
        cve: "{{ args.cve }}"
        include_vendors: "{{ args.include_vendors | map('true', 'true', 'false', 'false') }}"
    error: { message: "{{ response.message }}" }
    outputs:
      tags: "{{ response.tags }}"
      names: "{{ response.tags | pluck('name') }}"
      ids: "{{ response.tags | pluck('id') }}"
      count: "{{ response.tags | length }}"

  - name: get-tag-activity
    description: "How many distinct IP addresses were seen for one tag in each span of time over the last days, and, when asked, the addresses themselves (1 000 a span at most)."
    premium: true
    arguments:
      - { name: id, type: text, required: true, description: "The UUID of the tag, as list-tags gives it" }
      - { name: days, type: number, description: "How many days back: 1 to 90, 1 when left out. The plan may shorten it" }
      - { name: granularity, type: text, description: "The length of a span in whole hours, from 1h to 168h: 24h when left out" }
      - { name: include_ips, type: bool, description: "Also give the addresses seen in each span: much slower than the counts alone" }
      - { name: workspace_labels, type: text, description: "The datasets to read, separated by commas: greynoise (GreyNoise's own, the only one read when left out), community (what the community contributes), personal (your own workspace). Needs the Community Dataset entitlement" }
    request:
      method: GET
      path: "/v3/tags/{{ args.id }}/activity"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        days: "{{ args.days }}"
        granularity: "{{ args.granularity }}"
        include_ips: "{{ args.include_ips | map('true', 'true', 'false', 'false') }}"
        workspace_labels: "{{ args.workspace_labels }}"
    error: { message: "{{ response.message }}" }
    outputs:
      slug: "{{ response.slug }}"
      activity: "{{ response.activity }}"
      total_ips: "{{ response.aggregations.total_ips }}"
      by_intention: "{{ response.aggregations.classification }}"
      start: "{{ response.metadata.start_date }}"
      end: "{{ response.metadata.end_date }}"
      ips_truncated: "{{ response.metadata.ips_truncated }}"

  - name: diff-workspaces
    description: "Compare what two workspaces hold of the addresses that match a GNQL query: for each address, which workspace has it and which fields differ. One page at a time: give next_token to read the next."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
      - { name: source_workspace, type: text, description: "The workspace compared from: a workspace UUID, or greynoise, community or personal. The workspace of the key when left out" }
      - { name: target_workspace, type: text, description: "The workspace compared against: a workspace UUID, or greynoise, community or personal. GreyNoise's own data when left out" }
      - { name: size, type: number, description: "How many addresses a page: 1 to 1 000, 10 when left out" }
      - { name: next_token, type: text, description: "The next_token of the page before, to read the page after it" }
      - { name: require_both_workspaces, type: bool, description: "Only the addresses both workspaces hold" }
      - { name: ips_from_source, type: bool, description: "Only the addresses that come from the source workspace" }
    request:
      method: POST
      path: "/v3/workspaces/diff"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        source_workspace: "{{ args.source_workspace }}"
        target_workspace: "{{ args.target_workspace }}"
        query: "{{ args.query }}"
        size: "{{ args.size }}"
        next_token: "{{ args.next_token }}"
        require_both_workspaces: "{{ args.require_both_workspaces }}"
        ips_from_source: "{{ args.ips_from_source }}"
    error: { message: "{{ response.message }}" }
    outputs:
      diffs: "{{ response.ip_diffs }}"
      ips: "{{ response.ip_diffs | pluck('ip') }}"
      count: "{{ response.count }}"
      next_token: "{{ response.next_token }}"
      source_workspace_name: "{{ response.source_workspace_name }}"
      target_workspace_name: "{{ response.target_workspace_name }}"
      adjusted_query: "{{ response.adjusted_query }}"

  - name: diff-workspace-stats
    description: "Compare the statistics of a GNQL query in two workspaces: the most common classifications, tags, organisations, countries and ASNs of each, and which are in both or in one only."
    premium: true
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
      - { name: source_workspace, type: text, description: "The workspace compared from: a workspace UUID, or greynoise, community or personal. The workspace of the key when left out" }
      - { name: target_workspace, type: text, description: "The workspace compared against: a workspace UUID, or greynoise, community or personal. GreyNoise's own data when left out" }
      - { name: count, type: number, description: "How many values of each kind: 10 when left out" }
    request:
      method: POST
      path: "/v3/workspaces/stats-diff"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        source_workspace: "{{ args.source_workspace }}"
        target_workspace: "{{ args.target_workspace }}"
        query: "{{ args.query }}"
        count: "{{ args.count }}"
    error: { message: "{{ response.message }}" }
    outputs:
      source_count: "{{ response.source_count }}"
      target_count: "{{ response.target_count }}"
      source_stats: "{{ response.source_stats }}"
      target_stats: "{{ response.target_stats }}"
      diff: "{{ response.diff }}"
      adjusted_query: "{{ response.adjusted_query }}"

  - name: start-unique-ips-job
    description: "Start the search for the addresses that match a GNQL query in one workspace and not in another. It gives the id of a job: get-unique-ips-job waits for it and gives the addresses."
    premium: true
    idempotent: false
    arguments:
      - { name: query, type: text, required: true, description: "A GNQL query: classification:malicious last_seen:1d" }
      - { name: source_workspace, type: text, description: "The workspace compared from: a workspace UUID, or greynoise, community or personal. The workspace of the key when left out" }
      - { name: target_workspace, type: text, description: "The workspace compared against: a workspace UUID, or greynoise, community or personal. GreyNoise's own data when left out" }
    request:
      method: POST
      path: "/v3/workspaces/unique-ips"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        source_workspace: "{{ args.source_workspace }}"
        target_workspace: "{{ args.target_workspace }}"
        query: "{{ args.query }}"
    error: { message: "{{ response.message }}" }
    outputs:
      job_id: "{{ response.job_id }}"

  - name: get-unique-ips-job
    description: "Wait for a job started by start-unique-ips-job and give the addresses it found, a page at a time. A job is kept 15 minutes after it finishes."
    premium: true
    arguments:
      - { name: job_id, type: text, required: true, description: "The id start-unique-ips-job gave" }
      - { name: limit, type: number, description: "How many addresses: 10 000 when left out" }
      - { name: offset, type: number, description: "How many addresses to skip, to read the next page" }
    request:
      method: GET
      path: "/v3/workspaces/unique-ips/{{ args.job_id }}"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        limit: "{{ args.limit }}"
        offset: "{{ args.offset }}"
    poll:
      until: { all: [{ left: "{{ response.status }}", op: "eq", right: "complete" }] }
      fail_when: { all: [{ left: "{{ response.status }}", op: "eq", right: "error" }] }
      every: 10
      timeout: 1800
    error: { message: "{{ response.message }}" }
    outputs:
      status: "{{ response.status }}"
      ips: "{{ response.unique_ips }}"
      found: "{{ response.found }}"
      total: "{{ response.total }}"
      has_more: "{{ response.has_more }}"
      capped: "{{ response.capped }}"

  - name: get-callback-ip
    description: "What GreyNoise knows of a callback address, one that payloads seen by its sensors call back to: its stage, the scanners that pointed to it and the malware files downloaded from it."
    premium: true
    arguments:
      - { name: ip, type: text, required: true, description: "The callback IP address" }
    request:
      method: GET
      path: "/v1/callback/ip/{{ args.ip }}"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      ip: "{{ response.ip }}"
      is_stage_1: "{{ response.is_stage_1 }}"
      is_stage_2: "{{ response.is_stage_2 }}"
      is_riot: "{{ response.is_riot }}"
      first_seen: "{{ response.first_seen }}"
      last_seen: "{{ response.last_seen }}"
      scanner_ips: "{{ response.scanner_ips }}"
      scanner_count: "{{ response.scanner_count }}"
      file_count: "{{ response.file_count }}"
      files: "{{ response.active_files }}"
      sha256: "{{ response.active_files | pluck('sha256') }}"
      enrichment: "{{ response.enrichment }}"

  - name: list-callback-ips
    description: "The callback addresses that match filters, each with its stage, its scanners and its files. One page at a time: page counts from 0."
    premium: true
    arguments:
      - { name: is_stage_1, type: bool, description: "Only addresses a file was downloaded from (true) or was not (false)" }
      - { name: is_stage_2, type: bool, description: "Only addresses suspected of command and control (true) or not (false)" }
      - { name: first_seen_after, type: text, description: "Only addresses first seen after this date: YYYY-MM-DD" }
      - { name: first_seen_before, type: text, description: "Only addresses first seen before this date: YYYY-MM-DD" }
      - { name: last_seen_after, type: text, description: "Only addresses last seen after this date: YYYY-MM-DD" }
      - { name: last_seen_before, type: text, description: "Only addresses last seen before this date: YYYY-MM-DD" }
      - { name: has_files, type: bool, description: "Only addresses with malware files (true) or without (false)" }
      - { name: file_type, type: text, description: "Only addresses with a file of this MIME type: application/x-executable" }
      - { name: file_name, type: text, description: "Only addresses with a file whose name holds this text" }
      - { name: file_hash, type: text, description: "Only addresses with the file of this SHA-256" }
      - { name: scanner_ips, type: list, description: "Only addresses that these scanner addresses pointed to" }
      - { name: ips, type: list, description: "Only these callback addresses" }
      - { name: page, type: number, description: "The page, counted from 0: 0 when left out" }
      - { name: page_size, type: number, description: "How many addresses a page: 1 to 1 000, 20 when left out" }
    request:
      method: POST
      path: "/v1/callback/ips"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        is_stage_1: "{{ args.is_stage_1 }}"
        is_stage_2: "{{ args.is_stage_2 }}"
        first_seen_after: "{{ args.first_seen_after }}"
        first_seen_before: "{{ args.first_seen_before }}"
        last_seen_after: "{{ args.last_seen_after }}"
        last_seen_before: "{{ args.last_seen_before }}"
        has_files: "{{ args.has_files }}"
        file_type: "{{ args.file_type }}"
        file_name: "{{ args.file_name }}"
        file_hash: "{{ args.file_hash }}"
        scanner_ips: "{{ args.scanner_ips }}"
        ips: "{{ args.ips }}"
        page: "{{ args.page }}"
        page_size: "{{ args.page_size }}"
    error: { message: "{{ response.message }}" }
    outputs:
      records: "{{ response.items }}"
      ips: "{{ response.items | pluck('ip') }}"
      total: "{{ response.total }}"
      page: "{{ response.page }}"
      page_size: "{{ response.page_size }}"

  - name: export-callback-ips
    description: "The callback addresses that match filters, the addresses alone, as a list and as plain text."
    premium: true
    arguments:
      - { name: is_stage_1, type: bool, description: "Only addresses a file was downloaded from (true) or was not (false)" }
      - { name: is_stage_2, type: bool, description: "Only addresses suspected of command and control (true) or not (false)" }
      - { name: first_seen_after, type: text, description: "Only addresses first seen after this date: YYYY-MM-DD" }
      - { name: first_seen_before, type: text, description: "Only addresses first seen before this date: YYYY-MM-DD" }
      - { name: last_seen_after, type: text, description: "Only addresses last seen after this date: YYYY-MM-DD" }
      - { name: last_seen_before, type: text, description: "Only addresses last seen before this date: YYYY-MM-DD" }
      - { name: has_files, type: bool, description: "Only addresses with malware files (true) or without (false)" }
      - { name: file_type, type: text, description: "Only addresses with a file of this MIME type: application/x-executable" }
      - { name: file_name, type: text, description: "Only addresses with a file whose name holds this text" }
      - { name: file_hash, type: text, description: "Only addresses with the file of this SHA-256" }
      - { name: scanner_ips, type: list, description: "Only addresses that these scanner addresses pointed to" }
      - { name: ips, type: list, description: "Only these callback addresses" }
    request:
      method: POST
      path: "/v1/callback/export-ips"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        is_stage_1: "{{ args.is_stage_1 }}"
        is_stage_2: "{{ args.is_stage_2 }}"
        first_seen_after: "{{ args.first_seen_after }}"
        first_seen_before: "{{ args.first_seen_before }}"
        last_seen_after: "{{ args.last_seen_after }}"
        last_seen_before: "{{ args.last_seen_before }}"
        has_files: "{{ args.has_files }}"
        file_type: "{{ args.file_type }}"
        file_name: "{{ args.file_name }}"
        file_hash: "{{ args.file_hash }}"
        scanner_ips: "{{ args.scanner_ips }}"
        ips: "{{ args.ips }}"
