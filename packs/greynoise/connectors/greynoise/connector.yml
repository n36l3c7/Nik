      days: "{{ response.days }}"
      size_bytes: "{{ response.size_bytes }}"
      row_count: "{{ response.row_count }}"

  - name: search-sessions
    description: "The network sessions your GreyNoise sensors captured in a time range, filtered by a Lucene query, read page by page (1 000 sessions at most)."
    premium: true
    arguments:
      - { name: start_time, type: text, required: true, description: "The start of the time range, as an ISO 8601 date: 2025-01-01T00:00:00Z" }
      - { name: end_time, type: text, required: true, description: "The end of the time range, as an ISO 8601 date: 2025-01-07T23:59:59Z" }
      - { name: query, type: text, description: "A Lucene query that filters the sessions" }
      - { name: sort_by, type: text, description: "The field the sessions are ordered by: lastPacket when left out" }
      - { name: sort_desc, type: choice, choices: ["true", "false"], description: "Highest first (true, the default) or lowest first (false)" }
      - { name: scope, type: choice, choices: ["workspace", "demo"], description: "workspace (the default): the sessions of your own sensors, which needs the Sensors entitlement; demo: sample data, which needs the Swarm entitlement" }
    request:
      method: GET
      path: "/v3/sessions"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        start_time: "{{ args.start_time }}"
        end_time: "{{ args.end_time }}"
        query: "{{ args.query }}"
        sort_by: "{{ args.sort_by }}"
        sort_desc: "{{ args.sort_desc }}"
        scope: "{{ args.scope }}"
    pagination:
      type: page
      param: page
      limit_param: page_size
      limit: 100
      items: "{{ response.sessions }}"
      max_pages: 10
    error: { message: "{{ response.message }}" }
    outputs:
      sessions: "{{ response.items }}"
      ids: "{{ response.items | pluck('_id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"

  - name: list-session-fields
    description: "The fields of a session that can be used in a query, a sort or a count, each with its type and what it holds."
    premium: true
    arguments:
      - { name: scope, type: choice, choices: ["workspace", "demo"], description: "workspace (the default): the sessions of your own sensors, which needs the Sensors entitlement; demo: sample data, which needs the Swarm entitlement" }
    request:
      method: GET
      path: "/v3/sessions/fields"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        scope: "{{ args.scope }}"
    error: { message: "{{ response.message }}" }
    outputs:
      fields: "{{ response.fields }}"
      names: "{{ response.fields | pluck('value') }}"

  - name: count-sessions
    description: "How many sessions there are for each value of one or more fields in a time range: the addresses that connected most, the ports reached most."
    premium: true
    arguments:
      - { name: start_time, type: text, required: true, description: "The start of the time range, as an ISO 8601 date: 2025-01-01T00:00:00Z" }
      - { name: end_time, type: text, required: true, description: "The end of the time range, as an ISO 8601 date: 2025-01-07T23:59:59Z" }
      - { name: fields, type: text, required: true, description: "The fields counted, separated by commas; each after the first is counted within the one before: source.ip,destination.port" }
      - { name: query, type: text, description: "A Lucene query that filters the sessions" }
      - { name: size, type: number, description: "How many values of each field: 1 to 100, 10 when left out" }
      - { name: scope, type: choice, choices: ["workspace", "demo"], description: "workspace (the default): the sessions of your own sensors, which needs the Sensors entitlement; demo: sample data, which needs the Swarm entitlement" }
    request:
      method: GET
      path: "/v3/sessions/counts"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        start_time: "{{ args.start_time }}"
        end_time: "{{ args.end_time }}"
        fields: "{{ args.fields }}"
        query: "{{ args.query }}"
        size: "{{ args.size }}"
        scope: "{{ args.scope }}"
    error: { message: "{{ response.message }}" }
    outputs:
      counts: "{{ response.items }}"
      labels: "{{ response.items | pluck('label') }}"
      total: "{{ response.total }}"

  - name: get-session-connections
    description: "Who talked to whom in the sessions of a time range, as a graph: the values of a source field and of a destination field, and how many sessions link each pair."
    premium: true
    arguments:
      - { name: start_time, type: text, required: true, description: "The start of the time range, as an ISO 8601 date: 2025-01-01T00:00:00Z" }
      - { name: end_time, type: text, required: true, description: "The end of the time range, as an ISO 8601 date: 2025-01-07T23:59:59Z" }
      - { name: query, type: text, description: "A Lucene query that filters the sessions" }
      - { name: src_field, type: text, description: "The field of the sources: source.ip when left out" }
      - { name: dest_field, type: text, description: "The field of the destinations: destination.ip when left out" }
      - { name: max_nodes, type: number, description: "How many nodes at most: 1 to 10 000, 100 when left out" }
      - { name: min_connections, type: number, description: "The fewest connections a node must have to be given: 1 when left out" }
      - { name: scope, type: choice, choices: ["workspace", "demo"], description: "workspace (the default): the sessions of your own sensors, which needs the Sensors entitlement; demo: sample data, which needs the Swarm entitlement" }
    request:
      method: GET
      path: "/v3/sessions/connections"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        start_time: "{{ args.start_time }}"
        end_time: "{{ args.end_time }}"
        query: "{{ args.query }}"
        src_field: "{{ args.src_field }}"
        dest_field: "{{ args.dest_field }}"
        max_nodes: "{{ args.max_nodes }}"
        min_connections: "{{ args.min_connections }}"
        scope: "{{ args.scope }}"
    error: { message: "{{ response.message }}" }
    outputs:
      nodes: "{{ response.nodes }}"
      links: "{{ response.links }}"
      total: "{{ response.total }}"

  - name: get-session-timeseries
    description: "How many sessions there were in each span of a time range, in all or for each of the most common values of a field."
    premium: true
    arguments:
      - { name: start_time, type: text, required: true, description: "The start of the time range, as an ISO 8601 date: 2025-01-01T00:00:00Z" }
      - { name: end_time, type: text, required: true, description: "The end of the time range, as an ISO 8601 date: 2025-01-07T23:59:59Z" }
      - { name: query, type: text, description: "A Lucene query that filters the sessions" }
      - { name: field, type: text, description: "A field to count separately for each of its values: destination.port" }
      - { name: size, type: number, description: "How many values of the field: 1 to 100, 10 when left out" }
      - { name: interval, type: choice, choices: ["auto", "1s", "1m", "1h", "1d"], description: "The length of a span: auto when left out" }
      - { name: scope, type: choice, choices: ["workspace", "demo"], description: "workspace (the default): the sessions of your own sensors, which needs the Sensors entitlement; demo: sample data, which needs the Swarm entitlement" }
    request:
      method: GET
      path: "/v3/sessions/timeseries"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        start_time: "{{ args.start_time }}"
        end_time: "{{ args.end_time }}"
        query: "{{ args.query }}"
        field: "{{ args.field }}"
        size: "{{ args.size }}"
        interval: "{{ args.interval }}"
        scope: "{{ args.scope }}"
    error: { message: "{{ response.message }}" }
    outputs:
      timeseries: "{{ response.timeseries }}"
      by_value: "{{ response.items }}"
      total: "{{ response.total }}"

  - name: get-session-unique-values
    description: "The distinct values a field takes in the sessions of a time range (every source address, every port), as CSV, with how many sessions hold each when asked. Nik keeps the first 200 000 characters."
    premium: true
    arguments:
      - { name: start_time, type: text, required: true, description: "The start of the time range, as an ISO 8601 date: 2025-01-01T00:00:00Z" }
      - { name: end_time, type: text, required: true, description: "The end of the time range, as an ISO 8601 date: 2025-01-07T23:59:59Z" }
      - { name: field, type: text, required: true, description: "The field whose values are listed: source.ip" }
      - { name: query, type: text, description: "A Lucene query that filters the sessions" }
      - { name: include_counts, type: choice, choices: ["true", "false"], description: "Also give how many sessions hold each value: false when left out" }
      - { name: scope, type: choice, choices: ["workspace", "demo"], description: "workspace (the default): the sessions of your own sensors, which needs the Sensors entitlement; demo: sample data, which needs the Swarm entitlement" }
    request:
      method: GET
      path: "/v3/sessions/unique"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        start_time: "{{ args.start_time }}"
        end_time: "{{ args.end_time }}"
        field: "{{ args.field }}"
        query: "{{ args.query }}"
        include_counts: "{{ args.include_counts }}"
        scope: "{{ args.scope }}"
      answer: text
    error: { message: "{{ response.message }}" }
    outputs:
      text: "{{ response.text }}"
      lines: "{{ response.text | split('\\n') }}"

  - name: get-session
    description: "One session by its id: when it started and ended, its two ends, how much each sent, its classification."
    premium: true
    arguments:
      - { name: session_id, type: text, required: true, description: "The id of the session, as search-sessions gives it" }
      - { name: scope, type: choice, choices: ["workspace", "demo"], description: "workspace (the default): the sessions of your own sensors, which needs the Sensors entitlement; demo: sample data, which needs the Swarm entitlement" }
    request:
      method: GET
      path: "/v3/sessions/{{ args.session_id }}"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        scope: "{{ args.scope }}"
    error: { message: "{{ response.message }}" }
    outputs:
      id: "{{ response._id }}"
      first_packet: "{{ response.firstPacket }}"
      last_packet: "{{ response.lastPacket }}"
      source_ip: "{{ response['source.ip'] }}"
      source_port: "{{ response['source.port'] }}"
      destination_ip: "{{ response['destination.ip'] }}"
      destination_port: "{{ response['destination.port'] }}"
      classification: "{{ response.classification }}"
      session: "{{ response }}"

  - name: get-bsi-trust-stats
