        size: "{{ args.size }}"
    error: { message: "{{ response.message }}" }
    outputs:
      ips: "{{ response.ips }}"
      count: "{{ response.ips | length }}"

  - name: search-feed-events
    description: "Search the events the feeds of the workspace kept (an address that changed classification, a spike of a CVE or a tag, a new callback address), newest first, without moving any consumer. One page at a time: give cursor to read the next."
    premium: true
    arguments:
      - { name: feed_ids, type: list, description: "The UUIDs of the feeds, 100 at most: every enabled feed of the workspace when left out" }
      - { name: event_types, type: list, description: "Only these kinds of event: ip-classification-change, cve-status-change, cve-activity-spike, vendor-cve-spike, tag-spike, new-callback-ip, new-callback-file, credential-observed" }
      - { name: ip, type: text, description: "Only the events of exactly this IP address" }
      - { name: cve, type: text, description: "Only the events of exactly this CVE" }
      - { name: tag, type: text, description: "Only the events of exactly this tag: Mirai Variant" }
      - { name: classification, type: text, description: "Only the events of exactly this classification: malicious" }
      - { name: from, type: text, description: "Since when: a number of hours or days before the end (6h, 7d), a UTC day (YYYY-MM-DD) or an RFC 3339 time. One hour before the end when left out" }
      - { name: to, type: text, description: "Until when, not included: a UTC day (YYYY-MM-DD) or an RFC 3339 time. Now when left out" }
      - { name: cursor, type: text, description: "The cursor of the page before, to read the page after it: then only limit may be given with it" }
      - { name: limit, type: number, description: "How many events: 1 to 1 000, 100 when left out" }
    request:
      method: POST
      path: "/v3/feeds/events/search"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        feed_ids: "{{ args.feed_ids }}"
        event_types: "{{ args.event_types }}"
        ip: "{{ args.ip }}"
        cve: "{{ args.cve }}"
        tag: "{{ args.tag }}"
        classification: "{{ args.classification }}"
        from: "{{ args.from }}"
        to: "{{ args.to }}"
        cursor: "{{ args.cursor }}"
        limit: "{{ args.limit }}"
    error: { message: "{{ response.message }}" }
    outputs:
      events: "{{ response.events }}"
      count: "{{ response.events | length }}"
      cursor: "{{ response.cursor }}"
      has_more: "{{ response.has_more }}"
      oldest_available_at: "{{ response.retention.oldest_available_at }}"

  - name: fetch-feed-events
    description: "The events of a feed that come after what a consumer acknowledged, oldest first. Nothing moves until acknowledge-feed-events is given the cursor: asking again before that gives the same events."
    premium: true
    arguments:
      - { name: feed_id, type: text, required: true, description: "The UUID of the feed, which belongs to the workspace of the key" }
      - { name: consumer, type: text, description: "The name of the consumer, whose place in the feed GreyNoise keeps: default when left out" }
      - { name: limit, type: number, description: "How many events: 1 to 1 000, 100 when left out" }
    request:
      method: GET
      path: "/v3/feeds/{{ args.feed_id }}/events"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        consumer: "{{ args.consumer }}"
        limit: "{{ args.limit }}"
    error: { message: "{{ response.message }}" }
    outputs:
      events: "{{ response.events }}"
      count: "{{ response.events | length }}"
      cursor: "{{ response.cursor }}"
      has_more: "{{ response.has_more }}"
      consumer: "{{ response.consumer }}"
      gap_detected: "{{ response.retention.gap_detected }}"
      oldest_available_at: "{{ response.retention.oldest_available_at }}"

  - name: acknowledge-feed-events
    description: "Tell GreyNoise that the events up to a cursor were dealt with: the consumer moves there and the next fetch gives what comes after. Acknowledging the same or an older cursor again changes nothing."
    premium: true
    changes_outside: true
    arguments:
      - { name: feed_id, type: text, required: true, description: "The UUID of the feed, which belongs to the workspace of the key" }
      - { name: cursor, type: text, required: true, description: "The cursor fetch-feed-events gave" }
      - { name: consumer, type: text, description: "The consumer the events were fetched with: default when left out" }
    request:
      method: POST
      path: "/v3/feeds/{{ args.feed_id }}/events/ack"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        cursor: "{{ args.cursor }}"
        consumer: "{{ args.consumer }}"
    error: { message: "{{ response.message }}" }
    outputs:
      advanced: "{{ response.advanced }}"
      consumer: "{{ response.consumer }}"
      cursor: "{{ response.cursor }}"
      acknowledged_at: "{{ response.acknowledged_at }}"
    sample: { advanced: true, consumer: "scheduled-lambda", cursor: "eyJ2IjoxLCJ3IjoiLi4uIn0.signature", acknowledged_at: "2026-08-07T14:25:00Z" }

  - name: list-feed-consumers
    description: "The consumers of a feed, each with when it last acknowledged, about how far behind it is, and whether it is active, idle or expired."
    premium: true
    arguments:
      - { name: feed_id, type: text, required: true, description: "The UUID of the feed, which belongs to the workspace of the key" }
    request:
      method: GET
      path: "/v3/feeds/{{ args.feed_id }}/consumers"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      consumers: "{{ response.consumers }}"
      names: "{{ response.consumers | pluck('name') }}"
      oldest_available_at: "{{ response.retention.oldest_available_at }}"

  - name: create-feed-consumer
    description: "Create a consumer of a feed: a place in the feed GreyNoise keeps under a name, starting at the oldest event it still has. A feed has 25 consumers at most."
    premium: true
    changes_outside: true
    arguments:
      - { name: feed_id, type: text, required: true, description: "The UUID of the feed, which belongs to the workspace of the key" }
      - { name: consumer, type: text, required: true, description: "The name: it starts with a letter or a digit and holds only letters, digits, . _ and -" }
    request:
      method: POST
      path: "/v3/feeds/{{ args.feed_id }}/consumers"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        consumer: "{{ args.consumer }}"
    error: { message: "{{ response.message }}" }
    outputs:
      name: "{{ response.name }}"
      status: "{{ response.status }}"
      has_acknowledged: "{{ response.has_acknowledged }}"
      acknowledged_at: "{{ response.acknowledged_at }}"
      approximate_lag: "{{ response.approximate_lag }}"
      updated_at: "{{ response.updated_at }}"
    sample: { name: "scheduled-lambda", status: "active", has_acknowledged: false, acknowledged_at: null, approximate_lag: 12, updated_at: "2026-08-07T14:21:18Z" }

  - name: reset-feed-consumer
    description: "Send a consumer back to the oldest event the feed still has: the next fetch gives again events it already had."
    premium: true
    changes_outside: true
    arguments:
      - { name: feed_id, type: text, required: true, description: "The UUID of the feed, which belongs to the workspace of the key" }
      - { name: consumer, type: text, required: true, description: "The name of the consumer" }
    request:
      method: POST
      path: "/v3/feeds/{{ args.feed_id }}/consumers/{{ args.consumer }}/reset"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      name: "{{ response.name }}"
      status: "{{ response.status }}"
      has_acknowledged: "{{ response.has_acknowledged }}"
      acknowledged_at: "{{ response.acknowledged_at }}"
      approximate_lag: "{{ response.approximate_lag }}"
      updated_at: "{{ response.updated_at }}"
    sample: { name: "scheduled-lambda", status: "active", has_acknowledged: false, acknowledged_at: null, approximate_lag: 12, updated_at: "2026-08-07T14:21:18Z" }

  - name: delete-feed-consumer
    description: "Delete a consumer of a feed."
    premium: true
    changes_outside: true
    arguments:
      - { name: feed_id, type: text, required: true, description: "The UUID of the feed, which belongs to the workspace of the key" }
      - { name: consumer, type: text, required: true, description: "The name of the consumer" }
    request:
      method: DELETE
      path: "/v3/feeds/{{ args.feed_id }}/consumers/{{ args.consumer }}"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    success: { status: 204 }
    error: { message: "{{ response.message }}" }
    outputs:
      deleted: "{{ status | map('204', true, else=false) }}"
    sample: { deleted: true }

  - name: list-articles
    description: "The Threat Briefs GreyNoise published, newest first. One page at a time."
    premium: true
    arguments:
      - { name: search, type: text, description: "Only the articles whose title, subtitle or description holds this text" }
      - { name: category, type: text, description: "Only the articles of this category, by its value as list-article-categories gives it" }
      - { name: page, type: number, description: "The page, counted from 1: 1 when left out" }
      - { name: size, type: number, description: "How many articles a page" }
      - { name: sort_by, type: text, description: "The field the articles are ordered by: published_at when left out" }
      - { name: sort_desc, type: choice, choices: ["true", "false"], description: "Newest first (true, the default) or oldest first (false)" }
    request:
      method: GET
      path: "/v3/articles"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        search: "{{ args.search }}"
        category: "{{ args.category }}"
        page: "{{ args.page }}"
        size: "{{ args.size }}"
        sort_by: "{{ args.sort_by }}"
        sort_desc: "{{ args.sort_desc }}"
    error: { message: "{{ response.message }}" }
    outputs:
      articles: "{{ response.data }}"
      titles: "{{ response.data | pluck('title') }}"
      ids: "{{ response.data | pluck('id') }}"
      total: "{{ response.metadata.total_results }}"
      page: "{{ response.metadata.current_page }}"

  - name: list-article-categories
    description: "The categories of Threat Briefs."
    premium: true
    arguments: []
    request:
      method: GET
      path: "/v3/articles/categories"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      categories: "{{ response }}"
      values: "{{ response | pluck('value') }}"

  - name: get-article
    description: "One Threat Brief by its id."
    premium: true
    arguments:
      - { name: id, type: text, required: true, description: "The UUID of the article, as list-articles gives it" }
    request:
      method: GET
      path: "/v3/articles/{{ args.id }}"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      title: "{{ response.title }}"
      subtitle: "{{ response.subtitle }}"
      description: "{{ response.description }}"
      category: "{{ response.category.value }}"
      author: "{{ response.author }}"
      link: "{{ response.link }}"
      published_at: "{{ response.published_at }}"
      article: "{{ response }}"

  - name: get-rss-feed-url
    description: "The address of the private RSS feed of Threat Briefs of the workspace (made at the first request) and of the public one. The private address is itself the credential: whoever has it reads the feed."
    premium: true
    arguments: []
    request:
      method: GET
      path: "/v3/articles/rss-token"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      feed_url: "{{ response.feed_url }}"
      public_feed_url: "{{ response.public_feed_url }}"

  - name: generate-rss-feed-url
    description: "Replace the private RSS feed address of the workspace by a new one: the old address stops working. For an address that leaked."
    premium: true
    changes_outside: true
    idempotent: false
    arguments: []
    request:
      method: POST
      path: "/v3/articles/rss-token"
      headers: { key: "{{ secret.api_key | default(null) }}" }
    error: { message: "{{ response.message }}" }
    outputs:
      feed_url: "{{ response.feed_url }}"
      public_feed_url: "{{ response.public_feed_url }}"
    sample: { feed_url: "https://api.greynoise.io/v3/articles/rss/EXAMPLE-FEED-TOKEN", public_feed_url: "https://api.greynoise.io/v3/articles/rss" }

  - name: get-public-rss-feed
    description: "The public RSS feed of the Threat Briefs of the community category, as XML text. It needs no key."
    arguments: []
    request:
      method: GET
      path: "/v3/articles/rss"
      answer: text
    error: { message: "{{ response.message }}" }
    outputs:
      xml: "{{ response.text }}"

  - name: search-tactics-detections
    description: "The Tactics detections of a workspace: the attacker sessions seen on your sensors that match a MITRE ATT&CK technique, each with its commands, techniques, tactics and files. Read page by page (500 at most)."
    premium: true
    arguments:
      - { name: workspace_id, type: text, required: true, description: "The UUID of the workspace: in the GreyNoise Visualizer, the user menu, Plan details, under the name of the workspace" }
      - { name: start_time, type: text, description: "Only detections active at or after this time, as an ISO 8601 date. Without it the whole history is searched: give one" }
      - { name: end_time, type: text, description: "Only detections active at or before this time: now when left out" }
      - { name: sensor_id, type: text, description: "Only detections seen on the sensor of this UUID" }
      - { name: profile_id, type: text, description: "Only detections seen on the profile of this UUID" }
      - { name: profile_instance_id, type: text, description: "Only detections seen on the profile instance of this UUID" }
      - { name: rules, type: list, description: "Only detections that set off one of these sensor rules: command_run, internet_access" }
      - { name: techniques, type: list, description: "Only detections with one of these ATT&CK techniques: T1082, T1059.004. Either a technique or a tactic has to match" }
      - { name: tactics, type: list, description: "Only detections with one of these ATT&CK tactics: TA0007, TA0002. Either a technique or a tactic has to match" }
      - { name: process_name, type: text, description: "Only detections where a process of this name ran: curl" }
      - { name: process_parent, type: text, description: "Only detections where the parent of a process had this name: bash" }
      - { name: process_grandparent, type: text, description: "Only detections where the grandparent of a process had this name" }
      - { name: process_great_grandparent, type: text, description: "Only detections where the great-grandparent of a process had this name" }
      - { name: any_process, type: text, description: "Only detections where this name is a process or any of its three ancestors: wget" }
      - { name: ip, type: text, description: "Only detections whose session reached this IPv4 address" }
      - { name: exclude_non_interactive, type: bool, description: "Only the sessions that have a shell among their ancestors" }
    request:
      method: POST
      path: "/v3/workspaces/{{ args.workspace_id }}/tactics"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        exclude_non_interactive: "{{ args.exclude_non_interactive | map('true', 'true', 'false', 'false') }}"
      json:
        start_time: "{{ args.start_time }}"
        end_time: "{{ args.end_time }}"
        sensor_id: "{{ args.sensor_id }}"
        profile_id: "{{ args.profile_id }}"
        profile_instance_id: "{{ args.profile_instance_id }}"
        rules: "{{ args.rules }}"
        techniques: "{{ args.techniques }}"
        tactics: "{{ args.tactics }}"
        process_name: "{{ args.process_name }}"
        process_parent: "{{ args.process_parent }}"
        process_grandparent: "{{ args.process_grandparent }}"
        process_great_grandparent: "{{ args.process_great_grandparent }}"
        any_process: "{{ args.any_process }}"
        ip: "{{ args.ip }}"
    pagination:
      type: cursor
      param: cursor
      next: "{{ response.next_cursor }}"
      limit_param: page_size
      limit: 100
      items: "{{ response.sessions }}"
      max_pages: 5
    error: { message: "{{ response.message }}" }
    outputs:
      detections: "{{ response.items }}"
      ids: "{{ response.items | pluck('session_id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"

  - name: get-tactics-detection
    description: "One Tactics detection: its commands in order with the techniques of each, the paths of the files it touched, and the addresses it reached. Commands and files come 500 a page, each with its own page number."
    premium: true
    arguments:
      - { name: workspace_id, type: text, required: true, description: "The UUID of the workspace: in the GreyNoise Visualizer, the user menu, Plan details, under the name of the workspace" }
      - { name: detection_id, type: text, required: true, description: "The id of the detection: the session_id that search-tactics-detections gives" }
      - { name: commands_page, type: number, description: "The page of the commands, counted from 1" }
      - { name: artifacts_page, type: number, description: "The page of the file paths, counted from 1" }
    request:
      method: GET
      path: "/v3/workspaces/{{ args.workspace_id }}/tactics/{{ args.detection_id }}"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        commands_page: "{{ args.commands_page }}"
        artifacts_page: "{{ args.artifacts_page }}"
    error: { message: "{{ response.message }}" }
    outputs:
      session_id: "{{ response.session_id }}"
      start_time: "{{ response.start_time }}"
      end_time: "{{ response.end_time }}"
      techniques: "{{ response.techniques }}"
      tactics: "{{ response.tactics }}"
      rules: "{{ response.rules }}"
      commands: "{{ response.commands }}"
      command_events: "{{ response.command_events }}"
      commands_has_more: "{{ response.commands_has_more }}"
      artifacts: "{{ response.artifacts }}"
      artifacts_has_more: "{{ response.artifacts_has_more }}"
      dest_ips: "{{ response.dest_ips }}"
      interactive: "{{ response.interactive }}"

  - name: list-tactics-destination-ips
    description: "The addresses the session of a Tactics detection reached, read page by page (5 000 at most): those on the internet, and those of private networks when asked."
    premium: true
    arguments:
      - { name: workspace_id, type: text, required: true, description: "The UUID of the workspace: in the GreyNoise Visualizer, the user menu, Plan details, under the name of the workspace" }
      - { name: detection_id, type: text, required: true, description: "The id of the detection: the session_id that search-tactics-detections gives" }
      - { name: include_lateral, type: bool, description: "Also the private (RFC 1918) and loopback addresses" }
    request:
      method: GET
      path: "/v3/workspaces/{{ args.workspace_id }}/tactics/{{ args.detection_id }}/dest-ips"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        include_lateral: "{{ args.include_lateral | map('true', 'true', 'false', 'false') }}"
    pagination:
      type: page
      param: page
      limit_param: page_size
      limit: 1000
      items: "{{ response.ips }}"
      max_pages: 5
    error: { message: "{{ response.message }}" }
    outputs:
      ips: "{{ response.items }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"

  - name: list-tactics-files
    description: "The files seen during the session of a Tactics detection, each with its path, size, type and hashes; never their content."
    premium: true
    arguments:
      - { name: workspace_id, type: text, required: true, description: "The UUID of the workspace: in the GreyNoise Visualizer, the user menu, Plan details, under the name of the workspace" }
      - { name: detection_id, type: text, required: true, description: "The id of the detection: the session_id that search-tactics-detections gives" }
      - { name: mutations_only, type: bool, description: "Only the files the session created or changed" }
    request:
      method: POST
      path: "/v3/workspaces/{{ args.workspace_id }}/tactics/{{ args.detection_id }}/files"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      query:
        mutations_only: "{{ args.mutations_only | map('true', 'true', 'false', 'false') }}"
    error: { message: "{{ response.message }}" }
    outputs:
      files: "{{ response }}"
      paths: "{{ response | pluck('path') }}"
      sha256: "{{ response | pluck('sha256_hash') }}"

  - name: get-host-artifact-content
    description: "The content of a file seen on one of your sensors, by its path, as it was last seen: in the answer as base64 when it is small, as a download address that soon expires when it is large. Needs the Tactics file-content entitlement."
    premium: true
    arguments:
      - { name: workspace_id, type: text, required: true, description: "The UUID of the workspace: in the GreyNoise Visualizer, the user menu, Plan details, under the name of the workspace" }
      - { name: path, type: text, required: true, description: "The full path of the file on the sensor: /tmp/.x/miner" }
    request:
      method: POST
      path: "/v3/workspaces/{{ args.workspace_id }}/host-artifact/content"
      headers: { key: "{{ secret.api_key | default(null) }}" }
      json:
        path: "{{ args.path }}"
    error: { message: "{{ response.message }}" }
    outputs:
      type: "{{ response.type }}"
      contents: "{{ response.contents }}"
      url: "{{ response.url }}"
      expires_at: "{{ response.expires_at }}"
      path: "{{ response.path }}"
      sha256: "{{ response.sha256_hash }}"
      file_size: "{{ response.file_size }}"
