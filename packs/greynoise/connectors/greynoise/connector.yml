      name: "{{ response.name }}"
      query: "{{ response.query }}"
      enabled: "{{ response.enabled }}"
      ip_limit: "{{ response.ip_limit }}"
      last_ip_count: "{{ response.last_ip_count }}"
      created_at: "{{ response.created_at }}"
      updated_at: "{{ response.updated_at }}"

  - name: delete-blocklist
    description: "Delete a blocklist."
    premium: true
    changes_outside: true
    arguments:
      - { name: workspace_id, type: text, required: true, description: "The UUID of the workspace: in the GreyNoise Visualizer, the user menu, Plan details, under the name of the workspace" }
      - { name: blocklist_id, type: text, required: true, description: "The UUID of the blocklist" }
