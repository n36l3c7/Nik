  - name: scan-private-file
    description: "Send a file Nik holds to be analysed privately: it does not join VirusTotal's dataset. Gives the id of the private analysis, to read with get-private-analysis or wait-for-private-analysis. One larger than 32 MB goes to an address get-private-file-upload-url gives."
    premium: true
    changes_outside: true
    idempotent: false
    arguments:
      - { name: sample, type: file, required: true, description: "The file: an artifact of Nik (file-<sha256>) or the SHA-256 of a file Nik holds" }
      - { name: password, description: "The password, when the file is a protected ZIP that holds the one file to scan" }
      - { name: disable_sandbox, type: choice, choices: ["true", "false"], description: "true: do not run the file in sandboxes" }
      - { name: enable_internet, type: choice, choices: ["true", "false"], description: "true: let the file reach the internet when it runs" }
      - name: intercept_tls
        type: choice
        choices: ["true", "false"]
        description: "true: intercept HTTPS to see encrypted URLs, host names and headers (a sample that checks certificates can tell)"
      - { name: command_line, description: "Command line arguments to run the file with" }
      - name: retention_period_days
        type: number
        description: "Days the report and the file are kept: 1 to 28 (the setting of the group when empty, 1 day unless changed)"
      - { name: storage_region, type: choice, choices: [US, EU], description: "Where it is stored (the setting of the group when empty)" }
      - { name: interaction_sandbox, description: "The sandbox to use interactively" }
      - { name: interaction_timeout, type: number, description: "Seconds of interaction: 60 to 1800" }
      - name: locale
        type: choice
        choices: [EN_US, AR_SA, DE_DE, ES_ES, PT_BR]
        description: "The locale of the sandbox: on Windows, the language and the keyboard of the machine (EN_US when empty)"
      - { name: upload_url, description: "For a file larger than 32 MB: the address get-private-file-upload-url gave, good for one upload" }
    request:
      method: POST
      path: "{{ first_of(args.upload_url, '/private/files') }}"
      multipart:
        password: "{{ args.password }}"
        disable_sandbox: "{{ args.disable_sandbox }}"
        enable_internet: "{{ args.enable_internet }}"
        intercept_tls: "{{ args.intercept_tls }}"
        command_line: "{{ args.command_line }}"
        retention_period_days: "{{ args.retention_period_days }}"
        storage_region: "{{ args.storage_region }}"
        interaction_sandbox: "{{ args.interaction_sandbox }}"
        interaction_timeout: "{{ args.interaction_timeout }}"
        locale: "{{ args.locale }}"
      files:
        file: { artifact: "{{ args.sample }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      analysis_id: "{{ response.data.id }}"
      type: "{{ response.data.type }}"
    sample:
      analysis_id: "OTFiMDcwMjVjZDIzZTI0NGU4ZDlmMjI2NjkzZDczNGE6MTY1MzY1NDM3Nw=="
      type: analysis
    timeout: 300

