  - name: upload-monitor-file
    description: "Put a file Nik holds in your Monitor collection, or overwrite one that is there. Give the path it goes to, or the id of the Monitor item to overwrite. One larger than 32 MB goes to an address get-monitor-upload-url gives."
    premium: true
