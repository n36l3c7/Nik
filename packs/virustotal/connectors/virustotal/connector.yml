  - name: create-retrohunt-job
    description: "Run YARA rules over the files VirusTotal received in the past months. Ten jobs at a time, 300 rules a job at most."
    premium: true
    changes_outside: true
    idempotent: false
    arguments:
      - { name: rules, required: true, description: "The YARA rules, as text" }
      - { name: notification_email, description: "An address to tell when the job is finished" }
      - name: corpus
        type: choice
        choices: [main, goodware]
        description: "main (what VirusTotal received) or goodware (known good files, to look for false positives)"
      - { name: time_range, type: object, description: "Only files sent between two moments, as Unix times: { start: 1545145761, end: 1547737720 }" }
    request:
      method: POST
      path: "/intelligence/retrohunt_jobs"
      json:
        data:
          type: retrohunt_job
          attributes:
            rules: "{{ args.rules }}"
            notification_email: "{{ args.notification_email }}"
            corpus: "{{ args.corpus }}"
            time_range: "{{ args.time_range }}"
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      status: "{{ response.data.attributes.status }}"
      progress: "{{ response.data.attributes.progress }}"
      num_matches: "{{ response.data.attributes.num_matches }}"
      attributes: "{{ response.data.attributes }}"
    sample:
      id: gilfoyle-1545145761
      status: starting
      progress: 0
      num_matches: 3
      attributes:
        corpus: main
        creation_date: 1545145761
        num_matches: 3
        progress: 0
        rules: "rule foobar { strings: $ = \"foobar\" condition: all of them }"
        scanned_bytes: 4096
        status: starting

  - name: get-retrohunt-job
    description: "A Retrohunt job as it is now: its status, its progress, how many files matched."
    premium: true
    arguments:
      - { name: id, required: true, description: "The id of the job" }
    request:
      method: GET
      path: "/intelligence/retrohunt_jobs/{{ args.id }}"
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      status: "{{ response.data.attributes.status }}"
      progress: "{{ response.data.attributes.progress }}"
      num_matches: "{{ response.data.attributes.num_matches }}"
      attributes: "{{ response.data.attributes }}"

  - name: wait-for-retrohunt-job
    description: "Wait until a Retrohunt job is finished (it fails when the job was aborted)."
    premium: true
    arguments:
      - { name: id, required: true, description: "The id of the job" }
    request:
      method: GET
      path: "/intelligence/retrohunt_jobs/{{ args.id }}"
    poll:
      until:
        all:
          - { left: "{{ response.data.attributes.status }}", op: eq, right: finished }
      fail_when:
        any:
          - { left: "{{ response.data.attributes.status }}", op: in, right: [aborting, aborted] }
      every: 60
      timeout: 3600
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      status: "{{ response.data.attributes.status }}"
      progress: "{{ response.data.attributes.progress }}"
      num_matches: "{{ response.data.attributes.num_matches }}"
      attributes: "{{ response.data.attributes }}"

