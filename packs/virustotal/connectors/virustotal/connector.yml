  - name: get-user
    description: "A user: the profile, and for yourself or as an administrator of the group, the privileges and the quotas with what is used of them."
    arguments:
      - name: id
        required: true
        description: "The user name. The API also takes an API key here, but it would then be written in the address of the request"
    request: { method: GET, path: "/users/{{ args.id }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      attributes: "{{ response.data.attributes }}"
      quotas: "{{ response.data.attributes.quotas }}"
      privileges: "{{ response.data.attributes.privileges }}"

  - name: update-user
    description: "Change attributes of a user: what is not given stays as it is."
    changes_outside: true
    idempotent: true
    arguments:
      - name: id
        required: true
        description: "The user name. The API also takes an API key here, but it would then be written in the address of the request"
      - name: attributes
        type: object
        required: true
        description: "The attributes to change, for instance { first_name: …, last_name: …, profile_phrase: … }"
    request:
      method: PATCH
      path: "/users/{{ args.id }}"
      json:
        data: { type: user, attributes: "{{ args.attributes }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      type: "{{ response.data.type }}"
      attributes: "{{ response.data.attributes }}"
    sample:
      id: gilfoyle
      type: user
      attributes:
        first_name: Bertram
        last_name: Gilfoyle
        profile_phrase: ""
        reputation: 1
        status: active
        user_since: 1530008602

  - name: delete-user
    description: "Delete a user account. Only its owner can, and the password of the account is asked as a confirmation."
    changes_outside: true
    idempotent: true
    arguments:
      - name: id
        required: true
        description: "The user name. The API also takes an API key here, but it would then be written in the address of the request"
      - { name: password, required: true, description: "The password of the account, sent as the confirmation the API asks for" }
    request:
      method: DELETE
      path: "/users/{{ args.id }}"
      headers: { x-user-password: "{{ args.password }}" }
    error: { message: "{{ response.error.message }}" }
    outputs: { status: "{{ status }}" }
    sample: { status: 200 }

  - name: list-user-related-objects
    description: "The objects related to a user through one relationship, with all their attributes."
    arguments:
      - name: id
        required: true
        description: "The user name. The API also takes an API key here, but it would then be written in the address of the request"
      - name: relationship
        type: choice
        choices:
          - api_quota_group
          - comments
          - graphs
          - groups
          - hunting_notifications
          - hunting_notification_files
          - hunting_rulesets
          - intelligence_quota_group
          - mentions
          - retrohunt_jobs
          - votes
          - collections
        required: true
        description: "The relationship. Some are given to the owner of the account or to the administrators of the group only"
    request:
      method: GET
      path: "/users/{{ args.id }}/{{ args.relationship }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: 10
      items: "{{ response.data | where('id') }}"
      next: "{{ response.meta.cursor }}"
      max_pages: 5
      keep: { total: "{{ response.meta.count }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: list-user-related-descriptors
    description: "The objects related to a user through one relationship, as descriptors: type and id only."
    arguments:
      - name: id
        required: true
        description: "The user name. The API also takes an API key here, but it would then be written in the address of the request"
      - name: relationship
        type: choice
        choices:
          - api_quota_group
          - comments
          - graphs
          - groups
          - hunting_notifications
          - hunting_notification_files
          - hunting_rulesets
          - intelligence_quota_group
          - mentions
          - retrohunt_jobs
          - votes
          - collections
        required: true
        description: "The relationship. Some are given to the owner of the account or to the administrators of the group only"
    request:
      method: GET
      path: "/users/{{ args.id }}/relationships/{{ args.relationship }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: 10
      items: "{{ response.data | where('id') }}"
      next: "{{ response.meta.cursor }}"
      max_pages: 5
      keep: { total: "{{ response.meta.count }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: get-user-api-usage
    description: "How many API requests a user made, by day and by endpoint (the last 30 days when no dates are given)."
    arguments:
      - name: id
        required: true
        description: "The user name. The API also takes an API key here, but it would then be written in the address of the request"
      - { name: start_date, description: "The first day, as YYYYMMDD (30 days at most, within the last 60)" }
      - { name: end_date, description: "The last day, as YYYYMMDD" }
    request:
      method: GET
      path: "/users/{{ args.id }}/api_usage"
      query:
        start_date: "{{ args.start_date }}"
        end_date: "{{ args.end_date }}"
    error: { message: "{{ response.error.message }}" }
    outputs:
      daily: "{{ response.data.daily }}"
      total: "{{ response.data.total }}"

