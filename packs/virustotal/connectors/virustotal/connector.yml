      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: create-private-zip-file
    description: "Ask VirusTotal to build a ZIP of private files, with a password if you give one; it is not ready at once."
    premium: true
    changes_outside: true
    idempotent: false
    arguments:
      - { name: hashes, type: list, required: true, description: "The files to put in the ZIP: SHA-256, SHA-1 or MD5" }
      - { name: password, description: "A password to protect the ZIP with" }
    request:
      method: POST
      path: "/private/zip_files"
      json:
        data: { password: "{{ args.password }}", hashes: "{{ args.hashes }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      status: "{{ response.data.attributes.status }}"
      progress: "{{ response.data.attributes.progress }}"
      files_ok: "{{ response.data.attributes.files_ok }}"
      files_error: "{{ response.data.attributes.files_error }}"
    sample:
      id: "4939392292"
      status: starting
      progress: 0
      files_ok: 0
      files_error: 0

  - name: get-private-zip-file
    description: "A ZIP file as it is now: starting, creating, finished, or an error."
    premium: true
    arguments:
      - { name: id, required: true, description: "The id of the ZIP file" }
    request: { method: GET, path: "/private/zip_files/{{ args.id }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      status: "{{ response.data.attributes.status }}"
      progress: "{{ response.data.attributes.progress }}"
      files_ok: "{{ response.data.attributes.files_ok }}"
      files_error: "{{ response.data.attributes.files_error }}"

  - name: wait-for-private-zip-file
    description: "Wait until a ZIP file is finished and can be downloaded."
    premium: true
    arguments:
      - { name: id, required: true, description: "The id of the ZIP file" }
    request: { method: GET, path: "/private/zip_files/{{ args.id }}" }
    poll:
      until:
        all:
          - { left: "{{ response.data.attributes.status }}", op: eq, right: finished }
      fail_when:
        any:
          - left: "{{ response.data.attributes.status }}"
            op: in
            right: [timeout, error-starting, error-creating]
      every: 10
      timeout: 900
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      status: "{{ response.data.attributes.status }}"
      progress: "{{ response.data.attributes.progress }}"
      files_ok: "{{ response.data.attributes.files_ok }}"
      files_error: "{{ response.data.attributes.files_error }}"

