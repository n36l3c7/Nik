  - name: wait-for-analysis
    description: "Wait until an analysis is completed, then give what the engines said."
    arguments:
      - { name: id, required: true, description: "The id of the analysis, as a scan or a rescan gave it" }
    request: { method: GET, path: "/analyses/{{ args.id }}" }
    poll:
      until:
        all:
          - { left: "{{ response.data.attributes.status }}", op: eq, right: completed }
      every: 20
      timeout: 900
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      status: "{{ response.data.attributes.status }}"
      stats: "{{ response.data.attributes.stats }}"
