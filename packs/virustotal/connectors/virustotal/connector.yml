  - name: update-group-user-roles
    description: "Change the roles and the daily API allowance of users of a group. Each item is a user descriptor with context_attributes: roles, add_roles or remove_roles (USER_ROLE_GROUP_ADMIN, USER_ROLE_PRIVATE_SCANNING), quota_limits.api_requests_daily.allowed."
    premium: true
