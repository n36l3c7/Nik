        description: "The users, as [{ type: user, id: …, context_attributes: { add_roles: [USER_ROLE_PRIVATE_SCANNING] } }]"
    request:
      method: PATCH
      path: "/groups/{{ args.id }}/relationships/users"
      json: { data: "{{ args.users }}" }
