  - name: wait-for-zip-file
    description: "Wait until a ZIP file is finished and can be downloaded."
    premium: true
    arguments:
      - { name: id, required: true, description: "The id of the ZIP file" }
    request: { method: GET, path: "/intelligence/zip_files/{{ args.id }}" }
    poll:
      until:
        all:
          - { left: "{{ response.data.attributes.status }}", op: eq, right: finished }
      fail_when:
        any:
          - left: "{{ response.data.attributes.status }}"
            op: in
            right: [timeout, error-starting, error-creating]
      every: 10
      timeout: 900
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      status: "{{ response.data.attributes.status }}"
      progress: "{{ response.data.attributes.progress }}"
      files_ok: "{{ response.data.attributes.files_ok }}"
