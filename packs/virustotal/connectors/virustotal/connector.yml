    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      type: "{{ response.data.type }}"
      attributes: "{{ response.data.attributes }}"
    sample:
      id: f-275a021bbfb6489e54d471899f7db9d1663fc695ec2fe2a2c4538aabf651fd0f-4944a424
      type: comment
      attributes:
        date: 1597349426
        html: "Lorem #ipsum dolor sit ..."
        tags: [ipsum]
        text: "Lorem #ipsum dolor sit ..."
        votes: { abuse: 0, negative: 0, positive: 0 }

  - name: list-domain-related-objects
    description: "The objects related to a domain through one relationship, with all their attributes."
    arguments:
      - { name: domain, required: true, description: "The domain name" }
