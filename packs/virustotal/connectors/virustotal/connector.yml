# VirusTotal, through its API v3 (https://www.virustotal.com/api/v3).
#
# Written from VirusTotal's API reference, https://docs.virustotal.com/reference/overview,
# endpoint by endpoint, as it read in November 2026. Not run against the
# real service: see "verified" below.
#
# The key is the personal API key of a VirusTotal account (the user menu,
# "API key"), sent in the x-apikey header. A free key gives the public API:
# 500 requests a day, 4 a minute, and not for commercial products. The
# commands marked "premium" are those the reference gives to paying users
# only (VirusTotal Enterprise, Livehunt, Retrohunt, private scanning, feeds,
# VT Monitor, group administration): the API refuses a key that
# lacks the privilege.
#
# Verdicts are derived as Nik's own enrichment does: 3 engines or more that
# say malicious make it malicious; fewer, or any that says suspicious, make
# it suspicious; otherwise harmless when an engine says so, unknown when
# VirusTotal does not have the indicator.
#
# The objects related to a file, a URL, a domain… are read by one command
# for each kind of object, which takes the name of the relationship; a
# second one gives the descriptors (type and id) only. Lists are read page
# by page with VirusTotal's cursor: each page is one request of the quota.
#
# A command that sends a file (scan-file, scan-private-file,
# upload-monitor-file) takes it from Nik's store; one that downloads
# (download-…) keeps what comes as an artifact, never opened. VirusTotal
# answers most downloads with a redirect to a signed address: the one host
# its reference names for that is listed in more_hosts, and the key of the
# instance never goes there.
#
# What is not here: granting view or edit rights on a graph. The README says
# why.
name: VirusTotal
id: virustotal
version: 3
description: "Files, URLs, domains and IP addresses in VirusTotal: reports with a verdict, relationships, comments, votes, behaviour, search, and the premium services (Intelligence, Livehunt, Retrohunt, private scanning, Monitor)."
api_version: "VirusTotal API v3"
verified: false
# Among the sources of an indicator's reputation: how much the verdict counts in the overall one (1 to 3).
lookups: { weight: 3 }
configuration:
  - name: credentials
    label: "API key"
    type: header
    header: x-apikey
    help: "The API key of your VirusTotal account: the user menu, API key."
base_url: "https://www.virustotal.com/api/v3"
headers: { Accept: application/json }
# Where the reference shows a signed download address to be (GET /files/{id}/download_url).
more_hosts: [vtsamples.commondatastorage.googleapis.com]
test:
  request: { method: GET, path: "/popular_threat_categories" }
commands:
  - name: get-ip-report
    description: "What VirusTotal knows of an IP address, with a verdict from what the engines say."
    reputation: ip
    arguments:
      - { name: ip, required: true, description: "The IP address" }
    request: { method: GET, path: "/ip_addresses/{{ args.ip }}" }
    success:
      status: [200, 404]
    error: { message: "{{ response.error.message }}" }
    outputs:
      # The rule of Nik's own look-up: 3 engines or more that say malicious make it malicious; 1 or 2,
      # or any that says suspicious, make it suspicious; otherwise harmless when an engine says so.
      # An indicator VirusTotal does not have (404) has no counts: unknown.
      verdict: >-
        {{ if(first_of(response.data.attributes.last_analysis_stats.malicious, 0) >= 3, 'malicious',
        if(first_of(response.data.attributes.last_analysis_stats.malicious, 0) >= 1 or first_of(response.data.attributes.last_analysis_stats.suspicious, 0) >= 1, 'suspicious',
        if(first_of(response.data.attributes.last_analysis_stats.harmless, 0) >= 1, 'harmless', 'unknown'))) }}
      summary: >-
        {{ if(response.data,
        first_of(response.data.attributes.last_analysis_stats.malicious, 0) ~ '/' ~ if(response.data.attributes.last_analysis_stats, response.data.attributes.last_analysis_stats | values | sum, 0) ~ ' engines flag it'
        ~ if(first_of(response.data.attributes.last_analysis_stats.suspicious, 0) >= 1, ', ' ~ response.data.attributes.last_analysis_stats.suspicious ~ ' suspicious', ''),
        'not in VirusTotal') }}
      malicious: "{{ response.data.attributes.last_analysis_stats.malicious | default(0) }}"
      suspicious: "{{ response.data.attributes.last_analysis_stats.suspicious | default(0) }}"
      harmless: "{{ response.data.attributes.last_analysis_stats.harmless | default(0) }}"
      undetected: "{{ response.data.attributes.last_analysis_stats.undetected | default(0) }}"
      total: "{{ if(response.data.attributes.last_analysis_stats, response.data.attributes.last_analysis_stats | values | sum, 0) }}"
      stats: "{{ response.data.attributes.last_analysis_stats }}"
      # The engines that flag it, those that say malicious first, each group by name.
      engines: >-
        {{ response.data.attributes.last_analysis_results | default([]) | entries | sort_by('key')
        | where('value.category', 'in', ['malicious', 'suspicious'])
        | pick(engine='key', category='value.category', result='value.result') | sort_by('category') }}
      # Every engine: those above first, then the others by name.
      all_engines: >-
        {{ response.data.attributes.last_analysis_results | default([]) | entries | sort_by('key')
        | where('value.category', 'in', ['malicious', 'suspicious'])
        | pick(engine='key', category='value.category', result='value.result') | sort_by('category')
        | union(response.data.attributes.last_analysis_results | default([]) | entries | sort_by('key') | pick(engine='key', category='value.category', result='value.result')) }}
      reputation: "{{ response.data.attributes.reputation }}"
      last_analysis: "{{ if(response.data.attributes.last_analysis_date, response.data.attributes.last_analysis_date * 1000) }}"
      tags: "{{ response.data.attributes.tags | default([]) | limit(12) }}"
      country: "{{ response.data.attributes.country }}"
      asn: "{{ response.data.attributes.asn }}"
      owner: "{{ response.data.attributes.as_owner }}"
      network: "{{ response.data.attributes.network }}"
      id: "{{ response.data.id }}"
      attributes: "{{ response.data.attributes }}"
      link: "https://www.virustotal.com/gui/ip-address/{{ first_of(response.data.id, args.ip) }}"

  - name: rescan-ip
    description: "Ask VirusTotal to analyse an IP address again; gives the id of the analysis."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: ip, required: true, description: "The IP address" }
    request: { method: POST, path: "/ip_addresses/{{ args.ip }}/analyse" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      analysis_id: "{{ response.data.id }}"
      type: "{{ response.data.type }}"
    sample:
      analysis_id: i-f41d931c01fcee6c19e73200aa87ea5d8a8de5316c5288a8df869d31efa1d0fc-1715609875
      type: analysis

  - name: list-ip-comments
    description: "The comments the community wrote on an IP address."
    arguments:
      - { name: ip, required: true, description: "The IP address" }
    request: { method: GET, path: "/ip_addresses/{{ args.ip }}/comments" }
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: 10
      items: "{{ response.data }}"
      next: "{{ response.meta.cursor }}"
      max_pages: 5
      keep: { total: "{{ response.meta.count }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: add-ip-comment
    description: "Write a comment on an IP address."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: ip, required: true, description: "The IP address" }
      - { name: text, required: true, description: "The comment. A word that starts with # becomes a tag of the comment" }
    request:
      method: POST
      path: "/ip_addresses/{{ args.ip }}/comments"
      json:
        data:
          type: comment
          attributes: { text: "{{ args.text }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      type: "{{ response.data.type }}"
      attributes: "{{ response.data.attributes }}"
    sample:
      id: f-275a021bbfb6489e54d471899f7db9d1663fc695ec2fe2a2c4538aabf651fd0f-4944a424
      type: comment
      attributes:
        date: 1597349426
        html: "Lorem #ipsum dolor sit ..."
        tags: [ipsum]
        text: "Lorem #ipsum dolor sit ..."
        votes: { abuse: 0, negative: 0, positive: 0 }

  - name: list-ip-related-objects
    description: "The objects related to an IP address through one relationship, with all their attributes."
    arguments:
      - { name: ip, required: true, description: "The IP address" }
      - name: relationship
        type: choice
        choices:
          - comments
          - communicating_files
          - downloaded_files
          - graphs
          - historical_ssl_certificates
          - historical_whois
          - related_comments
          - related_references
          - related_threat_actors
          - referrer_files
          - resolutions
          - urls
        required: true
        description: "The relationship. Some are given to VirusTotal Enterprise users only: see the README"
    request:
      method: GET
      path: "/ip_addresses/{{ args.ip }}/{{ args.relationship }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: 10
      items: "{{ response.data | where('id') }}"
      next: "{{ response.meta.cursor }}"
      max_pages: 5
      keep: { total: "{{ response.meta.count }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: list-ip-related-descriptors
    description: "The objects related to an IP address through one relationship, as descriptors: type and id only."
    arguments:
      - { name: ip, required: true, description: "The IP address" }
      - name: relationship
        type: choice
        choices:
          - comments
          - communicating_files
          - downloaded_files
          - graphs
          - historical_ssl_certificates
          - historical_whois
          - related_comments
          - related_references
          - related_threat_actors
          - referrer_files
          - resolutions
          - urls
        required: true
        description: "The relationship. Some are given to VirusTotal Enterprise users only: see the README"
    request:
      method: GET
      path: "/ip_addresses/{{ args.ip }}/relationships/{{ args.relationship }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: 10
      items: "{{ response.data | where('id') }}"
      next: "{{ response.meta.cursor }}"
      max_pages: 5
      keep: { total: "{{ response.meta.count }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: list-ip-votes
    description: "The votes the community gave an IP address."
    arguments:
      - { name: ip, required: true, description: "The IP address" }
    request: { method: GET, path: "/ip_addresses/{{ args.ip }}/votes" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.data }}"
      ids: "{{ response.data | pluck('id') }}"
      count: "{{ response.data | length }}"
      cursor: "{{ response.meta.cursor }}"

  - name: add-ip-vote
    description: "Vote an IP address harmless or malicious."
    changes_outside: true
    idempotent: true
    arguments:
      - { name: ip, required: true, description: "The IP address" }
      - { name: verdict, type: choice, choices: [harmless, malicious], required: true, description: "What you say of it" }
    request:
      method: POST
      path: "/ip_addresses/{{ args.ip }}/votes"
      json:
        data:
          type: vote
          attributes: { verdict: "{{ args.verdict }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      type: "{{ response.data.type }}"
      attributes: "{{ response.data.attributes }}"
    sample:
      id: f-275a021bbfb6489e54d471899f7db9d1663fc695ec2fe2a2c4538aabf651fd0f-e1b3a1a3
      type: vote
      attributes: { date: 1611677240, value: -1, verdict: malicious }

  - name: list-ip-technologies
    description: "The technologies internet scanning found on an IP address, with their ports and the vulnerabilities that affect them."
    premium: true
    arguments:
      - { name: ip, required: true, description: "The IP address" }
      - { name: filter, description: "Which rows: technology:nginx port:443 (modifiers: technology, version, port, cve)" }
      - { name: order, description: "technology, version, vulnerabilities_count or max_severity, followed by + or -" }
    request:
      method: GET
      path: "/ip_addresses/{{ args.ip }}/scanning_technologies"
      query: { filter: "{{ args.filter }}", order: "{{ args.order }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      technologies: "{{ response.data }}"
      count: "{{ response.data | length }}"

  - name: get-port-info
    description: "An open port of an IP address: the service and technologies seen on it."
    premium: true
    arguments:
      - { name: id, required: true, description: "The port of an entity, as entity:port: 1.2.3.4:443" }
    request: { method: GET, path: "/port_infos/{{ args.id }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      type: "{{ response.data.type }}"
      attributes: "{{ response.data.attributes }}"

  - name: list-port-info-related-objects
    description: "The objects related to a port through one relationship, with all their attributes."
    premium: true
    arguments:
      - { name: id, required: true, description: "The port of an entity, as entity:port: 1.2.3.4:443" }
      - name: relationship
        type: choice
        choices: [analysis]
        required: true
        description: "The relationship: analysis is the history of scans of the port"
    request:
      method: GET
      path: "/port_infos/{{ args.id }}/{{ args.relationship }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: 10
      items: "{{ response.data | where('id') }}"
      next: "{{ response.meta.cursor }}"
      max_pages: 5
      keep: { total: "{{ response.meta.count }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: list-port-info-related-descriptors
    description: "The objects related to a port through one relationship, as descriptors: type and id only."
    premium: true
    arguments:
      - { name: id, required: true, description: "The port of an entity, as entity:port: 1.2.3.4:443" }
      - name: relationship
        type: choice
        choices: [analysis]
        required: true
        description: "The relationship: analysis is the history of scans of the port"
    request:
      method: GET
      path: "/port_infos/{{ args.id }}/relationships/{{ args.relationship }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: 10
      items: "{{ response.data | where('id') }}"
      next: "{{ response.meta.cursor }}"
      max_pages: 5
      keep: { total: "{{ response.meta.count }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: get-port-analysis
    description: "One dated scan of a port."
    premium: true
    arguments:
      - { name: id, required: true, description: "The analysis of a port, as entity:port:timestamp: 1.2.3.4:443:1718534400" }
    request: { method: GET, path: "/port_analyses/{{ args.id }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      id: "{{ response.data.id }}"
      type: "{{ response.data.type }}"
      attributes: "{{ response.data.attributes }}"

  - name: list-port-analysis-related-objects
    description: "The objects related to the scan of a port through one relationship, with all their attributes."
    premium: true
    arguments:
      - { name: id, required: true, description: "The analysis of a port, as entity:port:timestamp: 1.2.3.4:443:1718534400" }
      - name: relationship
        type: choice
        choices: [vulnerabilities]
        required: true
        description: "The relationship: vulnerabilities needs a licence with vulnerability intelligence"
    request:
      method: GET
      path: "/port_analyses/{{ args.id }}/{{ args.relationship }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: 10
      items: "{{ response.data | where('id') }}"
      next: "{{ response.meta.cursor }}"
      max_pages: 5
      keep: { total: "{{ response.meta.count }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: list-port-analysis-related-descriptors
    description: "The objects related to the scan of a port through one relationship, as descriptors: type and id only."
    premium: true
    arguments:
      - { name: id, required: true, description: "The analysis of a port, as entity:port:timestamp: 1.2.3.4:443:1718534400" }
      - name: relationship
        type: choice
        choices: [vulnerabilities]
        required: true
        description: "The relationship: vulnerabilities needs a licence with vulnerability intelligence"
    request:
      method: GET
      path: "/port_analyses/{{ args.id }}/relationships/{{ args.relationship }}"
    pagination:
      type: cursor
      param: cursor
      limit_param: limit
      limit: 10
      items: "{{ response.data | where('id') }}"
      next: "{{ response.meta.cursor }}"
      max_pages: 5
      keep: { total: "{{ response.meta.count }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.items }}"
      ids: "{{ response.items | pluck('id') }}"
      count: "{{ response.items | length }}"
      truncated: "{{ response.truncated }}"
      total: "{{ response.kept.total }}"

  - name: get-domain-report
    description: "What VirusTotal knows of a domain, with a verdict from what the engines say."
    reputation: domain
    arguments:
      - { name: domain, required: true, description: "The domain name" }
    request: { method: GET, path: "/domains/{{ args.domain }}" }
    success:
      status: [200, 404]
    error: { message: "{{ response.error.message }}" }
    outputs:
      # The rule of Nik's own look-up: 3 engines or more that say malicious make it malicious; 1 or 2,
      # or any that says suspicious, make it suspicious; otherwise harmless when an engine says so.
      # An indicator VirusTotal does not have (404) has no counts: unknown.
      verdict: >-
        {{ if(first_of(response.data.attributes.last_analysis_stats.malicious, 0) >= 3, 'malicious',
        if(first_of(response.data.attributes.last_analysis_stats.malicious, 0) >= 1 or first_of(response.data.attributes.last_analysis_stats.suspicious, 0) >= 1, 'suspicious',
        if(first_of(response.data.attributes.last_analysis_stats.harmless, 0) >= 1, 'harmless', 'unknown'))) }}
      summary: >-
        {{ if(response.data,
        first_of(response.data.attributes.last_analysis_stats.malicious, 0) ~ '/' ~ if(response.data.attributes.last_analysis_stats, response.data.attributes.last_analysis_stats | values | sum, 0) ~ ' engines flag it'
        ~ if(first_of(response.data.attributes.last_analysis_stats.suspicious, 0) >= 1, ', ' ~ response.data.attributes.last_analysis_stats.suspicious ~ ' suspicious', ''),
        'not in VirusTotal') }}
      malicious: "{{ response.data.attributes.last_analysis_stats.malicious | default(0) }}"
      suspicious: "{{ response.data.attributes.last_analysis_stats.suspicious | default(0) }}"
      harmless: "{{ response.data.attributes.last_analysis_stats.harmless | default(0) }}"
      undetected: "{{ response.data.attributes.last_analysis_stats.undetected | default(0) }}"
      total: "{{ if(response.data.attributes.last_analysis_stats, response.data.attributes.last_analysis_stats | values | sum, 0) }}"
      stats: "{{ response.data.attributes.last_analysis_stats }}"
      # The engines that flag it, those that say malicious first, each group by name.
      engines: >-
        {{ response.data.attributes.last_analysis_results | default([]) | entries | sort_by('key')
        | where('value.category', 'in', ['malicious', 'suspicious'])
        | pick(engine='key', category='value.category', result='value.result') | sort_by('category') }}
      # Every engine: those above first, then the others by name.
      all_engines: >-
        {{ response.data.attributes.last_analysis_results | default([]) | entries | sort_by('key')
        | where('value.category', 'in', ['malicious', 'suspicious'])
        | pick(engine='key', category='value.category', result='value.result') | sort_by('category')
        | union(response.data.attributes.last_analysis_results | default([]) | entries | sort_by('key') | pick(engine='key', category='value.category', result='value.result')) }}
      reputation: "{{ response.data.attributes.reputation }}"
      last_analysis: "{{ if(response.data.attributes.last_analysis_date, response.data.attributes.last_analysis_date * 1000) }}"
      tags: "{{ response.data.attributes.tags | default([]) | limit(12) }}"
      registrar: "{{ response.data.attributes.registrar }}"
      created: "{{ if(response.data.attributes.creation_date, response.data.attributes.creation_date * 1000) }}"
      categories: "{{ response.data.attributes.categories | default([]) | values | unique | sort | limit(8) }}"
      id: "{{ response.data.id }}"
      attributes: "{{ response.data.attributes }}"
      link: "https://www.virustotal.com/gui/domain/{{ first_of(response.data.id, args.domain) }}"

  - name: rescan-domain
    description: "Ask VirusTotal to analyse a domain again; gives the id of the analysis."
    changes_outside: true
    idempotent: false
    arguments:
      - { name: domain, required: true, description: "The domain name" }
    request: { method: POST, path: "/domains/{{ args.domain }}/analyse" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      analysis_id: "{{ response.data.id }}"
      type: "{{ response.data.type }}"
    sample:
      analysis_id: d-f4e5279ebbcf9d485e33f3c67007b73e9f12d54bbca875545819a2307a194752-1715608490
      type: analysis

  - name: list-domain-comments
    description: "The comments the community wrote on a domain."
    arguments:
      - { name: domain, required: true, description: "The domain name" }
    request: { method: GET, path: "/domains/{{ args.domain }}/comments" }
