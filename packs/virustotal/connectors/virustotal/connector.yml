  - name: get-monitor-partner-comment
    description: "A comment an antivirus partner wrote on a hash."
    premium: true
    arguments:
      - { name: id, required: true, description: "The id of the comment" }
    request: { method: GET, path: "/monitor_partner/comments/{{ args.id }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.data }}"
      ids: "{{ response.data | pluck('id') }}"
      count: "{{ response.data | length }}"
      meta: "{{ response.meta }}"

  - name: update-monitor-partner-comment
    description: "Change a comment on a hash, and whether the detection is confirmed."
    premium: true
    changes_outside: true
    idempotent: true
    arguments:
      - { name: id, required: true, description: "The id of the comment" }
      - { name: sha256, required: true, description: "The SHA-256 of the file the comment is on" }
      - { name: comment, required: true, description: "The text of the comment" }
      - { name: engine, required: true, description: "The name of your engine" }
      - { name: detection, description: "confirmed to say the detection is right and stop seeing this hash among the latest analyses" }
    request:
      method: PATCH
      path: "/monitor_partner/comments/{{ args.id }}"
      json:
        data:
          - type: monitor_hash_comment
            id: "{{ args.id }}"
            attributes:
              comment: "{{ args.comment }}"
              detection: "{{ args.detection }}"
              engine: "{{ args.engine }}"
              sha256: "{{ args.sha256 }}"
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.data }}"
      ids: "{{ response.data | pluck('id') }}"
      count: "{{ response.data | length }}"
      meta: "{{ response.meta }}"
    sample:
      items:
        - type: monitor_hash_comment
          id: "6620bdb508ab363eee95fd511ae88e2e38daf948b117bd49bcf8609f87cc86de-acme-av"
          attributes:
            comment: "This is an example comment."
            date: 1519222846
            detection: confirmed
            engine: acme-av
            sha256: "6620bdb508ab363eee95fd511ae88e2e38daf948b117bd49bcf8609f87cc86de"
      ids: ["6620bdb508ab363eee95fd511ae88e2e38daf948b117bd49bcf8609f87cc86de-acme-av"]
      count: 1
      meta: null

  - name: delete-monitor-partner-comment
    description: "Delete a comment on a hash; its detection is no longer confirmed."
    premium: true
    changes_outside: true
    idempotent: true
    arguments:
      - { name: id, required: true, description: "The id of the comment" }
    request:
      method: DELETE
      path: "/monitor_partner/comments/{{ args.id }}"
    error: { message: "{{ response.error.message }}" }
    outputs: { status: "{{ status }}" }
    sample: { status: 200 }

  - name: get-monitor-partner-file-download-url
    description: "An address, good for one hour, a Monitor file can be downloaded from by its hash."
    premium: true
    arguments:
      - { name: sha256, required: true, description: "The SHA-256 of the file" }
    request:
      method: GET
      path: "/monitor_partner/files/{{ args.sha256 }}/download_url"
    error: { message: "{{ response.error.message }}" }

  - name: download-monitor-partner-file
    description: "Download a Monitor file by its hash, kept as an artifact as it came, never opened."
    premium: true
    arguments:
      - { name: sha256, required: true, description: "The SHA-256 of the file" }
    request:
      method: GET
      path: "/monitor_partner/files/{{ args.sha256 }}/download"
      answer: file
      save_as: { name: "{{ args.sha256 }}" }
    error: { message: "{{ response.error.message }}" }
    timeout: 300

  - name: get-monitor-partner-bundle-download-url
    description: "An address to download the daily list (CSV) of what an engine detects in the Monitor collections."
    premium: true
    arguments:
      - { name: engine_name, required: true, description: "The name of your engine" }
    request:
      method: GET
      path: "/monitor_partner/detections_bundle/{{ args.engine_name }}/download_url"
    error: { message: "{{ response.error.message }}" }

  - name: download-monitor-partner-bundle
    description: "Download the daily list (CSV) of what an engine detects in the Monitor collections, kept as an artifact as it came, never opened: a line holds the owner, the hash, the link to its analyses and its download address."
    premium: true
    arguments:
      - { name: engine_name, required: true, description: "The name of your engine" }
      - { name: date, description: "An earlier day, as YYYY-MM-DD; the latest list when empty" }
    request:
      method: GET
      path: "/monitor_partner/detections_bundle/{{ args.engine_name }}{{ if(args.date, '/' ~ args.date, '') }}/download"
      answer: file
      save_as: { name: "{{ args.engine_name }}-detections{{ if(args.date, '-' ~ args.date, '') }}.csv", type: text/csv }
    error: { message: "{{ response.error.message }}" }
    timeout: 300

  - name: list-monitor-partner-statistics
    description: "Day by day, how many Monitor hashes your engine analysed and how many it detected."
    premium: true
    arguments:
      - { name: filter, description: "engine:<name> when you have several engines" }
      - { name: cursor, description: "Where to go on from: the cursor a previous answer gave" }
      - { name: limit, type: number, description: "How many to read" }
    request:
      method: GET
      path: "/monitor_partner/statistics"
      query:
        filter: "{{ args.filter }}"
        cursor: "{{ args.cursor }}"
        limit: "{{ args.limit }}"
    error: { message: "{{ response.error.message }}" }
    outputs:
      items: "{{ response.data }}"
      ids: "{{ response.data | pluck('id') }}"
      count: "{{ response.data | length }}"
      meta: "{{ response.meta }}"
