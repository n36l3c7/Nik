    arguments:
      - { name: sample, type: file, required: true, description: "The file: an artifact of Nik (file-<sha256>) or the SHA-256 of a file Nik holds" }
      - { name: path, description: "Where it goes, from the root of your collection, with the name of the file: /folder/myfile.exe" }
      - { name: item, description: "Instead of a path: the id of the Monitor item to overwrite" }
      - { name: upload_url, description: "For a file larger than 32 MB: the address get-monitor-upload-url gave, good for one upload" }
    request:
      method: POST
      path: "{{ first_of(args.upload_url, '/monitor/items') }}"
      multipart: { path: "{{ args.path }}", item: "{{ args.item }}" }
      files:
        file: { artifact: "{{ args.sample }}" }
    error: { message: "{{ response.error.message }}" }
    outputs: { id: "{{ response.data.id }}", type: "{{ response.data.type }}" }
    sample: { id: L2ZvbGRlci9teWZpbGUuZXhl, type: monitor_item }
    timeout: 300

