  - name: get-file-report
    description: "What VirusTotal knows of a file, by its hash, with a verdict from what the engines say."
    reputation: file
    arguments:
      - { name: id, required: true, description: "The SHA-256, SHA-1 or MD5 of the file" }
    request: { method: GET, path: "/files/{{ args.id }}" }
    success:
      status: [200, 404]
    error: { message: "{{ response.error.message }}" }
    outputs:
      # The rule of Nik's own look-up: 3 engines or more that say malicious make it malicious; 1 or 2,
      # or any that says suspicious, make it suspicious; otherwise harmless when an engine says so.
      # An indicator VirusTotal does not have (404) has no counts: unknown.
      verdict: >-
        {{ if(first_of(response.data.attributes.last_analysis_stats.malicious, 0) >= 3, 'malicious',
        if(first_of(response.data.attributes.last_analysis_stats.malicious, 0) >= 1 or first_of(response.data.attributes.last_analysis_stats.suspicious, 0) >= 1, 'suspicious',
        if(first_of(response.data.attributes.last_analysis_stats.harmless, 0) >= 1, 'harmless', 'unknown'))) }}
      summary: >-
        {{ if(response.data,
        first_of(response.data.attributes.last_analysis_stats.malicious, 0) ~ '/' ~ if(response.data.attributes.last_analysis_stats, response.data.attributes.last_analysis_stats | values | sum, 0) ~ ' engines flag it'
        ~ if(first_of(response.data.attributes.last_analysis_stats.suspicious, 0) >= 1, ', ' ~ response.data.attributes.last_analysis_stats.suspicious ~ ' suspicious', ''),
        'not in VirusTotal') }}
      malicious: "{{ response.data.attributes.last_analysis_stats.malicious | default(0) }}"
      suspicious: "{{ response.data.attributes.last_analysis_stats.suspicious | default(0) }}"
      harmless: "{{ response.data.attributes.last_analysis_stats.harmless | default(0) }}"
      undetected: "{{ response.data.attributes.last_analysis_stats.undetected | default(0) }}"
      total: "{{ if(response.data.attributes.last_analysis_stats, response.data.attributes.last_analysis_stats | values | sum, 0) }}"
      stats: "{{ response.data.attributes.last_analysis_stats }}"
      # The engines that flag it, those that say malicious first, each group by name.
      engines: >-
        {{ response.data.attributes.last_analysis_results | default([]) | entries | sort_by('key')
        | where('value.category', 'in', ['malicious', 'suspicious'])
        | pick(engine='key', category='value.category', result='value.result') | sort_by('category') }}
      # Every engine: those above first, then the others by name.
      all_engines: >-
        {{ response.data.attributes.last_analysis_results | default([]) | entries | sort_by('key')
        | where('value.category', 'in', ['malicious', 'suspicious'])
        | pick(engine='key', category='value.category', result='value.result') | sort_by('category')
        | union(response.data.attributes.last_analysis_results | default([]) | entries | sort_by('key') | pick(engine='key', category='value.category', result='value.result')) }}
      reputation: "{{ response.data.attributes.reputation }}"
      last_analysis: "{{ if(response.data.attributes.last_analysis_date, response.data.attributes.last_analysis_date * 1000) }}"
      tags: "{{ response.data.attributes.tags | default([]) | limit(12) }}"
      name: "{{ response.data.attributes.meaningful_name | default('') | limit(200) }}"
      names: "{{ response.data.attributes.names | default([]) | limit(8) }}"
      type: "{{ response.data.attributes.type_description }}"
      size: "{{ response.data.attributes.size }}"
      label: "{{ response.data.attributes.popular_threat_classification.suggested_threat_label }}"
      signer: "{{ response.data.attributes.signature_info.signers | default('') | limit(200) }}"
      created: "{{ if(response.data.attributes.creation_date, response.data.attributes.creation_date * 1000) }}"
      first_seen: "{{ if(response.data.attributes.first_submission_date, response.data.attributes.first_submission_date * 1000) }}"
      last_seen: "{{ if(response.data.attributes.last_submission_date, response.data.attributes.last_submission_date * 1000) }}"
      id: "{{ response.data.id }}"
      attributes: "{{ response.data.attributes }}"
      link: "https://www.virustotal.com/gui/file/{{ first_of(response.data.id, args.id) }}"

