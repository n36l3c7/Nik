# ServiceNow, through its Table API.
#
# Written against the Table API reference of the "Australia" release
# (servicenow.com/docs, REST API reference, Table API). Not run against a
# real instance: see "verified" below.
#
# The account of the connection is a ServiceNow user with basic
# authentication and the roles that let it read and write incidents (for
# example "itil"). An instance that only takes OAuth is not served by this
# file yet.
#
# Fetching brings in the incidents opened since the last cycle, oldest first
# (sys_created_on, which the Table API gives and compares in UTC as
# "yyyy-MM-dd HH:mm:ss"). Mirroring reads an incident by its sys_id, and its
# comments from the journal (sys_journal_field), which the account must be
# allowed to read.
#
# The fields of an incident differ from one company to another. The commands
# name the common ones; any other is set with "update-incident", which takes
# the fields to change as an object: {"u_site": "Milan", "state": "2"}.
name: ServiceNow
id: servicenow
version: 5
description: Incidents and their comments in ServiceNow.
api_version: "Table API (/api/now/table), release Australia"
verified: false
configuration:
  - name: url
    label: Instance address
    type: url
    required: true
    help: "https://your-instance.service-now.com"
  - name: credentials
    type: basic
base_url: "{{ config.url }}"
headers:
  Accept: application/json
test:
  request: { method: GET, path: /api/now/table/incident, query: { sysparm_limit: 1, sysparm_fields: sys_id } }
commands:
  - name: create-incident
    description: Open an incident.
    changes_outside: true
    idempotent: false
    arguments:
      - { name: short_description, type: text, required: true, description: The title of the incident }
      - { name: description, type: text, description: What happened }
      - { name: urgency, type: choice, choices: ["1", "2", "3"], default: "3", description: "1 is high, 3 is low" }
      - { name: impact, type: choice, choices: ["1", "2", "3"], default: "3", description: "1 is high, 3 is low" }
      - { name: category, type: text, description: The category }
      - { name: assignment_group, type: text, description: The group it goes to (its name or its sys_id) }
      - { name: caller_id, type: text, description: Who it is opened for (a user name or a sys_id) }
    request:
      method: POST
      path: /api/now/table/incident
      json:
        short_description: "{{ args.short_description }}"
        description: "{{ args.description }}"
        urgency: "{{ args.urgency }}"
        impact: "{{ args.impact }}"
        category: "{{ args.category }}"
        assignment_group: "{{ args.assignment_group }}"
        caller_id: "{{ args.caller_id }}"
    success: { status: [200, 201] }
    error: { message: "{{ response.error.message }}" }
    outputs:
      number: "{{ response.result.number }}"
      sys_id: "{{ response.result.sys_id }}"
      url: "{{ config.url }}/nav_to.do?uri=incident.do?sys_id={{ response.result.sys_id }}"
    # The ticket, in the context of the incident the playbook works on.
    context:
      - path: Ticket(val.ID == obj.ID)
        value:
          ID: "{{ response.result.sys_id }}"
          Number: "{{ response.result.number }}"
          System: ServiceNow
          URL: "{{ config.url }}/nav_to.do?uri=incident.do?sys_id={{ response.result.sys_id }}"
    sample:
      number: INC0000001
      sys_id: 00000000000000000000000000000000
      url: "https://your-instance.service-now.com/nav_to.do?uri=incident.do?sys_id=00000000000000000000000000000000"

  - name: get-incident
    description: An incident, by its number.
    arguments:
      - { name: number, type: text, required: true, description: "The number of the incident: INC0010001" }
    request:
      method: GET
      path: /api/now/table/incident
      query:
        sysparm_query: "number={{ args.number }}"
        sysparm_limit: 1
        sysparm_display_value: "true"
    error: { message: "{{ response.error.message }}" }
    outputs:
      found: "{{ response.result | length | bool }}"
      sys_id: "{{ response.result[0].sys_id }}"
      number: "{{ response.result[0].number }}"
      state: "{{ response.result[0].state }}"
      short_description: "{{ response.result[0].short_description }}"
      assigned_to: "{{ response.result[0].assigned_to }}"
      incident: "{{ response.result[0] }}"

  - name: update-incident
    description: Change fields of an incident.
    changes_outside: true
    idempotent: true
    arguments:
      - { name: sys_id, type: text, required: true, description: "The sys_id of the incident (get-incident gives it)" }
      - { name: fields, type: object, required: true, description: "The fields to change, by their name: {\"state\": \"2\"}" }
    request:
      method: PATCH
      path: "/api/now/table/incident/{{ args.sys_id }}"
      json: "{{ args.fields }}"
    error: { message: "{{ response.error.message }}" }
    outputs:
      number: "{{ response.result.number }}"
      sys_id: "{{ response.result.sys_id }}"
      state: "{{ response.result.state }}"
    sample: { number: INC0000001, sys_id: 00000000000000000000000000000000, state: "2" }

  - name: add-comment
    description: Write a comment on an incident (seen by the person who opened it).
    changes_outside: true
    idempotent: false
    arguments:
      - { name: sys_id, type: text, required: true, description: "The sys_id of the incident (get-incident gives it)" }
      - { name: text, type: text, required: true, description: The comment }
    request:
      method: PATCH
      path: "/api/now/table/incident/{{ args.sys_id }}"
      json: { comments: "{{ args.text }}" }
    error: { message: "{{ response.error.message }}" }
    outputs:
      number: "{{ response.result.number }}"
      sys_id: "{{ response.result.sys_id }}"
    sample: { number: INC0000001, sys_id: 00000000000000000000000000000000 }

  - name: get-incident-by-id
    description: An incident, by its sys_id, with the values as they are stored (not their labels).
    arguments:
      - { name: sys_id, type: text, required: true, description: The sys_id of the incident }
    request:
      method: GET
      path: "/api/now/table/incident/{{ args.sys_id }}"
    error: { message: "{{ response.error.message }}" }
    outputs:
      incident: "{{ response.result }}"

  - name: get-comments
    description: The comments of an incident, oldest first.
    arguments:
      - { name: sys_id, type: text, required: true, description: The sys_id of the incident }
    request:
      method: GET
      path: /api/now/table/sys_journal_field
      query:
        sysparm_query: "element_id={{ args.sys_id }}^element=comments^ORDERBYsys_created_on"
        sysparm_fields: "sys_id,value,sys_created_by,sys_created_on"
        sysparm_limit: 100
    error: { message: "{{ response.error.message }}" }
    outputs:
      comments: "{{ response.result }}"

fetch:
  interval_seconds: 120
  first_fetch: 3 days
  request:
    method: GET
    path: /api/now/table/incident
    query:
      sysparm_query: "sys_created_on>={{ since.epoch | date('%Y-%m-%d %H:%M:%S') }}^ORDERBYsys_created_on"
  error: { message: "{{ response.error.message }}" }
  pagination:
    type: offset
    param: sysparm_offset
    limit_param: sysparm_limit
    limit: 100
    items: "{{ response.result }}"
    max_pages: 2
  item_id: "{{ item.sys_id }}"
  occurred: "{{ item.opened_at }}"
  item_time: "{{ item.sys_created_on }}"

schema:
  incoming:
    - { name: sys_id, type: text, description: The id of the incident in ServiceNow }
    - { name: number, type: text, description: "Its number: INC0010001" }
    - { name: short_description, type: text }
    - { name: description, type: text }
    - { name: priority, type: number, description: "1 (critical) to 5 (planning)" }
    - { name: urgency, type: number, description: "1 (high) to 3 (low)" }
    - { name: impact, type: number, description: "1 (high) to 3 (low)" }
    - { name: state, type: number, description: "1 new, 2 in progress, 3 on hold, 6 resolved, 7 closed, 8 canceled" }
    - { name: category, type: text }
    - { name: opened_at, type: date }
    - { name: sys_created_on, type: date }
    - { name: close_notes, type: text }
  outgoing:
    - { name: short_description, type: text }
    - { name: description, type: text }
    - { name: urgency, type: number }
    - { name: impact, type: number }
    - { name: category, type: text }
    - { name: work_notes, type: text }
    - { name: state, type: number }
    - { name: close_code, type: text }
    - { name: close_notes, type: text }

# The object an incident is kept in step with is the record its item was, by its sys_id (the id of
# the fetched item). The direction is what the instance says (None, In, Out, In-out): the mapper of
# the pack no longer names it.
mirror:
  interval_seconds: 120
  get: { command: get-incident-by-id }
  item: "{{ result.incident }}"
  update:
    command: update-incident
    args: { sys_id: "{{ mirror.id }}", fields: "{{ fields }}" }
  comments:
    list: { command: get-comments }
    items: "{{ result.comments }}"
    id: "{{ item.sys_id }}"
    text: "{{ item.value }}"
    author: "{{ item.sys_created_by }}"
    at: "{{ item.sys_created_on }}"
    add:
      command: add-comment
      args: { sys_id: "{{ mirror.id }}", text: "{{ comment.text }}" }
