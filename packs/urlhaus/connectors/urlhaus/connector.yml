# URLhaus (abuse.ch), through its API v1 for automated queries.
#
# Written from the documentation at https://urlhaus-api.abuse.ch/ and, for
# what is said of submissions and feeds, https://urlhaus.abuse.ch/api/. Not
# run against the real service: see "verified" below.
#
# The Auth-Key (free, from https://auth.abuse.ch/, the same for URLhaus,
# MalwareBazaar and ThreatFox) goes in the "Auth-Key" header. The API
# answers 200 and says what happened in "query_status" (ok, no_results,
# invalid_url…): every command gives it as an output.
#
# The verdicts are those Nik's own look-up code gave: a URL that URLhaus
# tracks is malicious; a host on which it saw malware URLs is suspicious
# (the host may be a compromised site); anything else is unknown. For a
# file, URLhaus itself says that not every payload it collected is
# malware (a cleaned-up URL serves anything): a payload with a malware
# family is malicious, one without is suspicious.
#
# Files (6.5): download-payload keeps the ZIP URLhaus answers as an
# artifact, as it came; nothing is unpacked. The hourly and daily batches
# are files on datalake.abuse.ch (more_hosts), which takes no key.
#
# Two things need the Auth-Key where the key of the instance does not go
# (it travels in its header, to urlhaus-api.abuse.ch only): the address of
# a database dump holds it (/v2/files/exports/<key>/recent.csv), and the
# submission API is on another host, urlhaus.abuse.ch (more_hosts), which
# wants it in its header. For those the instance is asked for the key a
# second time ("auth_key"): given, it is the permission to send it there;
# left empty, download-export and submit-url fail and the rest works.
name: URLhaus
id: urlhaus
version: 4
description: Malware distribution URLs tracked by URLhaus (abuse.ch), with the hosts they are on and the payloads they serve, downloaded and submitted.
api_version: "URLhaus API v1 (urlhaus-api.abuse.ch/v1)"
verified: false
# Among the sources of an indicator's reputation: how much the verdict counts in the overall one (1 to 3).
lookups: { weight: 3 }
configuration:
  - name: credentials
    label: Auth-Key
    type: header
    header: Auth-Key
    required: true
    help: "The Auth-Key of your abuse.ch account, from https://auth.abuse.ch/. One key works for URLhaus, MalwareBazaar and ThreatFox."
  - name: auth_key
    label: Auth-Key, for submissions and exports
    type: secret
    help: "The same Auth-Key, typed again, for submit-url and download-export only: the first sends it to urlhaus.abuse.ch, the second writes it in the address of the export. Leave it empty when neither is used."
base_url: "https://urlhaus-api.abuse.ch"
more_hosts:
  - urlhaus.abuse.ch
  - datalake.abuse.ch
test:
  request: { method: GET, path: /v1/urls/recent/limit/1/ }
  expect: { status: 200 }
commands:
  - name: get-url-report
    description: What URLhaus knows of a URL, with a verdict.
    reputation: url
    arguments:
      - { name: url, type: text, required: true, description: "The URL, as it is seen on the wire: http://example.org/file.exe" }
    request:
      method: POST
      path: /v1/url/
      form: { url: "{{ args.url }}" }
    error: { message: "{{ response.query_status }}" }
    outputs:
      # Malicious when URLhaus tracks the URL, online or not; unknown otherwise.
      verdict: "{{ if(response.query_status | default('') == 'ok', 'malicious', 'unknown') }}"
      summary: >-
        {{ if(response.query_status | default('') == 'ok',
        'URLhaus: ' ~ first_of(response.threat, 'malware URL') ~ ' (' ~ first_of(response.url_status, 'status unknown') ~ ')',
        'not in URLhaus') }}
      link: "{{ first_of(response.urlhaus_reference, 'https://urlhaus.abuse.ch/') }}"
      query_status: "{{ response.query_status }}"
      id: "{{ response.id }}"
      url_status: "{{ response.url_status }}"
      host: "{{ response.host }}"
      date_added: "{{ response.date_added }}"
      last_online: "{{ response.last_online }}"
      threat: "{{ response.threat }}"
      blacklists: "{{ response.blacklists }}"
      reporter: "{{ response.reporter }}"
      tags: "{{ response.tags }}"
      payloads: "{{ response.payloads }}"
      payload_sha256: "{{ response.payloads | pluck('response_sha256') }}"

  - name: get-url-by-id
    description: What URLhaus knows of a URL it tracks, by the id of its entry.
    arguments:
      - { name: id, type: text, required: true, description: "The id of the URLhaus entry: 233833" }
    request:
      method: POST
      path: /v1/urlid/
      form: { urlid: "{{ args.id }}" }
    error: { message: "{{ response.query_status }}" }
    outputs:
      query_status: "{{ response.query_status }}"
      id: "{{ response.id }}"
      url: "{{ response.url }}"
      link: "{{ response.urlhaus_reference }}"
      url_status: "{{ response.url_status }}"
      host: "{{ response.host }}"
      date_added: "{{ response.date_added }}"
      last_online: "{{ response.last_online }}"
      threat: "{{ response.threat }}"
      blacklists: "{{ response.blacklists }}"
      reporter: "{{ response.reporter }}"
      tags: "{{ response.tags }}"
      payloads: "{{ response.payloads }}"
      payload_sha256: "{{ response.payloads | pluck('response_sha256') }}"

  - name: get-host-report
    description: The malware URLs URLhaus saw on a host (a domain name, a hostname or an IPv4 address), with a verdict.
    reputation: domain
    arguments:
      - { name: host, type: text, required: true, description: "The domain name, hostname or IPv4 address: vektorex.com" }
    request:
      method: POST
      path: /v1/host/
      form: { host: "{{ args.host }}" }
    error: { message: "{{ response.query_status }}" }
    outputs:
      # Suspicious when URLhaus saw malware URLs on the host (it may be a compromised site); unknown otherwise.
      verdict: "{{ if(response.query_status | default('') == 'ok' and response.url_count | default(0) | int > 0, 'suspicious', 'unknown') }}"
      summary: >-
        {{ if(response.query_status | default('') == 'ok' and response.url_count | default(0) | int > 0,
        'URLhaus: ' ~ (response.url_count | default(0) | int | plural('malware URL')) ~ ' on this host',
        'not in URLhaus') }}
      link: "{{ first_of(response.urlhaus_reference, 'https://urlhaus.abuse.ch/') }}"
      query_status: "{{ response.query_status }}"
      url_count: "{{ response.url_count | default(0) | int }}"
      firstseen: "{{ response.firstseen }}"
      blacklists: "{{ response.blacklists }}"
      urls: "{{ response.urls }}"
      addresses: "{{ response.urls | pluck('url') }}"
      online: "{{ response.urls | where('url_status', 'eq', 'online') | pluck('url') }}"

  - name: get-file-report
    description: What URLhaus knows of a payload a malware URL served, by its MD5 or SHA256 hash, with a verdict.
    reputation: file
    arguments:
      - { name: hash, type: text, required: true, description: "The MD5 or SHA256 hash of the file (URLhaus does not take SHA1)" }
    request:
      method: POST
      path: /v1/payload/
      # The field is md5_hash for a hash of 32 characters, sha256_hash otherwise.
      form:
        "{{ args.hash | trim | length | map('32', 'md5_hash', else='sha256_hash') }}": "{{ args.hash | trim }}"
    error: { message: "{{ response.query_status }}" }
    outputs:
      # A payload with a malware family is malicious; one URLhaus collected without naming a family is
      # suspicious (a cleaned-up URL serves anything); a file it never saw is unknown.
      verdict: >-
        {{ if(response.query_status | default('') == 'ok',
        if(first_of(response.signature, ''), 'malicious', 'suspicious'),
        'unknown') }}
      summary: >-
        {{ if(response.query_status | default('') == 'ok',
        'URLhaus: ' ~ first_of(response.signature, 'payload served by a malware URL, no malware family identified'),
        'not in URLhaus') }}
      link: "{{ first_of(response.urls[0].urlhaus_reference, 'https://urlhaus.abuse.ch/') }}"
      query_status: "{{ response.query_status }}"
      md5: "{{ response.md5_hash }}"
      sha256: "{{ response.sha256_hash }}"
      signature: "{{ response.signature }}"
      file_type: "{{ response.file_type }}"
      file_size: "{{ response.file_size }}"
      firstseen: "{{ response.firstseen }}"
      lastseen: "{{ response.lastseen }}"
      url_count: "{{ response.url_count }}"
      virustotal: "{{ response.virustotal }}"
      urls: "{{ response.urls }}"
      addresses: "{{ response.urls | pluck('url') }}"

  - name: list-recent-urls
    description: The URLs added to URLhaus in the last 3 days, newest first (1000 at most).
    arguments:
      - { name: limit, type: number, default: 1000, description: "How many URLs at most: 1000 at most" }
    request:
      method: GET
      path: "/v1/urls/recent/limit/{{ args.limit | default(1000) | int }}/"
    error: { message: "{{ response.query_status }}" }
    outputs:
      urls: "{{ response.urls }}"
      addresses: "{{ response.urls | pluck('url') }}"
      online: "{{ response.urls | where('url_status', 'eq', 'online') | pluck('url') }}"
      count: "{{ response.urls | default('') | length }}"
      query_status: "{{ response.query_status }}"

  - name: list-recent-payloads
    description: The payloads URLhaus collected in the last 3 days, newest first (1000 at most).
    arguments:
      - { name: limit, type: number, default: 1000, description: "How many payloads at most: 1000 at most" }
    request:
      method: GET
      path: "/v1/payloads/recent/limit/{{ args.limit | default(1000) | int }}/"
    error: { message: "{{ response.query_status }}" }
    outputs:
      payloads: "{{ response.payloads }}"
      sha256: "{{ response.payloads | pluck('sha256_hash') }}"
      count: "{{ response.payloads | default('') | length }}"
      query_status: "{{ response.query_status }}"

  - name: search-tag
    description: The malware URLs that carry a tag (1000 at most).
    arguments:
      - { name: tag, type: text, required: true, description: "The tag, in any case: Retefe" }
    request:
      method: POST
      path: /v1/tag/
      form: { tag: "{{ args.tag }}" }
    error: { message: "{{ response.query_status }}" }
    outputs:
      urls: "{{ response.urls }}"
      addresses: "{{ response.urls | pluck('url') }}"
      online: "{{ response.urls | where('url_status', 'eq', 'online') | pluck('url') }}"
      url_count: "{{ response.url_count | default(0) | int }}"
      firstseen: "{{ response.firstseen }}"
      lastseen: "{{ response.lastseen }}"
      query_status: "{{ response.query_status }}"

  - name: search-signature
    description: The malware URLs that served a malware family, by the signature URLhaus gave their payloads (1000 at most).
    arguments:
      - { name: signature, type: text, required: true, description: "The malware family, in any case: Gozi" }
    request:
      method: POST
      path: /v1/signature/
      form: { signature: "{{ args.signature }}" }
    error: { message: "{{ response.query_status }}" }
    outputs:
      urls: "{{ response.urls }}"
      addresses: "{{ response.urls | pluck('url') }}"
      online: "{{ response.urls | where('url_status', 'eq', 'online') | pluck('url') }}"
      sha256: "{{ response.urls | pluck('sha256_hash') | unique }}"
      url_count: "{{ response.url_count | default(0) | int }}"
      payload_count: "{{ response.payload_count | default(0) | int }}"
      firstseen: "{{ response.firstseen }}"
      lastseen: "{{ response.lastseen }}"
      query_status: "{{ response.query_status }}"

  # ----------------------------------------------------------------- files --
  - name: download-payload
    description: >-
      Download a payload URLhaus collected from a malware URL, by its SHA256 hash, kept as an artifact: the ZIP
      URLhaus answers, which has no password. Nothing is unpacked.
    arguments:
      - { name: sha256_hash, type: text, required: true, description: The SHA256 hash of the payload }
    request:
      method: GET
      path: "/v1/download/{{ args.sha256_hash | urlencode }}/"
      answer: file
      save_as: { name: "{{ args.sha256_hash }}.zip", type: application/zip }
    # A hash URLhaus does not hold is answered with the words not_found, an error with copy_error, where the
    # file should be: only an archive is kept.
    success:
      when:
        any:
          - { left: "{{ headers['content-type'] }}", op: contains, right: zip }
          - { left: "{{ headers['content-type'] }}", op: contains, right: octet-stream }
    error: { message: "{{ first_of(response.query_status, response.text, '') | limit(200) }}" }
    timeout: 300
    sample: { name: payload.zip, type: application/zip, size: 0, sha256: "", artifact: "", linked: false }

  - name: download-hourly-batch
    description: >-
      Download the batch of the payloads of one hour, kept as an artifact: a ZIP with the password "infected",
      from datalake.abuse.ch. Nothing is unpacked. A batch is often hundreds of megabytes: one over the limit of
      a sample is refused, and nothing is kept.
    arguments:
      - { name: hour, type: text, description: "The hour, in UTC, as YYYY-MM-DD-HH: 2026-11-19-23. Two hours ago when left empty (a batch is made a few minutes after its hour ends)" }
    request:
      method: GET
      path: "https://datalake.abuse.ch/urlhaus/hourly/{{ first_of(args.hour, now.iso | date_add(-2, 'hours') | date('%Y-%m-%d-%H')) | urlencode }}.zip"
      answer: file
      save_as: { type: application/zip }
    timeout: 300
    sample: { name: 2026-11-19-23.zip, type: application/zip, size: 0, sha256: "", artifact: "", linked: false }

  - name: download-daily-batch
    description: >-
      Download the batch of the payloads of one day, kept as an artifact: a ZIP with the password "infected",
      from datalake.abuse.ch. Nothing is unpacked. A daily batch is over a gigabyte: one over the limit of a
      sample is refused, and nothing is kept.
    arguments:
      - { name: date, type: text, description: "The day, in UTC, as YYYY-MM-DD: 2026-11-18. Yesterday when left empty (its batch is made a few minutes after midnight UTC)" }
    request:
      method: GET
      path: "https://datalake.abuse.ch/urlhaus/daily/{{ first_of(args.date, now.iso | date_add(-1, 'days') | date('%Y-%m-%d')) | urlencode }}.zip"
      answer: file
      save_as: { type: application/zip }
    timeout: 300
    sample: { name: 2026-11-18.zip, type: application/zip, size: 0, sha256: "", artifact: "", linked: false }

  - name: download-export
    description: >-
      Download one of the database dumps and feeds URLhaus publishes, kept as an artifact. The page
      urlhaus.abuse.ch/api lists their names to a signed-in account. They are made every 5 minutes: do not ask
      more often. Needs "Auth-Key, for submissions and exports" in the instance.
    arguments:
      - { name: file, type: text, default: recent.csv, description: "The name of the dump, as the page gives it: recent.csv" }
    request:
      method: GET
      # The Auth-Key is part of the address of a dump, as URLhaus says.
      path: "/v2/files/exports/{{ secret.auth_key }}/{{ args.file | urlencode }}"
      answer: file
      save_as: { name: "urlhaus-{{ args.file }}" }
    timeout: 300
    sample: { name: urlhaus-recent.csv, type: text/csv, size: 0, sha256: "", artifact: "", linked: false }

  - name: submit-url
    description: >-
      Submit a URL that is serving malware right now to URLhaus, under your abuse.ch account. Read its
      submission policy first: active malware distribution only, no phishing, no adware, no redirectors. Needs
      "Auth-Key, for submissions and exports" in the instance: the request goes to urlhaus.abuse.ch.
    changes_outside: true
    idempotent: false
    arguments:
      - { name: url, type: text, required: true, description: "The URL as it is seen on the wire, answering 200: https://evil.example/payload.exe" }
      - { name: tags, type: list, description: "Tags, letters, digits, dot, dash and space only: [Emotet, doc]" }
      - { name: anonymous, type: bool, default: false, description: "True to hide your abuse.ch handle on the submission" }
    request:
      method: POST
      path: "https://urlhaus.abuse.ch/api/"
      # Another host of abuse.ch: the key of the instance is not sent there, the one given for this is.
      headers: { Auth-Key: "{{ secret.auth_key }}" }
      json:
        anonymous: "{{ if(args.anonymous, '1', '0') }}"
        submission:
          - url: "{{ args.url }}"
            threat: malware_download
            tags: "{{ args.tags }}"
    sample: { response: {} }
