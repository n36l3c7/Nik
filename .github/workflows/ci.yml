name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job writes to the repository.
permissions:
  contents: read

# A new push to a pull request makes the run of the previous one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit (the tag is in the comment; Dependabot moves
# both): a tag can be re-pointed, a commit cannot.

jobs:
  # Lint needs no system package and no network beyond pip: it answers in a
  # minute even when a package mirror is having a bad day.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install ruff (the version the backend pins)
        run: pip install "$(grep -i '^ruff' backend/requirements-dev.txt)"
      - name: Backend
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Workers
        working-directory: workers
        run: for d in analyzer capa docview browser pcap; do (cd "$d" && ruff check . && ruff format --check .) || exit 1; done

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Pango for WeasyPrint (incident report PDF)
        run: .github/scripts/retry.sh 4 .github/scripts/apt-install.sh libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: pytest
      - name: Analyzer worker (tests on recorded rizin output)
        working-directory: workers/analyzer
        run: python -m pytest -q tests
      - name: capa worker (tests on a recorded capa report)
        working-directory: workers/capa
        run: python -m pytest -q tests
      # The tests of the other workers need LibreOffice, Chromium and tshark:
      # they run inside the images (e2e job).

  # The same suite on PostgreSQL (the default job uses SQLite): the version
  # the Compose file runs, after `alembic upgrade head`.
  backend-postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["18"]
    services:
      postgres:
        image: docker.io/library/postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: nik
          POSTGRES_PASSWORD: nik
          POSTGRES_DB: nik
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nik -d nik" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://nik:nik@127.0.0.1:5432/nik
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Pango for WeasyPrint (incident report PDF)
        run: .github/scripts/retry.sh 4 .github/scripts/apt-install.sh libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # The Compose stack as an operator starts it (database, backend, web server):
  # the nginx configuration, the entrypoints, the container options and the
  # security headers, which no other job runs.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the images (base images and packages come from the network)
        run: |
          .github/scripts/retry.sh 3 docker build -t nik-smoke-api backend
          .github/scripts/retry.sh 3 docker build -t nik-smoke-web frontend
      - name: Start the stack and check it
        run: .github/scripts/stack-smoke.sh

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Chromium for Playwright (with its system packages)
        run: ../.github/scripts/retry.sh 4 npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build the worker images (base images and packages come from the network)
        run: |
          for w in analyzer capa docview browser pcap; do
            .github/scripts/retry.sh 3 docker build -t "nik-$w" "workers/$w"
          done
      - name: The workers' own tests, inside their images (capa, LibreOffice, Chromium, tshark)
        run: |
          for w in capa docview browser pcap; do
            docker run --rm --shm-size 256m -v "$PWD/workers/$w/tests:/opt/nik-$w/tests:ro" -w "/opt/nik-$w" \
              --entrypoint sh "nik-$w" \
              -c "pip install --quiet --user pytest && python -m pytest -q -p no:cacheprovider tests" || exit 1
          done
      - name: Start the workers on the E2E sample store
        run: |
          mkdir -p backend/.e2e-samples
          docker run -d --name nik-analyzer -p 127.0.0.1:8700:8700 \
            -v "$PWD/backend/.e2e-samples:/samples:ro" -e ANALYZER_TOKEN=e2e-token nik-analyzer
          docker run -d --name nik-capa -p 127.0.0.1:8710:8710 --read-only --tmpfs /tmp \
            -v "$PWD/backend/.e2e-samples:/samples:ro" -e CAPA_TOKEN=e2e-capa-token nik-capa
          docker run -d --name nik-docview -p 127.0.0.1:8720:8720 --read-only --tmpfs /tmp \
            -e DOCVIEW_TOKEN=e2e-docview-token nik-docview
          docker run -d --name nik-browser -p 127.0.0.1:8730:8730 --read-only --tmpfs /tmp --shm-size 256m \
            -e BROWSER_TOKEN=e2e-browser-token nik-browser
          docker run -d --name nik-pcap -p 127.0.0.1:8740:8740 --read-only --tmpfs /tmp \
            -v "$PWD/backend/.e2e-samples:/samples:ro" -e PCAP_TOKEN=e2e-pcap-token nik-pcap
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_ANALYZER_URL: http://127.0.0.1:8700
          E2E_ANALYZER_TOKEN: e2e-token
          E2E_CAPA_URL: http://127.0.0.1:8710
          E2E_CAPA_TOKEN: e2e-capa-token
          E2E_DOCVIEW_URL: http://127.0.0.1:8720
          E2E_DOCVIEW_TOKEN: e2e-docview-token
          E2E_BROWSER_URL: http://127.0.0.1:8730
          E2E_BROWSER_TOKEN: e2e-browser-token
          E2E_PCAP_URL: http://127.0.0.1:8740
          E2E_PCAP_TOKEN: e2e-pcap-token
      - name: Worker logs
        if: failure()
        run: for w in analyzer capa docview browser pcap; do docker logs nik-$w || true; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
