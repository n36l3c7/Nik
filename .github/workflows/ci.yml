name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job writes to the repository.
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pango for WeasyPrint (incident report PDF)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Run tests
        working-directory: backend
        run: pytest
      - name: Analyzer worker (lint, format, tests on recorded rizin output)
        working-directory: workers/analyzer
        run: ruff check . && ruff format --check . && python -m pytest -q tests
      - name: capa worker (lint, format, tests on a recorded capa report)
        working-directory: workers/capa
        run: ruff check . && ruff format --check . && python -m pytest -q tests
      # Their tests need LibreOffice, Chromium and tshark: they run inside the images (e2e job).
      - name: Document viewer, isolated browser and packet capture workers (lint, format)
        working-directory: workers
        run: for d in docview browser pcap; do (cd "$d" && ruff check . && ruff format --check .) || exit 1; done

  # The same suite on PostgreSQL (the default job uses SQLite): the version
  # the Compose file runs, after `alembic upgrade head`.
  backend-postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["18"]
    services:
      postgres:
        image: docker.io/library/postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: nik
          POSTGRES_PASSWORD: nik
          POSTGRES_DB: nik
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nik -d nik" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://nik:nik@127.0.0.1:5432/nik
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pango for WeasyPrint (incident report PDF)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start the analyzer worker (real rizin) on the E2E sample store
        run: |
          docker build -t nik-analyzer workers/analyzer
          mkdir -p backend/.e2e-samples
          docker run -d --name nik-analyzer -p 127.0.0.1:8700:8700 \
            -v "$PWD/backend/.e2e-samples:/samples:ro" -e ANALYZER_TOKEN=e2e-token nik-analyzer
      - name: Start the capa worker (real capa) on the E2E sample store
        run: |
          docker build -t nik-capa workers/capa
          # The worker's own tests, inside its image (with capa and the bundled rules).
          docker run --rm -v "$PWD/workers/capa/tests:/opt/nik-capa/tests:ro" -w /opt/nik-capa --entrypoint sh nik-capa \
            -c "pip install --quiet --user pytest && python -m pytest -q -p no:cacheprovider tests"
          docker run -d --name nik-capa -p 127.0.0.1:8710:8710 --read-only --tmpfs /tmp \
            -v "$PWD/backend/.e2e-samples:/samples:ro" -e CAPA_TOKEN=e2e-capa-token nik-capa
      - name: Start the document viewer, the isolated browser and the packet capture worker
        run: |
          docker build -t nik-docview workers/docview
          docker build -t nik-browser workers/browser
          docker build -t nik-pcap workers/pcap
          # The workers' own tests, inside their images.
          for w in docview browser pcap; do
            docker run --rm -v "$PWD/workers/$w/tests:/opt/nik-$w/tests:ro" -w /opt/nik-$w --entrypoint sh nik-$w \
              -c "pip install --quiet --user pytest && python -m pytest -q -p no:cacheprovider tests" || exit 1
          done
          docker run -d --name nik-docview -p 127.0.0.1:8720:8720 --read-only --tmpfs /tmp \
            -e DOCVIEW_TOKEN=e2e-docview-token nik-docview
          docker run -d --name nik-browser -p 127.0.0.1:8730:8730 --read-only --tmpfs /tmp --shm-size 256m \
            -e BROWSER_TOKEN=e2e-browser-token nik-browser
          docker run -d --name nik-pcap -p 127.0.0.1:8740:8740 --read-only --tmpfs /tmp \
            -v "$PWD/backend/.e2e-samples:/samples:ro" -e PCAP_TOKEN=e2e-pcap-token nik-pcap
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_ANALYZER_URL: http://127.0.0.1:8700
          E2E_ANALYZER_TOKEN: e2e-token
          E2E_CAPA_URL: http://127.0.0.1:8710
          E2E_CAPA_TOKEN: e2e-capa-token
          E2E_DOCVIEW_URL: http://127.0.0.1:8720
          E2E_DOCVIEW_TOKEN: e2e-docview-token
          E2E_BROWSER_URL: http://127.0.0.1:8730
          E2E_BROWSER_TOKEN: e2e-browser-token
          E2E_PCAP_URL: http://127.0.0.1:8740
          E2E_PCAP_TOKEN: e2e-pcap-token
      - name: Worker logs
        if: failure()
        run: for w in analyzer capa docview browser pcap; do docker logs nik-$w || true; done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
