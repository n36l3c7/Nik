name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Run tests
        working-directory: backend
        run: pytest
      - name: Analyzer worker (lint, format, tests on recorded rizin output)
        working-directory: analyzer
        run: ruff check . && ruff format --check . && python -m pytest -q tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the analyzer worker (real rizin) on the E2E sample store
        run: |
          docker build -t nik-analyzer analyzer
          mkdir -p backend/.e2e-samples
          docker run -d --name nik-analyzer -p 127.0.0.1:8700:8700 \
            -v "$PWD/backend/.e2e-samples:/samples:ro" -e ANALYZER_TOKEN=e2e-token nik-analyzer
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_ANALYZER_URL: http://127.0.0.1:8700
          E2E_ANALYZER_TOKEN: e2e-token
      - name: Analyzer logs
        if: failure()
        run: docker logs nik-analyzer || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
