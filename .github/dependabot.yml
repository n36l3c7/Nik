# Dependabot: pull requests that update dependencies.
#
# - Security updates (a dependency with a known CVE) come as soon as GitHub
#   learns about them; enable them in Settings → Code security → Dependabot
#   security updates.
# - Version updates come once a month, one grouped pull request per ecosystem
#   (npm, pip, Docker, Compose, GitHub Actions): at most five a month. They
#   carry minor and patch releases only: a major release (a new PostgreSQL
#   data format, Vite, ESLint, Node…) needs migration work, so it is planned
#   as its own change instead (GitHub Actions majors are still proposed).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pip:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directories: [/backend, /analyzer, /capa, /deploy]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
