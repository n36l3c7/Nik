# Nik — full stack (nginx static + FastAPI + PostgreSQL) in three containers.
#
# Works with both `docker compose` and `podman-compose` (and `podman compose`).
# Copy .env.example to .env and adjust the secrets before running in production.
#
#   docker compose up -d --build      # or: podman-compose up -d --build
#
# The app is then reachable on https://localhost:8443 (self-signed certificate
# generated on first start — the browser warning is expected) and on plain
# http://localhost:8080. See the README for using a real certificate.

services:
  db:
    image: docker.io/library/postgres:18-alpine
    # Refuses to create an empty cluster while unmigrated PostgreSQL 16 data
    # sits on the old volume (see deploy/db-entrypoint.sh and README § 2.1).
    entrypoint: ["/usr/local/bin/nik-db-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: nik
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nik}
      POSTGRES_DB: nik
      NIK_PG_UPGRADE: ${NIK_PG_UPGRADE:-}
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker.
      - db-data-18:/var/lib/postgresql
      # The PostgreSQL 16 data of releases before 2.12.2, read-only: kept for
      # a rollback after deploy/upgrade-postgres.sh, empty on a new install.
      - db-data:/var/lib/postgresql-16:ro
      - ./deploy/db-entrypoint.sh:/usr/local/bin/nik-db-entrypoint.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nik -d nik"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      # Passed as separate parts: the backend assembles the URL itself with
      # proper escaping, so DB_PASSWORD may contain %, @, : and friends.
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-nik}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret}
      # HTTP quick-start on :8080 → cookie cannot be Secure. Set to true once you
      # put the app behind HTTPS (see the README).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Malware samples: raw files on a named volume (the database holds only
      # their analysis). Exclude it from any antivirus on the host.
      SAMPLE_STORE: /app/samples
      SAMPLE_MAX_MB: ${SAMPLE_MAX_MB:-100}
      # Disassembly worker (rizin), reachable only on the internal network.
      ANALYZER_URL: http://analyzer:8700
      ANALYZER_TOKEN: ${ANALYZER_TOKEN:-please-change-this-analyzer-token}
      ANALYZER_TIMEOUT: ${ANALYZER_TIMEOUT:-600}
      # capa worker (capabilities, ATT&CK / MBC), same internal network.
      CAPA_URL: http://capa:8710
      CAPA_TOKEN: ${CAPA_TOKEN:-please-change-this-capa-token}
      CAPA_TIMEOUT: ${CAPA_TIMEOUT:-1800}
      # Mail attachment previews (documents) and the isolated browser.
      DOCVIEW_URL: http://docview:8720
      DOCVIEW_TOKEN: ${DOCVIEW_TOKEN:-please-change-this-docview-token}
      BROWSER_URL: http://browser:8730
      BROWSER_TOKEN: ${BROWSER_TOKEN:-please-change-this-browser-token}
      # Packet captures (Network Analysis), read with Wireshark's engine.
      PCAP_URL: http://pcap:8740
      PCAP_TOKEN: ${PCAP_TOKEN:-please-change-this-pcap-token}
      PCAP_MAX_MB: ${PCAP_MAX_MB:-500}
    volumes:
      - sample-store:/app/samples
    networks: [default, analysis]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Disassembles samples with rizin for the Code view. It reads the sample store
  # read-only, has no internet access (internal network), no published port, a
  # read-only filesystem and memory / CPU / time limits. Samples are read and
  # disassembled, never executed.
  analyzer:
    build: ./analyzer
    environment:
      ANALYZER_TOKEN: ${ANALYZER_TOKEN:-please-change-this-analyzer-token}
      ANALYZER_TIMEOUT: ${ANALYZER_TIMEOUT:-600}
      ANALYZER_DECOMPILE_SECONDS: ${ANALYZER_DECOMPILE_SECONDS:-300}
      ANALYZER_MAX_JOBS: ${ANALYZER_MAX_JOBS:-2}
      ANALYZER_MAX_FUNCTIONS: ${ANALYZER_MAX_FUNCTIONS:-20000}
      # Analysed sessions kept for the decompilations on demand (~1 GB each on a
      # large binary) and how long an unused one stays open, in seconds.
      ANALYZER_WARM_SESSIONS: ${ANALYZER_WARM_SESSIONS:-1}
      ANALYZER_WARM_IDLE: ${ANALYZER_WARM_IDLE:-600}
    volumes:
      - sample-store:/samples:ro
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp, /home/rizin]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${ANALYZER_MEMORY:-4g}
    cpus: ${ANALYZER_CPUS:-2}
    restart: unless-stopped

  # Runs Mandiant capa on samples for the Capabilities view, one at a time
  # (CPU-bound: minutes on large binaries). Same isolation as the analyzer:
  # read-only sample store, internal network only, no published port,
  # read-only filesystem, no capabilities, memory / CPU / time limits.
  capa:
    build: ./capa
    environment:
      CAPA_TOKEN: ${CAPA_TOKEN:-please-change-this-capa-token}
      CAPA_TIMEOUT: ${CAPA_TIMEOUT:-1800}
    volumes:
      - sample-store:/samples:ro
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${CAPA_MEMORY:-4g}
    cpus: ${CAPA_CPUS:-2}
    restart: unless-stopped

  # Turns mail attachments (PDF, Office, OpenDocument, RTF, images) into page
  # images: LibreOffice with macros disabled, then pdfium. Internal network
  # only (a document cannot call out), no published port, read-only
  # filesystem, no capabilities, memory / CPU limits.
  docview:
    build: ./docview
    environment:
      DOCVIEW_TOKEN: ${DOCVIEW_TOKEN:-please-change-this-docview-token}
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${DOCVIEW_MEMORY:-2g}
    cpus: ${DOCVIEW_CPUS:-1}
    restart: unless-stopped

  # Reads packet captures with Wireshark's engine (tshark for the summary,
  # sharkd for the packet list, protocol tree, Follow Stream and Export
  # Objects). Read-only sample store, internal network only, no published
  # port, read-only filesystem, no capabilities (it never captures),
  # memory / CPU limits.
  pcap:
    build: ./pcap
    environment:
      PCAP_TOKEN: ${PCAP_TOKEN:-please-change-this-pcap-token}
    volumes:
      - sample-store:/samples:ro
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${PCAP_MEMORY:-4g}
    cpus: ${PCAP_CPUS:-2}
    restart: unless-stopped

  # Isolated browser: opens HTML attachments and links in Chromium and sends
  # back screenshots; the analyst's clicks and typing are replayed here. The
  # only worker with a route to the internet (browser-egress), used only by
  # sessions the analyst opens with network; the worker itself refuses
  # requests to private addresses and internal names. Read-only filesystem,
  # no capabilities, memory / CPU limits, no published port.
  browser:
    build: ./browser
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-please-change-this-browser-token}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-3}
    networks: [analysis, browser-egress]
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${BROWSER_MEMORY:-2g}
    cpus: ${BROWSER_CPUS:-2}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      # Name users type in the browser; goes into the self-signed certificate.
      TLS_HOSTNAME: ${TLS_HOSTNAME:-localhost}
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_TLS_PORT:-8443}:443"
    volumes:
      # Keeps the auto-generated certificate across container recreations.
      # Mount your own nik.crt / nik.key here to use a real certificate.
      - web-certs:/etc/nginx/certs
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data-18:
  # PostgreSQL 16 data (releases before 2.12.2). After the upgrade, remove it
  # with `podman volume rm <project>_db-data` once you no longer need a rollback.
  db-data:
  sample-store:
  web-certs:

networks:
  default:
  # Backend ↔ analysis workers only; `internal` gives them no route outside.
  analysis:
    internal: true
  # The isolated browser's way out (no other service is on it).
  browser-egress:
