# Nik — the full stack: nginx (static app + reverse proxy), the FastAPI
# backend, PostgreSQL with the service that takes its base backups, the
# automation worker with its script sandbox and the five analysis workers.
#
# Works with both `docker compose` and `podman-compose` (and `podman compose`).
#
#   deploy/init-env.sh                # writes .env and the secrets, each a fresh random value
#   docker compose up -d --build      # or: podman-compose up -d --build
#
# Where the secrets are. Each one reaches a container as a file under
# /run/secrets, named to the process by <NAME>_FILE, and only the containers
# that use it are given it. The files are in the directory NIK_SECRETS_DIR of
# .env names (deploy/init-env.sh makes ./secrets on a new install): a secret
# is then not in the environment of a container, where `inspect` shows it and
# every process inherits it. A server that keeps its secrets in .env (every
# install from before 6.8, until deploy/secrets.sh move is run) leaves
# NIK_SECRETS_DIR unset: the empty files of deploy/no-secrets are mounted in
# their place, an empty file counts as none, and the variables below carry the
# values as before. A secret given in both places is refused.
#
# The files are mounted one by one as volumes with the option z (the SELinux
# label a container needs to read them), which docker compose and podman
# compose both understand; `secrets:` of Compose would mount the same files
# without that label under podman.
#
# The stack does not start without its secrets (the variables marked `?`
# below must at least be named in .env, empty when the value is in a file)
# and refuses the example values. The app is then reachable on
# https://localhost:8443 (self-signed certificate generated on first start —
# the browser warning is expected); http://localhost:8080 only redirects
# there. See the README for using a real certificate.

# Container logs are rotated: an unbounded log fills the disk of a server that
# stays up for months.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"

services:
  db:
    image: docker.io/library/postgres:18-alpine
    # Refuses to create an empty cluster while the PostgreSQL 16 data of a release
    # before 2.12.2 sits on the old volume (see deploy/db-entrypoint.sh).
    entrypoint: ["/usr/local/bin/nik-db-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: nik
      # Read by the entrypoint from the file when it holds the password, and only to create
      # the database the first time: a database that exists is started without it.
      POSTGRES_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is not set, run deploy/init-env.sh}
      DB_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: nik
      # The archive of the write-ahead log (deploy/db-entrypoint.sh turns it on): what brings the
      # database back to any moment, and what a standby replays. `off` keeps no archive. A
      # segment is closed at least every NIK_ARCHIVE_TIMEOUT seconds while something is written:
      # the most that is lost when this host dies and its last segments had not left it.
      NIK_WAL_ARCHIVE: ${NIK_WAL_ARCHIVE:-on}
      NIK_ARCHIVE_TIMEOUT: ${NIK_ARCHIVE_TIMEOUT:-300}
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker.
      - db-data-18:/var/lib/postgresql
      # The PostgreSQL 16 data of releases before 2.12.2, read-only: only looked at,
      # so that no empty database is made beside it. Empty on a new install.
      - db-data:/var/lib/postgresql-16:ro
      - ./deploy/db-entrypoint.sh:/usr/local/bin/nik-db-entrypoint.sh:ro,z
      # The scripts PostgreSQL archives and restores its log with (deploy/db).
      - ./deploy/db:/usr/local/lib/nik:ro,z
      # The archive: the segments of the log and the base backups, as PostgreSQL wrote them.
      - ${NIK_WAL_ARCHIVE_DIR:-wal-archive}:/wal-archive
      # The socket of PostgreSQL, shared with the `recovery` service and nothing else.
      - db-socket:/var/run/postgresql
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/db_password:/run/secrets/db_password:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nik -d nik"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Asked to stop, PostgreSQL ends its connections, writes a checkpoint and hands the last
    # segment of its log to the archive before it exits (a fast shutdown: the image stops it
    # with SIGINT). On a busy database the checkpoint takes more than the ten seconds an engine
    # waits by default; killed before the end, nothing is lost, but the next start replays the
    # log and the last segment reaches the archive only then.
    stop_grace_period: 60s
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # The tools of PostgreSQL, run for the backend (deploy/db/recovery-agent.sh):
  # the image of the database with another command. It takes the base backups,
  # proves the archive by replaying it into a scratch server of its own, and
  # removes what the retention no longer keeps, each when the backend leaves a
  # request for it in the archive volume. It has no network at all: it reaches
  # the database through its socket, on a volume the two share, so it holds no
  # password. It does not mount the data directory of the database. Read-only
  # filesystem, no capabilities, the user of PostgreSQL from the start.
  recovery:
    image: docker.io/library/postgres:18-alpine
    entrypoint: ["sh", "/usr/local/lib/nik/recovery-agent.sh"]
    user: postgres
    environment:
      POSTGRES_USER: nik
      POSTGRES_DB: nik
    volumes:
      - ./deploy/db:/usr/local/lib/nik:ro,z
      - ${NIK_WAL_ARCHIVE_DIR:-wal-archive}:/wal-archive
      - db-socket:/var/run/postgresql
    network_mode: none
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${RECOVERY_MEMORY:-1g}
    # Asked to stop in the middle of a base backup or of a recovery test, it ends the tool, stops
    # its scratch server, removes what was half written and exits; the request is done again
    # when it is back.
    stop_grace_period: 30s
    cpus: ${RECOVERY_CPUS:-2}
    pids_limit: 256
    logging: *logging
    restart: unless-stopped

  # The backend. It parses evidence that may be hostile, so it runs as an
  # unprivileged user on a read-only filesystem, with no capabilities beyond
  # the three its entrypoint needs to hand an old sample store to that user
  # and step down from root, and with memory, CPU and process limits.
  api:
    build: ./backend
    environment:
      # Passed as separate parts: the backend assembles the URL itself with
      # proper escaping, so DB_PASSWORD may contain %, @, : and friends.
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is not set, run deploy/init-env.sh}
      DB_PASSWORD_FILE: /run/secrets/db_password
      # Encrypts the secrets stored in the database: keep it with the backups.
      # SECRET_KEY_PREVIOUS (the old value) is kept while it is being changed:
      # deploy/secrets.sh rotate secret-key does the whole change.
      SECRET_KEY: ${SECRET_KEY?SECRET_KEY is not set, run deploy/init-env.sh}
      SECRET_KEY_FILE: /run/secrets/secret_key
      SECRET_KEY_PREVIOUS: ${SECRET_KEY_PREVIOUS:-}
      SECRET_KEY_PREVIOUS_FILE: /run/secrets/secret_key_previous
      # Seals every file of the store. It is in no database and no backup holds it:
      # keep a copy away from the server. Without it the server stays up and says so
      # instead of starting. Only this container is given it.
      STORE_KEY: ${STORE_KEY:-}
      STORE_KEY_FILE: /run/secrets/store_key
      STORE_KEY_PREVIOUS: ${STORE_KEY_PREVIOUS:-}
      STORE_KEY_PREVIOUS_FILE: /run/secrets/store_key_previous
      # Signs every entry of the audit log (the same key in this container and in the other
      # one that writes entries). Without it the key derived from SECRET_KEY signs.
      # deploy/secrets.sh rotate audit-key sets or changes it; the earlier keys stay in
      # AUDIT_KEY_PREVIOUS so that the entries they signed can still be checked.
      AUDIT_KEY: ${AUDIT_KEY:-}
      AUDIT_KEY_FILE: /run/secrets/audit_key
      AUDIT_KEY_PREVIOUS: ${AUDIT_KEY_PREVIOUS:-}
      AUDIT_KEY_PREVIOUS_FILE: /run/secrets/audit_key_previous
      # How fast a store from before 6.8 is sealed, in megabytes a second (0: as fast as the disk).
      STORE_SEAL_MBPS: ${STORE_SEAL_MBPS:-40}
      # The app is served over HTTPS only, so the session cookie is Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # The client address is the one the web container writes in
      # X-Forwarded-For, believed from that container only: the backend checks
      # itself who the connection comes from (TRUSTED_PROXIES: host names,
      # addresses or networks), so gunicorn must not rewrite addresses for
      # whoever sends the header (FORWARDED_ALLOW_IPS stays empty). The waits
      # after failed sign-ins and the administrators' networks go by it.
      FORWARDED_ALLOW_IPS: ""
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-web}
      # Optional bearer token for /api/metrics (reached through nginx like the
      # rest of /api; the route answers to a token only).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # The store of files: a named volume, every file sealed under STORE_KEY (the
      # database holds only their analysis). No other container mounts it.
      SAMPLE_STORE: /app/samples
      SAMPLE_MAX_MB: ${SAMPLE_MAX_MB:-100}
      # Largest evidence file (browser database, event log, tool output).
      ARTIFACT_MAX_MB: ${ARTIFACT_MAX_MB:-500}
      # Disassembly worker (rizin), reachable only on the internal network.
      ANALYZER_URL: http://analyzer:8700
      ANALYZER_TOKEN: ${ANALYZER_TOKEN?ANALYZER_TOKEN is not set, run deploy/init-env.sh}
      ANALYZER_TOKEN_FILE: /run/secrets/analyzer_token
      ANALYZER_TIMEOUT: ${ANALYZER_TIMEOUT:-600}
      # capa worker (capabilities, ATT&CK / MBC), same internal network.
      CAPA_URL: http://capa:8710
      CAPA_TOKEN: ${CAPA_TOKEN?CAPA_TOKEN is not set, run deploy/init-env.sh}
      CAPA_TOKEN_FILE: /run/secrets/capa_token
      CAPA_TIMEOUT: ${CAPA_TIMEOUT:-1800}
      # Mail attachment previews (documents) and the isolated browser.
      DOCVIEW_URL: http://docview:8720
      DOCVIEW_TOKEN: ${DOCVIEW_TOKEN?DOCVIEW_TOKEN is not set, run deploy/init-env.sh}
      DOCVIEW_TOKEN_FILE: /run/secrets/docview_token
      BROWSER_URL: http://browser:8730
      BROWSER_TOKEN: ${BROWSER_TOKEN?BROWSER_TOKEN is not set, run deploy/init-env.sh}
      BROWSER_TOKEN_FILE: /run/secrets/browser_token
      # Packet captures (Network Analysis), read with Wireshark's engine.
      PCAP_URL: http://pcap:8740
      PCAP_TOKEN: ${PCAP_TOKEN?PCAP_TOKEN is not set, run deploy/init-env.sh}
      PCAP_TOKEN_FILE: /run/secrets/pcap_token
      PCAP_MAX_MB: ${PCAP_MAX_MB:-500}
      # Host evidence (7.0): the worker that reads the originals, and the largest file and
      # collection sent in parts.
      FORENSICS_URL: http://forensics:8760
      FORENSICS_TOKEN: ${FORENSICS_TOKEN?FORENSICS_TOKEN is not set, run deploy/init-env.sh}
      FORENSICS_TOKEN_FILE: /run/secrets/forensics_token
      EVIDENCE_MAX_MB: ${EVIDENCE_MAX_MB:-8192}
      COLLECTION_MAX_MB: ${COLLECTION_MAX_MB:-20480}
      # Mailboxes (mbox, Maildir archive) and Outlook PST files, read as many e-mails.
      MAILBOX_MAX_MB: ${MAILBOX_MAX_MB:-2048}
      PST_MAX_MB: ${PST_MAX_MB:-4096}
      # Playbooks run in the `automation` container; `off` records no event and runs nothing.
      AUTOMATION_WORKER: ${AUTOMATION_WORKER:-container}
      AUTOMATION_MAX_ACTIVE_RUNS: ${AUTOMATION_MAX_ACTIVE_RUNS:-200}
      # The script sandbox: the backend reaches it to run the test of a script being written.
      SANDBOX_URL: http://sandbox:8750
      SANDBOX_TOKEN: ${SANDBOX_TOKEN?SANDBOX_TOKEN is not set, run deploy/init-env.sh}
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox_token
      SANDBOX_TIMEOUT: ${SANDBOX_TIMEOUT:-10}
      SANDBOX_MAX_TIMEOUT: ${SANDBOX_MAX_TIMEOUT:-60}
      # Content packs. Where the catalogue is read from (set it empty for a Nik with no catalogue:
      # packs then come as files), and a folder of packs installed at start, which you mount
      # here yourself (a Compose override with a read-only volume).
      NIK_PACKS_CATALOGUE: ${NIK_PACKS_CATALOGUE-https://github.com/n36l3c7/Nik/releases/download/packs/index.json}
      NIK_PACKS_DIR: ${NIK_PACKS_DIR:-}
      # Backups: written here by the server, each one encrypted (Settings → Backup). Before a
      # release changes the database a snapshot goes here too, and its migrations are tried on
      # a copy first; `false` skips that rehearsal (never the snapshot) on a very large database.
      BACKUP_DIR: /app/backups
      NIK_UPGRADE_REHEARSAL: ${NIK_UPGRADE_REHEARSAL:-true}
      # Recovery to a moment (Settings → Backup): the archive of the log of PostgreSQL, as this
      # container sees it. It asks the `recovery` service for the base backups there, and a
      # deleted file of the store is kept for as long as a recovery could go back to it.
      WAL_ARCHIVE_DIR: /app/wal-archive
      NIK_ARCHIVE_TIMEOUT: ${NIK_ARCHIVE_TIMEOUT:-300}
      # A standby (deploy/standby.sh): the directory of this host the first one sends its copies
      # to. NIK_SERVER_NAME is what this server calls itself to the other host of a pair.
      STANDBY_INBOX: /app/inbox
      NIK_SERVER_NAME: ${NIK_SERVER_NAME:-${TLS_HOSTNAME:-}}
      # A copy of another server, to try a release on (docs/admin/try-a-release.md): it reaches
      # nothing outside itself. Set by deploy/restore.sh --as-copy.
      NIK_COPY: ${NIK_COPY:-false}
      NIK_COPY_OF: ${NIK_COPY_OF:-}
    volumes:
      - sample-store:/app/samples
      - ${NIK_WAL_ARCHIVE_DIR:-wal-archive}:/app/wal-archive
      - ${NIK_STANDBY_INBOX:-./deploy/no-inbox}:/app/inbox:z
      # The volume `backups`, or a directory of the host when NIK_BACKUP_DIR names one
      # (another disk than the data: /srv/nik-backups).
      - ${NIK_BACKUP_DIR:-backups}:/app/backups
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/db_password:/run/secrets/db_password:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/secret_key:/run/secrets/secret_key:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/secret_key_previous:/run/secrets/secret_key_previous:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/store_key:/run/secrets/store_key:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/store_key_previous:/run/secrets/store_key_previous:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/audit_key:/run/secrets/audit_key:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/audit_key_previous:/run/secrets/audit_key_previous:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/metrics_token:/run/secrets/metrics_token:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/analyzer_token:/run/secrets/analyzer_token:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/capa_token:/run/secrets/capa_token:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/docview_token:/run/secrets/docview_token:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/browser_token:/run/secrets/browser_token:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/pcap_token:/run/secrets/pcap_token:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/sandbox_token:/run/secrets/sandbox_token:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/forensics_token:/run/secrets/forensics_token:ro,z
    networks: [default, analysis, browser-control, automation-internal]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${API_MEMORY:-4g}
    # Asked to stop, the server takes no new request and gives the ones in flight 20 s
    # (API_STOP_GRACE), hands back the work and the leases it holds, and exits; gunicorn
    # waits 30 s for that, and the engine this long before it kills the container.
    stop_grace_period: 40s
    cpus: ${API_CPUS:-4}
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      # Migrations run before the server answers.
      start_period: 120s
    logging: *logging
    restart: unless-stopped

  # Runs the playbooks (backend/app/automation): the backend's image with another
  # command. It reads the database as the backend does and serves nothing. It is
  # the only container a playbook reaches the outside from (automation-egress):
  # the backend is not on that network. It runs unprivileged from the start, on
  # a read-only filesystem. It is the container with a way out, so it is given
  # neither the store of files nor its key: a step that needs a file asks the
  # backend for it (backend/app/store_handover.py). It also sends the copy of
  # each backup off the server, for the same reason.
  automation:
    build: ./backend
    command: ["python", "-m", "app.automation.worker"]
    user: "10001:10001"
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is not set, run deploy/init-env.sh}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRET_KEY: ${SECRET_KEY?SECRET_KEY is not set, run deploy/init-env.sh}
      SECRET_KEY_FILE: /run/secrets/secret_key
      SECRET_KEY_PREVIOUS: ${SECRET_KEY_PREVIOUS:-}
      SECRET_KEY_PREVIOUS_FILE: /run/secrets/secret_key_previous
      # This container writes entries of the audit log too (playbooks, the forwarding): it signs
      # them with the same key as the backend.
      AUDIT_KEY: ${AUDIT_KEY:-}
      AUDIT_KEY_FILE: /run/secrets/audit_key
      AUDIT_KEY_PREVIOUS: ${AUDIT_KEY_PREVIOUS:-}
      AUDIT_KEY_PREVIOUS_FILE: /run/secrets/audit_key_previous
      # The backend applies the migrations; this container waits for it and applies none.
      NIK_SKIP_MIGRATIONS: "1"
      # No store key here, and no store: files are asked of the backend.
      NIK_NO_STORE_KEY: "1"
      NIK_STORE_API_URL: http://api:8000
      # The script sandbox, on its own internal network.
      SANDBOX_URL: http://sandbox:8750
      SANDBOX_TOKEN: ${SANDBOX_TOKEN?SANDBOX_TOKEN is not set, run deploy/init-env.sh}
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox_token
      SANDBOX_TIMEOUT: ${SANDBOX_TIMEOUT:-10}
      SANDBOX_MAX_TIMEOUT: ${SANDBOX_MAX_TIMEOUT:-60}
      # How many steps run side by side, how many runs may be in progress at
      # once on the server, how many finished runs each playbook keeps.
      AUTOMATION_CONCURRENCY: ${AUTOMATION_CONCURRENCY:-4}
      AUTOMATION_MAX_ACTIVE_RUNS: ${AUTOMATION_MAX_ACTIVE_RUNS:-200}
      AUTOMATION_RUNS_KEPT: ${AUTOMATION_RUNS_KEPT:-500}
      # A proxy for what playbooks send outside, when the server has no direct way out.
      HTTPS_PROXY: ${AUTOMATION_HTTPS_PROXY:-}
      NO_PROXY: ${AUTOMATION_NO_PROXY:-}
      BACKUP_DIR: /app/backups
      # The archive of the log, read-only: this container seals each segment and each base
      # backup and sends them to the second host. The files of the store it sends are asked of
      # the backend one by one, sealed as they are on the disk.
      WAL_ARCHIVE_DIR: /app/wal-archive
      NIK_ARCHIVE_TIMEOUT: ${NIK_ARCHIVE_TIMEOUT:-300}
      NIK_SERVER_NAME: ${NIK_SERVER_NAME:-${TLS_HOSTNAME:-}}
      # The way out of this container is shut on a copy of another server (core/copy.py).
      NIK_COPY: ${NIK_COPY:-false}
      NIK_COPY_OF: ${NIK_COPY_OF:-}
    volumes:
      # Read-only: this container sends the copy of each backup off the server (it is the one
      # with a way out) and never writes one.
      - ${NIK_BACKUP_DIR:-backups}:/app/backups:ro
      - ${NIK_WAL_ARCHIVE_DIR:-wal-archive}:/app/wal-archive:ro
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/db_password:/run/secrets/db_password:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/secret_key:/run/secrets/secret_key:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/secret_key_previous:/run/secrets/secret_key_previous:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/audit_key:/run/secrets/audit_key:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/audit_key_previous:/run/secrets/audit_key_previous:ro,z
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/sandbox_token:/run/secrets/sandbox_token:ro,z
    networks: [default, automation-egress, automation-internal]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${AUTOMATION_MEMORY:-1g}
    # Asked to stop, the worker claims nothing more and gives the steps in flight 25 s to
    # finish; what is not over then is taken back by the worker that starts next.
    stop_grace_period: 35s
    cpus: ${AUTOMATION_CPUS:-2}
    pids_limit: 256
    logging: *logging
    restart: unless-stopped

  # Runs the Python scripts of playbooks (workers/sandbox): each in a process of
  # its own under CPU, memory and time limits. The image holds Python and
  # nothing else. Its only network is an internal one with no route outside,
  # shared with the automation worker and the backend; it has a read-only
  # filesystem, no capabilities, and reads no volume: a script computes on the
  # arguments it is given and can reach nothing.
  sandbox:
    build: ./workers/sandbox
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN?SANDBOX_TOKEN is not set, run deploy/init-env.sh}
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox_token
      SANDBOX_TIMEOUT: ${SANDBOX_TIMEOUT:-10}
      SANDBOX_MAX_TIMEOUT: ${SANDBOX_MAX_TIMEOUT:-60}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-256}
    volumes:
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/sandbox_token:/run/secrets/sandbox_token:ro,z
    networks: [automation-internal]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${SANDBOX_MEMORY:-512m}
    # A script runs for seconds: the ones in flight finish.
    stop_grace_period: 20s
    cpus: ${SANDBOX_CPUS:-1}
    pids_limit: 64
    logging: *logging
    restart: unless-stopped

  # Disassembles samples with rizin for the Code view. It does not see the store
  # of files, which is sealed: the backend gives it the sample a job needs, and
  # it keeps it in /tmp (memory) while it is used. No internet access (internal
  # network), no published port, a read-only filesystem and memory / CPU / time
  # limits. Samples are read and disassembled, never executed.
  analyzer:
    build: ./workers/analyzer
    environment:
      ANALYZER_TOKEN: ${ANALYZER_TOKEN?ANALYZER_TOKEN is not set, run deploy/init-env.sh}
      ANALYZER_TOKEN_FILE: /run/secrets/analyzer_token
      ANALYZER_TIMEOUT: ${ANALYZER_TIMEOUT:-600}
      ANALYZER_DECOMPILE_SECONDS: ${ANALYZER_DECOMPILE_SECONDS:-300}
      ANALYZER_MAX_JOBS: ${ANALYZER_MAX_JOBS:-2}
      ANALYZER_MAX_FUNCTIONS: ${ANALYZER_MAX_FUNCTIONS:-20000}
      # Analysed sessions kept for the decompilations on demand (~1 GB each on a
      # large binary) and how long an unused one stays open, in seconds.
      ANALYZER_WARM_SESSIONS: ${ANALYZER_WARM_SESSIONS:-1}
      ANALYZER_WARM_IDLE: ${ANALYZER_WARM_IDLE:-600}
    volumes:
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/analyzer_token:/run/secrets/analyzer_token:ro,z
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp, /home/rizin]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${ANALYZER_MEMORY:-4g}
    # The analyses in flight get 20 s to finish (ANALYZER_STOP_GRACE); one that is cut is handed out again.
    stop_grace_period: 30s
    cpus: ${ANALYZER_CPUS:-2}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # Runs Mandiant capa on samples for the Capabilities view, one at a time
  # (CPU-bound: minutes on large binaries). Same isolation as the analyzer:
  # given the sample for the time of one analysis (in /tmp, memory), internal
  # network only, no published port, read-only filesystem, no capabilities,
  # memory / CPU / time limits.
  capa:
    build: ./workers/capa
    environment:
      CAPA_TOKEN: ${CAPA_TOKEN?CAPA_TOKEN is not set, run deploy/init-env.sh}
      CAPA_TOKEN_FILE: /run/secrets/capa_token
      CAPA_TIMEOUT: ${CAPA_TIMEOUT:-1800}
    volumes:
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/capa_token:/run/secrets/capa_token:ro,z
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${CAPA_MEMORY:-4g}
    # The analysis in flight gets 20 s to finish (CAPA_STOP_GRACE); one that is cut is handed out again.
    stop_grace_period: 30s
    cpus: ${CAPA_CPUS:-2}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # Turns mail attachments (PDF, Office, OpenDocument, RTF, images) into page
  # images: LibreOffice with macros disabled, then pdfium. Internal network
  # only (a document cannot call out), no published port, read-only
  # filesystem, no capabilities, memory / CPU limits.
  docview:
    build: ./workers/docview
    environment:
      DOCVIEW_TOKEN: ${DOCVIEW_TOKEN?DOCVIEW_TOKEN is not set, run deploy/init-env.sh}
      DOCVIEW_TOKEN_FILE: /run/secrets/docview_token
      # A PST is converted here, on the `pst-work` volume (a disk, not memory): the worker checks
      # that it has room for the file and its mbox before it starts, and empties it afterwards.
      DOCVIEW_PST_MAX_MB: ${PST_MAX_MB:-4096}
    volumes:
      - pst-work:/work
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/docview_token:/run/secrets/docview_token:ro,z
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${DOCVIEW_MEMORY:-2g}
    # The conversions in flight get 20 s to finish (DOCVIEW_STOP_GRACE); one that is cut is handed out again.
    stop_grace_period: 30s
    cpus: ${DOCVIEW_CPUS:-1}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # Reads packet captures with Wireshark's engine (tshark for the summary,
  # sharkd for the packet list, protocol tree, Follow Stream and Export
  # Objects). It does not see the store of files: the backend gives it the
  # capture it reads. A small one stays in /tmp (memory); a larger one goes to
  # the `pcap-work` volume, in clear, until its session is closed or idle, and
  # the volume is emptied when the worker starts. Internal network only, no
  # published port, read-only filesystem, no capabilities (it never captures),
  # memory / CPU limits.
  pcap:
    build: ./workers/pcap
    environment:
      PCAP_TOKEN: ${PCAP_TOKEN?PCAP_TOKEN is not set, run deploy/init-env.sh}
      PCAP_TOKEN_FILE: /run/secrets/pcap_token
      # A capture of this size or less never touches a disk in the worker.
      PCAP_MEMORY_FILE_MB: ${PCAP_MEMORY_FILE_MB:-64}
    volumes:
      - pcap-work:/work
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/pcap_token:/run/secrets/pcap_token:ro,z
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${PCAP_MEMORY:-4g}
    # The analyses in flight get 20 s to finish (PCAP_STOP_GRACE); one that is cut is handed out again.
    stop_grace_period: 30s
    cpus: ${PCAP_CPUS:-2}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # Forensics worker (7.0): reads the files of host evidence (event logs,
  # registry hives, browser databases, command histories, a $MFT) and says, for
  # each, what it read and what it could not. It is sent the original it reads
  # (the store of files is sealed and it does not see it) and keeps it on the
  # `forensics-work` volume, in clear, until nobody asked for it for a quarter
  # of an hour, and at the latest until it starts again. Every file is read in a
  # process of its own with bounded memory and CPU time, so a file made to crash
  # a parser ends that process and not the worker. No route out: the internal
  # analysis network only, read-only filesystem, no capabilities.
  forensics:
    build: ./workers/forensics
    environment:
      FORENSICS_TOKEN: ${FORENSICS_TOKEN?FORENSICS_TOKEN is not set, run deploy/init-env.sh}
      FORENSICS_TOKEN_FILE: /run/secrets/forensics_token
      FORENSICS_MAX_JOBS: ${FORENSICS_MAX_JOBS:-2}
      FORENSICS_JOB_MEMORY_MB: ${FORENSICS_JOB_MEMORY_MB:-1536}
      # The bound on a collection (a zip of a triage): the same value as the API's COLLECTION_MAX_MB.
      FORENSICS_COLLECTION_MB: ${COLLECTION_MAX_MB:-20480}
    volumes:
      - forensics-work:/work
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/forensics_token:/run/secrets/forensics_token:ro,z
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${FORENSICS_MEMORY:-4g}
    # The files being read get 20 s to finish (FORENSICS_STOP_GRACE); one that is cut is read again.
    stop_grace_period: 30s
    cpus: ${FORENSICS_CPUS:-2}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # Isolated browser: opens HTML attachments and links in Chromium and sends
  # back screenshots; the analyst's clicks and typing are replayed here. The
  # only worker with a route to the internet (browser-egress), used only by
  # sessions the analyst opens with network. Chromium's sole route is the
  # worker's own filtering proxy, which resolves each name itself and refuses
  # private addresses and internal names for every connection, redirects
  # included. The backend reaches it on a network of its own
  # (browser-control): it shares none with the other workers, so the one
  # container that runs hostile pages cannot talk to them. Read-only
  # filesystem, no capabilities, memory / CPU limits, no published port.
  browser:
    build: ./workers/browser
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN?BROWSER_TOKEN is not set, run deploy/init-env.sh}
      BROWSER_TOKEN_FILE: /run/secrets/browser_token
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-3}
    volumes:
      - ${NIK_SECRETS_DIR:-./deploy/no-secrets}/browser_token:/run/secrets/browser_token:ro,z
    networks: [browser-control, browser-egress]
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${BROWSER_MEMORY:-2g}
    # Its sessions end with it: a scan that was cut visits again.
    stop_grace_period: 20s
    cpus: ${BROWSER_CPUS:-2}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      # Name users type in the browser; goes into the self-signed certificate.
      TLS_HOSTNAME: ${TLS_HOSTNAME:-localhost}
      # The HTTPS port as published below: plain HTTP redirects to it.
      TLS_PORT: ${WEB_TLS_PORT:-8443}
    ports:
      # Plain HTTP: answers only with a redirect to HTTPS.
      - "${WEB_PORT:-8080}:80"
      - "${WEB_TLS_PORT:-8443}:443"
    volumes:
      # Keeps the auto-generated certificate across container recreations.
      # Mount your own nik.crt / nik.key here to use a real certificate.
      - web-certs:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    # nginx binds 80/443 and steps down to its own user.
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${WEB_MEMORY:-512m}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging: *logging
    restart: unless-stopped

volumes:
  db-data-18:
  # The archive of the log of PostgreSQL and its base backups (in clear, like the data
  # directory): what deploy/restore.sh --to recovers from. NIK_WAL_ARCHIVE_DIR names a
  # directory of the host instead (another disk than the data).
  wal-archive:
  # The socket of PostgreSQL, for the `recovery` service.
  db-socket:
  # PostgreSQL 16 data (releases before 2.12.2), moved to PostgreSQL 18 by a release up to
  # 6.9.0. Remove it with `podman volume rm <project>_db-data` once you no longer need it.
  db-data:
  sample-store:
  # The backups the server takes (unused when NIK_BACKUP_DIR names a directory of the host).
  backups:
  # Where the document worker converts a PST: holds a file only while one is being converted.
  pst-work:
  # Where the packet capture worker keeps a capture too large for memory, while it reads it.
  pcap-work:
  # The originals the forensics worker is reading, in clear while it reads them.
  forensics-work:
  web-certs:

networks:
  default:
  # Backend ↔ analysis workers only; `internal` gives them no route outside.
  analysis:
    internal: true
  # Backend ↔ isolated browser only, no route outside.
  browser-control:
    internal: true
  # The isolated browser's way out (no other service is on it).
  browser-egress:
  # The way out of what playbooks send (the automation container only).
  automation-egress:
  # Automation worker and backend ↔ script sandbox only, no route outside.
  automation-internal:
    internal: true
