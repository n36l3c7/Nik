# Nik — the full stack: nginx (static app + reverse proxy), the FastAPI
# backend, PostgreSQL and the five analysis workers.
#
# Works with both `docker compose` and `podman-compose` (and `podman compose`).
#
#   deploy/init-env.sh                # writes .env with fresh random secrets
#   docker compose up -d --build      # or: podman-compose up -d --build
#
# The stack does not start without its secrets (the variables marked `:?`
# below) and refuses the example values. The app is then reachable on
# https://localhost:8443 (self-signed certificate generated on first start —
# the browser warning is expected); http://localhost:8080 only redirects
# there. See the README for using a real certificate.

# Container logs are rotated: an unbounded log fills the disk of a server that
# stays up for months.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"

services:
  db:
    image: docker.io/library/postgres:18-alpine
    # Refuses to create an empty cluster while unmigrated PostgreSQL 16 data
    # sits on the old volume (see deploy/db-entrypoint.sh and the deployment guide).
    entrypoint: ["/usr/local/bin/nik-db-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: nik
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, run deploy/init-env.sh}
      POSTGRES_DB: nik
      NIK_PG_UPGRADE: ${NIK_PG_UPGRADE:-}
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker.
      - db-data-18:/var/lib/postgresql
      # The PostgreSQL 16 data of releases before 2.12.2, read-only: kept for
      # a rollback after deploy/upgrade-postgres.sh, empty on a new install.
      - db-data:/var/lib/postgresql-16:ro
      - ./deploy/db-entrypoint.sh:/usr/local/bin/nik-db-entrypoint.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nik -d nik"]
      interval: 5s
      timeout: 3s
      retries: 12
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # The backend. It parses evidence that may be hostile, so it runs as an
  # unprivileged user on a read-only filesystem, with no capabilities beyond
  # the three its entrypoint needs to hand an old sample store to that user
  # and step down from root, and with memory, CPU and process limits.
  api:
    build: ./backend
    environment:
      # Passed as separate parts: the backend assembles the URL itself with
      # proper escaping, so DB_PASSWORD may contain %, @, : and friends.
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, run deploy/init-env.sh}
      # Encrypts the provider API keys and TLS key logs stored in the database:
      # keep it with the backups. SECRET_KEY_PREVIOUS (the old value, for one
      # start) lets it be changed without losing them.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set, run deploy/init-env.sh}
      SECRET_KEY_PREVIOUS: ${SECRET_KEY_PREVIOUS:-}
      # The app is served over HTTPS only, so the session cookie is Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # The client address comes from nginx (X-Forwarded-For), the only thing
      # that reaches this port: rate limits and lock-outs are per client.
      FORWARDED_ALLOW_IPS: "*"
      # Optional bearer token for /api/metrics (never published by nginx).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Malware samples: raw files on a named volume (the database holds only
      # their analysis). Exclude it from any antivirus on the host.
      SAMPLE_STORE: /app/samples
      SAMPLE_MAX_MB: ${SAMPLE_MAX_MB:-100}
      # Largest evidence file (browser database, event log, tool output).
      ARTIFACT_MAX_MB: ${ARTIFACT_MAX_MB:-500}
      # Disassembly worker (rizin), reachable only on the internal network.
      ANALYZER_URL: http://analyzer:8700
      ANALYZER_TOKEN: ${ANALYZER_TOKEN:?ANALYZER_TOKEN is not set, run deploy/init-env.sh}
      ANALYZER_TIMEOUT: ${ANALYZER_TIMEOUT:-600}
      # capa worker (capabilities, ATT&CK / MBC), same internal network.
      CAPA_URL: http://capa:8710
      CAPA_TOKEN: ${CAPA_TOKEN:?CAPA_TOKEN is not set, run deploy/init-env.sh}
      CAPA_TIMEOUT: ${CAPA_TIMEOUT:-1800}
      # Mail attachment previews (documents) and the isolated browser.
      DOCVIEW_URL: http://docview:8720
      DOCVIEW_TOKEN: ${DOCVIEW_TOKEN:?DOCVIEW_TOKEN is not set, run deploy/init-env.sh}
      BROWSER_URL: http://browser:8730
      BROWSER_TOKEN: ${BROWSER_TOKEN:?BROWSER_TOKEN is not set, run deploy/init-env.sh}
      # Packet captures (Network Analysis), read with Wireshark's engine.
      PCAP_URL: http://pcap:8740
      PCAP_TOKEN: ${PCAP_TOKEN:?PCAP_TOKEN is not set, run deploy/init-env.sh}
      PCAP_MAX_MB: ${PCAP_MAX_MB:-500}
    volumes:
      - sample-store:/app/samples
    networks: [default, analysis, browser-control]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${API_MEMORY:-4g}
    cpus: ${API_CPUS:-4}
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      # Migrations run before the server answers.
      start_period: 120s
    logging: *logging
    restart: unless-stopped

  # Disassembles samples with rizin for the Code view. It reads the sample store
  # read-only, has no internet access (internal network), no published port, a
  # read-only filesystem and memory / CPU / time limits. Samples are read and
  # disassembled, never executed.
  analyzer:
    build: ./workers/analyzer
    environment:
      ANALYZER_TOKEN: ${ANALYZER_TOKEN:?ANALYZER_TOKEN is not set, run deploy/init-env.sh}
      ANALYZER_TIMEOUT: ${ANALYZER_TIMEOUT:-600}
      ANALYZER_DECOMPILE_SECONDS: ${ANALYZER_DECOMPILE_SECONDS:-300}
      ANALYZER_MAX_JOBS: ${ANALYZER_MAX_JOBS:-2}
      ANALYZER_MAX_FUNCTIONS: ${ANALYZER_MAX_FUNCTIONS:-20000}
      # Analysed sessions kept for the decompilations on demand (~1 GB each on a
      # large binary) and how long an unused one stays open, in seconds.
      ANALYZER_WARM_SESSIONS: ${ANALYZER_WARM_SESSIONS:-1}
      ANALYZER_WARM_IDLE: ${ANALYZER_WARM_IDLE:-600}
    volumes:
      - sample-store:/samples:ro
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp, /home/rizin]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${ANALYZER_MEMORY:-4g}
    cpus: ${ANALYZER_CPUS:-2}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # Runs Mandiant capa on samples for the Capabilities view, one at a time
  # (CPU-bound: minutes on large binaries). Same isolation as the analyzer:
  # read-only sample store, internal network only, no published port,
  # read-only filesystem, no capabilities, memory / CPU / time limits.
  capa:
    build: ./workers/capa
    environment:
      CAPA_TOKEN: ${CAPA_TOKEN:?CAPA_TOKEN is not set, run deploy/init-env.sh}
      CAPA_TIMEOUT: ${CAPA_TIMEOUT:-1800}
    volumes:
      - sample-store:/samples:ro
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${CAPA_MEMORY:-4g}
    cpus: ${CAPA_CPUS:-2}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # Turns mail attachments (PDF, Office, OpenDocument, RTF, images) into page
  # images: LibreOffice with macros disabled, then pdfium. Internal network
  # only (a document cannot call out), no published port, read-only
  # filesystem, no capabilities, memory / CPU limits.
  docview:
    build: ./workers/docview
    environment:
      DOCVIEW_TOKEN: ${DOCVIEW_TOKEN:?DOCVIEW_TOKEN is not set, run deploy/init-env.sh}
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${DOCVIEW_MEMORY:-2g}
    cpus: ${DOCVIEW_CPUS:-1}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # Reads packet captures with Wireshark's engine (tshark for the summary,
  # sharkd for the packet list, protocol tree, Follow Stream and Export
  # Objects). Read-only sample store, internal network only, no published
  # port, read-only filesystem, no capabilities (it never captures),
  # memory / CPU limits.
  pcap:
    build: ./workers/pcap
    environment:
      PCAP_TOKEN: ${PCAP_TOKEN:?PCAP_TOKEN is not set, run deploy/init-env.sh}
    volumes:
      - sample-store:/samples:ro
    networks: [analysis]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${PCAP_MEMORY:-4g}
    cpus: ${PCAP_CPUS:-2}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  # Isolated browser: opens HTML attachments and links in Chromium and sends
  # back screenshots; the analyst's clicks and typing are replayed here. The
  # only worker with a route to the internet (browser-egress), used only by
  # sessions the analyst opens with network. Chromium's sole route is the
  # worker's own filtering proxy, which resolves each name itself and refuses
  # private addresses and internal names for every connection, redirects
  # included. The backend reaches it on a network of its own
  # (browser-control): it shares none with the other workers, so the one
  # container that runs hostile pages cannot talk to them. Read-only
  # filesystem, no capabilities, memory / CPU limits, no published port.
  browser:
    build: ./workers/browser
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:?BROWSER_TOKEN is not set, run deploy/init-env.sh}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-3}
    networks: [browser-control, browser-egress]
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${BROWSER_MEMORY:-2g}
    cpus: ${BROWSER_CPUS:-2}
    pids_limit: 512
    logging: *logging
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      # Name users type in the browser; goes into the self-signed certificate.
      TLS_HOSTNAME: ${TLS_HOSTNAME:-localhost}
      # The HTTPS port as published below: plain HTTP redirects to it.
      TLS_PORT: ${WEB_TLS_PORT:-8443}
    ports:
      # Plain HTTP: answers only with a redirect to HTTPS.
      - "${WEB_PORT:-8080}:80"
      - "${WEB_TLS_PORT:-8443}:443"
    volumes:
      # Keeps the auto-generated certificate across container recreations.
      # Mount your own nik.crt / nik.key here to use a real certificate.
      - web-certs:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    # nginx binds 80/443 and steps down to its own user.
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${WEB_MEMORY:-512m}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
    logging: *logging
    restart: unless-stopped

volumes:
  db-data-18:
  # PostgreSQL 16 data (releases before 2.12.2). After the upgrade, remove it
  # with `podman volume rm <project>_db-data` once you no longer need a rollback.
  db-data:
  sample-store:
  web-certs:

networks:
  default:
  # Backend ↔ analysis workers only; `internal` gives them no route outside.
  analysis:
    internal: true
  # Backend ↔ isolated browser only, no route outside.
  browser-control:
    internal: true
  # The isolated browser's way out (no other service is on it).
  browser-egress:
