# nginx config used inside the `web` container: serve the static SPA and
# reverse-proxy /api to the `api` service (resolved by the compose network DNS).
#
# Nothing is served over plain HTTP: port 80 only redirects to HTTPS. The
# certificate is the operator's, mounted into /etc/nginx/certs, or the one
# self-signed at container start by /docker-entrypoint.d/15-gen-selfsigned.sh.
#
# The security headers come from two include files generated when the image is
# built from frontend/security-headers.js (the policy the end-to-end tests run
# under). nginx drops the inherited add_header lines in any location that has
# one of its own, so those locations include the file again.

server_tokens off;

server {
    listen 80;
    server_name _;

    # `return 308 https://$host[:port]$request_uri;`, written at start by
    # /docker-entrypoint.d/12-https-redirect.sh from TLS_PORT (the published
    # HTTPS port, which only the operator knows).
    include /tmp/nik-redirect.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/nik.crt;
    ssl_certificate_key /etc/nginx/certs/nik.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Large uploads (packet captures up to PCAP_MAX_MB, backup restore,
    # incidents with parsed artifacts) blow past nginx's 1m default and get
    # rejected with 413.
    client_max_body_size 600m;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/nik-headers-page.conf;

    # A mailbox (mbox, Maildir archive) can be gigabytes: this one upload has
    # the limit of MAILBOX_MAX_MB instead of the 600 MB of everything else.
    location = /api/artifacts/mailboxes {
        client_max_body_size 2100m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/nik-headers-api.conf;
    }

    # Fingerprinted assets can be cached forever…
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/nik-headers-page.conf;
    }

    # …but never cache the HTML entry point, so updates are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/nik-headers-page.conf;
    }

    # Prometheus metrics are for the monitoring system, not for whoever can
    # open the app: scrape http://api:8000/api/metrics on the compose network.
    location = /api/metrics {
        return 404;
    }

    # API → FastAPI backend container (service name "api", port 8000).
    location /api/ {
        proxy_pass http://api:8000;
        # Opening a large packet capture in Wireshark's engine takes minutes.
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The client's address as nginx saw it, not as the client claims: the
        # API rate-limits and locks out by it.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/nik-headers-api.conf;
    }

    # SPA fallback (harmless: the app has no client-side routing).
    location / {
        try_files $uri /index.html;
    }
}
